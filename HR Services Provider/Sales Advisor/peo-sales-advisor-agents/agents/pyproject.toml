[project]
name = "keel-agents"
version = "1.0.0"
description = "PEO Sales Advisor agents on Microsoft Agent Framework and Foundry"
requires-python = ">=3.11"
dependencies = ["agent-framework-foundry", "azure-identity", "starlette>=0.40", "uvicorn>=0.30"]

[project.scripts]
keel-agents = "keel_agents.host:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["keel_agents*"]
