<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Living Capital Service Map and Assembly Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Living Capital edition. Layout: sticky chapter bar → eight chapters. Overview and catalog run full width; architecture, assembly, decision and risk chapters split narrative left and a live architecture map right. The catalog is the spine: every service links to its bill of materials and lights up its components on the map. */
:root{
  color-scheme:light;
  --bg:#f6f7f8; --surface:#ffffff; --sunk:#eef1f3; --ink:#16222b; --muted:#5b6973; --line:#dde2e6;
  --accent:#1f5f7a; --accent-soft:#e3eef3; --brass:#9a6b1f;
  --ok:#1f7a52; --ok-bg:#e2f2ea; --warn:#8a6510; --warn-bg:#f7eed8; --bad:#a3412b; --bad-bg:#f8e6e1; --info:#5a5fa0; --info-bg:#e9eaf6;
  --on:#fff3cf; --on-line:#c99a2e;
  --f-display:"Familjen Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171c; --surface:#172129; --sunk:#1c2831; --ink:#e4eaee; --muted:#93a1ab; --line:#2a3741;
  --accent:#6fb3cf; --accent-soft:#1b3340; --brass:#d6a75a;
  --ok:#6fcf9f; --ok-bg:#16352a; --warn:#e2bd6a; --warn-bg:#3a2f15; --bad:#ee9a85; --bad-bg:#3d221c; --info:#a7abe8; --info-bg:#272a4a;
  --on:#3a3115; --on-line:#d6a75a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171c; --surface:#172129; --sunk:#1c2831; --ink:#e4eaee; --muted:#93a1ab; --line:#2a3741;
  --accent:#6fb3cf; --accent-soft:#1b3340; --brass:#d6a75a;
  --ok:#6fcf9f; --ok-bg:#16352a; --warn:#e2bd6a; --warn-bg:#3a2f15; --bad:#ee9a85; --bad-bg:#3d221c; --info:#a7abe8; --info-bg:#272a4a;
  --on:#3a3115; --on-line:#d6a75a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(22px,2.8vw,30px);font-weight:700}
h2{font-size:clamp(22px,2.6vw,28px);font-weight:600;line-height:1.15}
h3{font-size:16px;font-weight:600}
p{margin:0}
code{font:500 12px var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
button{font:inherit;color:inherit;cursor:pointer}
select,input{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{position:sticky;top:0;z-index:9;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.mast .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand p{color:var(--muted);font-size:13.5px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 10px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-right:6px}

main .wrap{padding-block:24px 64px}
.chapter{display:flex;flex-direction:column;gap:18px}
.chead{display:flex;flex-direction:column;gap:6px;max-width:920px}
.chead p{color:var(--muted);max-width:80ch}
.sub{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sub p{color:var(--muted);max-width:80ch;font-size:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:20px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:112px}
@media (max-width:980px){.sticky{position:static}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .k{font:500 11px var(--f-mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.card p{font-size:14px}
.card .it{font-size:13px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.callout{border-radius:6px;padding:10px 12px;font-size:14px;background:var(--accent-soft)}
.callout b{color:var(--accent)}
.hint{font:500 11.5px var(--f-mono);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font:500 11.5px var(--f-mono);padding:2px 8px;border-radius:4px;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)} .t-bad{background:var(--bad-bg);color:var(--bad)} .t-info{background:var(--info-bg);color:var(--info)} .t-mute{background:var(--sunk);color:var(--muted)} .t-acc{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
pre{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font:400 12.5px/1.6 var(--f-mono);color:var(--ink);white-space:pre}
.cap{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* overview */
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0;counter-reset:p}
@media (max-width:860px){.path{grid-template-columns:minmax(0,1fr)}}
.path li{counter-increment:p;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.path li.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.path li::before{content:"Stage " counter(p);font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.path p{font-size:13.5px;color:var(--muted)}
.custody{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch}
.party{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.party.h{border-top:3px solid var(--accent)} .party.c{border-top:3px solid var(--warn)}
.party ul{margin:0;padding-left:18px;font-size:13.5px}
.party .was{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bound{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;gap:6px}
.bound i{flex:1;border-left:2px dashed var(--info);min-height:12px}
.bound span{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--info);writing-mode:vertical-rl;transform:rotate(180deg)}
@media (max-width:720px){.custody{grid-template-columns:minmax(0,1fr)}.bound{flex-direction:row;padding:8px 0}.bound i{border-left:0;border-top:2px dashed var(--info);min-height:0}.bound span{writing-mode:horizontal-tb;transform:none}}
.vbar{display:flex;height:34px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.vbar div{display:flex;align-items:center;justify-content:center;font:500 12px var(--f-mono);min-width:0;white-space:nowrap;overflow:hidden}
.vlegend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.vlegend b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.m-A{background:var(--ok-bg);color:var(--ok)} .m-E{background:var(--info-bg);color:var(--info)} .m-P{background:var(--accent-soft);color:var(--accent)} .m-B{background:var(--bad-bg);color:var(--bad)}
.s-A{background:var(--ok)} .s-E{background:var(--info)} .s-P{background:var(--accent)} .s-B{background:var(--bad)}
.em .eq{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font:500 11.5px var(--f-mono)}
.em .eq span.op{color:var(--muted)}
.em .eq code{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-size:11.5px}
.em .eq strong{font:600 13.5px var(--f-display);color:var(--accent)}
.em .serves{display:flex;flex-wrap:wrap;gap:4px}
.chipbtn{font:500 11px var(--f-mono);border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:3px;padding:1px 6px}
.chipbtn:hover{border-color:var(--accent)}
.howto{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.howto li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.howto li b{font-family:var(--f-display);font-size:15px}

/* primer */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gloss .card h4{font-size:15px}
.gloss .an{font-size:13.5px}
.gloss .diff{font-size:13px;color:var(--muted)}
.search{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search input{min-width:240px;flex:1;max-width:420px}

/* catalog */
.filters{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.frow .lbl{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 11px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.active{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--on);border:1px solid var(--on-line);border-radius:6px;padding:6px 10px;font-size:13.5px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
#cat{min-width:980px}
#cat thead th{position:sticky;top:0;background:var(--surface);font:600 12.5px var(--f-display);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);z-index:1}
#cat th.c,#cat td.c{text-align:center}
tr.dom td{background:var(--bg);font:600 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px;border-bottom:1px solid var(--line)}
tr.dom td small{font:400 11.5px var(--f-body);text-transform:none;letter-spacing:0;margin-left:8px}
tr.row td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--accent-soft)}
tr.row.open td{background:var(--accent-soft)}
td.svc{padding-left:14px!important;min-width:240px}
.sid{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:8px;white-space:nowrap}
.newt{display:inline-block;margin-left:6px;font:500 10px var(--f-mono);color:var(--brass);letter-spacing:.04em;text-transform:uppercase}
.peo{font-size:12.5px;color:var(--muted)}
.peo code{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:5px;font-size:11px}
.pill{display:inline-flex;justify-content:center;min-width:64px;padding:2px 7px;border-radius:4px;font:500 11.5px var(--f-mono);white-space:nowrap}
.cu-A{color:var(--accent);background:var(--accent-soft)} .cu-C{color:var(--warn);background:var(--warn-bg)} .cu-J{color:var(--info);background:var(--info-bg)}
.b-C{color:var(--ok);background:var(--ok-bg)} .b-A{color:var(--warn);background:var(--warn-bg)} .b-P{color:var(--info);background:var(--info-bg)}
tr.detail td{background:var(--bg);border-bottom:1px solid var(--line);padding:12px 14px 16px}
.dg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px 28px;font-size:13.5px}
@media (max-width:760px){.dg{grid-template-columns:minmax(0,1fr)}}
.dg dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.dg dt{color:var(--muted)} .dg dd{margin:0}
.dg ul{margin:4px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.dg li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
.bom{display:flex;flex-wrap:wrap;gap:4px}
.bc{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--f-mono);padding:1px 6px;border-radius:3px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.d-X{background:var(--ok)} .d-T{background:var(--info)} .d-N{background:var(--bad)} .d-P{background:var(--accent)}
.ref{font:500 11px var(--f-mono);color:var(--brass)}
.empty{padding:24px;text-align:center;color:var(--muted)}
details.inv{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.inv summary{cursor:pointer;font-family:var(--f-display);font-weight:600}
.layers{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.layer{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:8px}
.layer .ln h4{font-size:14px}
.layer .ln p{font-size:12px;color:var(--muted)}
@media (max-width:720px){.layer{grid-template-columns:minmax(0,1fr)}}
.blocks{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.blk{display:inline-flex;align-items:center;gap:7px;font:500 12.5px var(--f-body);border:1px solid var(--line);background:var(--bg);padding:5px 9px 5px 7px;border-radius:5px;text-align:left;max-width:100%}
.blk:hover{border-color:var(--accent)}
.blk[aria-pressed="true"]{background:var(--on);border-color:var(--on-line)}
.blk .bid{font:500 10.5px var(--f-mono);color:var(--muted)}
.blk .uses{font:500 11px var(--f-mono);color:var(--muted);border-left:1px solid var(--line);padding-left:7px}

/* stepper narrative */
.story{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.story h3{font-size:20px}
.story .body{display:flex;flex-direction:column;gap:10px}
.story .body p,.story .body li{max-width:70ch}
.story .body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.stepmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:500 11px var(--f-mono);color:var(--muted);padding:0}
.dots button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.nav{display:flex;gap:8px}
.fields{display:flex;flex-direction:column;gap:6px}
.fld{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.fld code{color:var(--accent)}
.fld .svs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

/* architecture map */
.lens{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.lens select{max-width:100%;flex:1;min-width:200px}
.lensbar{background:var(--on);border:1px solid var(--on-line);border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.map{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px}
@media (max-width:560px){.map{grid-template-columns:minmax(0,1fr)}}
.bands{display:flex;flex-direction:column;gap:6px;min-width:0}
.band{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;background:var(--bg)}
.band.gw{border-color:var(--accent);background:var(--accent-soft)}
.band .bl,.rail .bl{font:600 11px var(--f-mono);letter-spacing:.04em;color:var(--muted);text-transform:uppercase;line-height:1.3}
.band.gw .bl{color:var(--accent)}
.comps{display:flex;flex-wrap:wrap;gap:4px}
.comp{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 7px;font-size:12px;line-height:1.3;text-align:left;transition:opacity .2s,background .2s}
.comp:hover{border-color:var(--accent)}
.comp.on{background:var(--on);border-color:var(--on-line);font-weight:600}
.comp.sel{outline:2px solid var(--accent);outline-offset:1px}
.map.focus .comp:not(.on){opacity:.35}
.railcol{display:flex;flex-direction:column;gap:8px}
.rail{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:6px;padding:6px}
.rail .comps{flex-direction:column}
.flowline{display:flex;justify-content:center;font:500 10.5px var(--f-mono);color:var(--muted);margin:-2px 0}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.detail dl{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.detail dt{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.detail dd{margin:0}
.ledger{display:flex;flex-direction:column;gap:4px;font-size:13px}
.ledger div{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px}
.ledger div span:first-child{font:500 11px var(--f-mono);color:var(--muted);padding-top:2px}
.ledger div.new{background:var(--on);border-radius:4px}

/* risk */
.scen{display:flex;flex-wrap:wrap;gap:6px}
.scen button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.scen button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);font-size:13.5px}
.chk.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chk.fut{opacity:.4}
.verdict{border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;background:var(--sunk)}
.verdict .lbl{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.verdict .v{font-size:14px}

/* governance */
.mx{min-width:1060px}
.mx th,.mx td,.st th,.st td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.mx thead th,.st th{font:600 12.5px var(--f-display);background:var(--surface);vertical-align:bottom}

 {t:"PEO operations: the source of everything",hl:["H1","H2","H3","H4","H5","H6","H7","H9","H10","H11","H12","H13","H14"],b:`<p>Every service extends something Insperity runs today: payroll, time, leave, benefits, unemployment filing, retirement, learning and service teams. That is why so many services are ready on day one.</p><p>No new system of record is created. Living Capital reads these systems; it does not replace them.</p>`},
 {t:"Mediation Holon: map, don't migrate",hl:["M1","M2","M3","P2","SR"],b:`<p>Punches and project codes in Premier, leave in Workday and enrollments with carriers are mapped to concepts such as paid hours, production hours, leave type and team.</p><ul><li>The <b>URI registry</b> gives each worker, team and client one ID across systems.</li><li><b>Lineage agents</b> catch schema changes, so a renamed column updates a mapping instead of breaking a metric.</li><li>The <b>virtual graph</b> reads data in place: no copies, no second store to secure.</li></ul>`},
 {t:"The Keel: definitions, norms, classification",hl:["K1","K2","K3","K4","K5"],b:`<p>Metrics are defined once, as concepts, so capacity load means the same thing in every report. Laws become typed norms: FLSA pay rules, BIPA and ADA limits, consent for the talent exchange, purpose limits on every metric.</p><p>Classification does the privacy work: person-level hours are C3, medical leave reasons are C4, and team aggregates drop to C2 only with 5 or more people. A context rule raises any smaller group back to C3.</p>`},
 {t:"Governance layer: compiled into tools you run",hl:["R2","R3","R1","P1"],b:`<p>Each definition and rule is compiled into runtime targets: dbt metrics and minimum-cell tests, Fabric row-level security and masks, OPA disclosure rules and scheduling rule packs. Every artifact links back to the rule that produced it.</p><p>Harmonization runs first. It is what catches, for example, an enterprise lab's benefit plan conflicting with its parent's controlled-group testing.</p>`},
 {t:"Gateway and agents",hl:["G1","G2","G4","G5","N1","N2","N3","N4"],b:`<p>Every request, whether an owner asking a question or a scheduled manager alert, gets a context bundle that includes its purpose. The disclosure matrix decides what each audience may see; the service facade checks the answer before it leaves.</p><p>The <b>approval gate</b> holds irreversible steps, such as a reduction in force or a secondment start, until an authorized person signs off.</p>`},
 {t:"Operations rail, new builds and partners",hl:["O1","O2","O3","O4","Z1","Z2","Z3","Q1","Q2","Q3","Q4"],b:`<p>Provenance, review, impact analysis and the DEV/STG/PRD lifecycle run alongside every layer.</p><p>Only three components are new: the matching marketplace, the secondment framework and the pooled fund vehicle. The last two also wait for counsel. Four partner categories supply mental health, care, ownership advice and coaching.</p>`}
];

const ASM=[
 {t:"The service and its starting point",hl:[],b:`<p><b>CAP.01 Workforce slack index</b> shows planned versus available hours by team and flags teams running above 80% production load for two consecutive periods. Its output also feeds the <b>MEAS.01 regeneration scorecard</b>.</p><p>Built from scratch, this needs a pipeline from timekeeping, a metrics store, a privacy review, a dashboard and an alerting service. On the platform, every one of those exists. The work is six steps.</p><div class="callout"><b>Watch the map:</b> highlighted components are configured in each step.</div>`,led:[]},
 {t:"Specify the governance contract",hl:["K2","HU"],b:`<p>A steward writes the ORSD before anything is modeled. The release rule protects small teams, including against subtraction.</p>`,code:["ORSD · illustrative","orsd: lc:CapacityLoad\npurpose: Show where teams run above sustainable load without exposing individuals\nscope: client teams on Living Capital; source: time and attendance\nnorms:\n  obligation:  flag a team above 80% production load for two consecutive periods\n  permission:  show team aggregates to the client admin and that team's manager\n  prohibition: release one person's hours to anyone but the worker, their manager and HR\nrelease rule: a team under 5 is combined with others, and no figure is shown\n              that would let it be subtracted back out\nsteward: Workforce Analytics Domain Governance Team"],led:["ORSD lc:CapacityLoad approved"]},
 {t:"Model the concepts and norms",hl:["K1","K3","K4","K5","K2"],b:`<p>The concepts, the small-team context rule and the alert norm go into a domain holon as a KGCL change request. Person-level hours are C3; the team metric is C2.</p>`,code:["Turtle · illustrative syntax","lc:paidHours       isp-class:defaultSensitivity isp-class:C3 .\nlc:productionHours isp-class:defaultSensitivity isp-class:C3 .\n\nlc:capacityLoad a owl:Class ;\n    skos:definition \"Production hours divided by paid hours, per team and period.\" ;\n    isp-class:defaultSensitivity isp-class:C2 .\n\nlc:Rule_SmallTeam a isp-class:ContextRule ;\n    isp-class:combines lc:capacityLoad , pes:headcount ;\n    isp-class:condition \"Fewer people in the team than the minimum cell size.\" ;\n    isp-class:resultingSensitivity isp-class:C3 .\n\nlc:Norm_FlagOverload a lkif:Obligation ;\n    lc:condition \"capacityLoad > 0.80 for 2 consecutive periods\" ;\n    lkif:sanction lc:ManagerAlert .\n\n# CR-0212  target: ontology-domain-workforce  approver: Workforce Analytics DGT"],led:["KGCL CR-0212: capacity concepts, small-team rule, alert norm"]},
 {t:"Map the time data",hl:["M1","M3","P2","H2","SR"],b:`<p>Premier's time columns are mapped to the concepts. Project codes are mapped to production or reserved time through a code list. Codes nobody has mapped stay Held at C3 and are left out of the metric until a steward classifies them.</p>`,code:["Mapping assertions","wb:map_paid_hours a isp-map:Mapping ;\n    isp-map:subject lc:paidHours ; isp-map:predicate skos:exactMatch ;\n    isp-map:object wb:col_premier_time_hours ;\n    isp-map:correspondenceType isp-map:DomainToAssetSchema ;\n    isp-map:status isp-map:Validated .\n\nwb:map_production_codes a isp-map:Mapping ;\n    isp-map:subject lc:productionHours ; isp-map:predicate skos:narrowMatch ;\n    isp-map:object wb:codelist_premier_project_production ;\n    isp-map:correspondenceType isp-map:DomainToAssetSchema ;\n    isp-map:status isp-map:Validated ."],led:["Time columns and project-code list mapped and validated"]},
 {t:"Compile the rules",hl:["R2","R3","R1","P1"],b:`<p>Harmonization finds no conflicts. The pipeline emits a dbt metric with a minimum-cell test and an OPA disclosure rule, each linked to its source.</p>`,code:["Generated · dbt and Rego","# dbt  (source: lc:capacityLoad, release 2026.10.3)\nmetrics:\n  - name: capacity_load\n    expr: sum(production_hours) / sum(paid_hours)\n    dimensions: [client_id, team_id, period]\ntests:\n  - min_cell_size: {group_by: [client_id, team_id], min: 5,\n                    on_fail: combine, block_subtraction: true}\n\n# Rego  (source: lc:CapacityLoad norms)\npackage lc.capacity\nallow if {\n    input.level == \"team\"\n    input.cell_size >= 5\n    input.role in {\"client_admin\", \"team_manager\"}\n}\nallow if {\n    input.level == \"person\"\n    input.subject == input.requester\n}"],led:["Harmonization: no conflicts","dbt metric and OPA rule published, release 2026.10.3"]},
 {t:"Compose the experience",hl:["N3","N4","N2","G1"],b:`<p>The metric is registered with the Insights agent and the alert with the Composer. When a team trips the norm, its manager gets an alert with suggested next steps from other Living Capital services.</p>`,code:["Registration","{\n  \"metric\": \"lc:capacityLoad\",\n  \"agent\": \"insights\",\n  \"release\": \"keel:release/2026.10.3\",\n  \"audiences\": [\"client_admin\", \"team_manager\", \"worker_self\"],\n  \"alert\": {\n    \"norm\": \"lc:Norm_FlagOverload\",\n    \"route\": \"team_manager\",\n    \"suggest\": [\"CAP.05\", \"REC.02\", \"POOL.01\"]\n  },\n  \"feeds\": [\"MEAS.01\"]\n}"],led:["Metric and alert registered; feeds the scorecard"]},
 {t:"Prove and promote",hl:["O4","O2","HU"],b:`<p>Fixtures prove the rules, including the cases that must fail, before promotion from DEV to STG to PRD.</p>`,code:["Fixtures","valid    team of 12 at 86% for 2 periods            → alert to manager\nvalid    team of 12 at 78%                          → no alert\ninvalid  team of 3 shown on its own                 → combined   (expected)\ninvalid  all-teams-but-one total revealing a team of 3 → blocked (expected)\ninvalid  a peer manager asks for one person's hours → denied     (expected)"],after:`<div class="callout"><b>Built new for this service:</b> one extension, the capacity metric pack. Everything else is configuration: one ORSD, one change request, two mappings, two compiled artifacts and one registration.</div>`,led:["Fixtures: 2 pass, 3 fail as designed","Promoted to PRD"]}
];

 {t:"The owner asks a question",hl:["CM","N1"],b:`<p>The owner of Hudson Design Studio asks the advisor: <i>"Which of my teams are running hot?"</i> The orchestrator recognizes a capacity question and routes it to Insights. It holds no data access itself.</p>`,led:["Request received from the client admin"],state:["Received","t-info"]},
 {t:"Who is asking, and why",hl:["G1","CM"],b:`<p>The gateway resolves the requester: client admin role, tenant Hudson. The context bundle records purpose as <b>advisory</b>, which this metric permits. A request with purpose <i>performance evaluation of individuals</i> would be refused here.</p>`,led:["Role and tenant verified; purpose advisory permitted"],state:["Identified","t-info"]},
 {t:"Pin the rules",hl:["G1","K2","K5"],b:`<p>The request is evaluated against release 2026.10.3 of the rules, so the answer can be reproduced later. Context: owner persona, capacity load, last three periods, Hudson's Illinois worksite.</p>`,led:["Rules pinned: keel:release/2026.10.3"],state:["In context","t-info"]},
 {t:"Compute in place",hl:["N3","P2","M1","H2"],b:`<p>Insights runs the compiled metric over Premier's time data through the virtual graph. No data is copied, and the language model does none of the arithmetic.</p>`,code:["Raw result · not yet released","team                  people   load, last 3 periods\nStudio operations        14     88%  91%  87%\nClient services          11     79%  78%  80%\nDesigners                 3     94%  96%  92%\nAdmin and finance        12     71%  70%  73%"],led:["Metric computed for 4 teams (40 people)"],state:["Computed","t-info"]},
 {t:"Classify every cell",hl:["K5","P1"],b:`<p>Each figure is classified before anyone sees it. Three teams have 5 or more people and drop to C2. The designers are 3 people, so the small-team rule raises their figure to C3.</p><p>The minimum-cell test combines the designers with admin and finance. Because the other two teams are shown and the owner knows the studio's headcount, the studio total is also withheld, so the designers cannot be subtracted back out.</p>`,code:["After classification","Studio operations     14   88% 91% 87%   C2   released, flagged\nClient services       11   79% 78% 80%   C2   released\nDesign, admin, finance 15  77% 76% 78%   C2   combined group\nStudio total          40   —              —    withheld (subtraction)"],led:["Small-team rule applied to Designers (3)","Combined group formed; studio total withheld"],state:["Classified","t-warn"]},
 {t:"Disclose by audience",hl:["G2","G4"],b:`<p>The disclosure matrix allows a client admin to see team aggregates at C2. No individual's hours are released. The service facade checks that the answer carries its level and sources.</p>`,led:["Disclosure: team aggregates permitted; facade check passed"],state:["Released","t-ok"]},
 {t:"Answer with next steps",hl:["N4","HU"],b:`<p>The Composer drafts the answer: Studio operations has been above 80% for three periods and has tripped the alert. It suggests time-off nudges (CAP.05), a sabbatical backfill plan (REC.02) and a temporary match from the talent exchange (POOL.01). It explains in one line why design is shown as a combined group, and offers a call with the HR specialist.</p>`,led:["Answer drafted; HR specialist offered"],state:["Answered","t-ok"]},
 {t:"Record",hl:["O1"],b:`<p>The provenance store records the metric release, cell sizes, the small-team rule, the combined group, the audience and the purpose. The same figures flow into the regeneration scorecard under the same rules.</p><div class="callout"><b>Result:</b> the owner can act on real load data without ever seeing an individual's hours or a 3-person team's figures.</div>`,led:["PROV-O record written; scorecard updated"],state:["Recorded","t-ok"]}

  </tbody></table></div>
  <div class="sub"><h2>Counsel gates</h2><p>${gates.length} services need a legal ruling before launch. Each has an interim position; once counsel rules, the answer is written as a norm and enforced like any other rule.</p></div>
  <div class="tablebox"><table class="st"><thead><tr><th>Service</th><th>Question for counsel</th><th>Until counsel rules</th></tr></thead><tbody>${gates.map(r=>`<tr><td>${svcChip(r[0])} ${esc(r[2])}</td><td>${esc(r[9])}</td><td>${esc(LGATE[r[0]]||"Not offered")}</td></tr>`).join("")}</tbody></table></div>
  <div class="find">
   <div class="card"><h3>Never collected</h3><ul><li>Biometric or wearable data of any kind</li><li>Message or meeting content</li><li>Individual survey answers, to anyone but the worker</li><li>Another client's identifiable data</li></ul></div>
   <div class="card"><h3>Defense in depth</h3><ul><li>${two} of ${RISK.length} scenarios meet at least two independent preventive or detective controls before harm can occur.</li><li>The rest rely on harmonization plus human review, which is why those services carry a counsel gate.</li></ul></div>
   <div class="card"><h3>Where exposure remains</h3><ul><li>State-specific wage-and-hour and monitoring-notice rules not yet in the jurisdiction terms.</li><li>Unmapped time codes, held at C3 until a steward classifies them.</li><li>Open legal questions on pooled funds and secondments.</li></ul></div>
  </div>`;
}
function bindGov(){
  $$(".mx tbody tr").forEach(tr=>{const f=()=>{scen=tr.dataset.s;step.risk=RISK.find(r=>r.id===scen).checks.length;go("risk")};tr.onclick=f;tr.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();f()}}});
}

function bindGo(root){$$("[data-go]",root||document).forEach(b=>b.onclick=e=>{e.stopPropagation();go(b.dataset.go)})}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function render(){
  const c=CH.find(x=>x.id===chap);
  $$(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.c===chap));
  const R={overview:renderOverview,primer:renderPrimer,catalog:renderCatalog,arch:()=>renderSteps("arch",ARCH,""),assemble:()=>renderSteps("assemble",ASM,"Artifacts produced so far"),decision:()=>renderSteps("decision",DEC,"Evidence recorded so far"),risk:renderRisk,gov:renderGov};
  $("#main").innerHTML=`<section class="chapter" role="tabpanel" aria-labelledby="t-${chap}"><div class="chead"><span class="eyebrow">Chapter ${CH.indexOf(c)+1} of ${CH.length}</span><h2>${c.title}</h2><p>${c.lede}</p></div>${R[chap]()}</section>`;
  if(chap==="primer")bindPrimer();
  if(chap==="catalog")bindCatalog();
  if(["arch","assemble","decision"].includes(chap)){const steps={arch:ARCH,assemble:ASM,decision:DEC}[chap];bindStepper(chap,steps);bindMap(steps[step[chap]].hl)}
  if(chap==="risk")bindRisk();
  if(chap==="gov")bindGov();
  bindGo($("#main"));bindSvcChips($("#main"));
}
function go(id,keepLens){if(!keepLens)lens=null;chap=id;try{history.replaceState(null,"","#"+id)}catch(e){}render();window.scrollTo({top:0})}

$("#tabs").innerHTML=CH.map((c,i)=>`<button class="tab" role="tab" id="t-${c.id}" data-c="${c.id}"><span class="n">${i+1}</span>${c.n}</button>`).join("");
$$(".tab").forEach(t=>t.onclick=()=>go(t.dataset.c));
addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select"))return;
  if(!["ArrowRight","ArrowLeft"].includes(e.key))return;
  const b=e.key==="ArrowRight"?($("#next")||$("#rnext")):($("#prev")||$("#rprev"));
  if(b&&!b.disabled){e.preventDefault();b.click()}
});
$("#foot").innerHTML=`Woven from the Living Capital Service Map with an assembly model on the Keel and North Star platform. Sources: ${SOURCES_ALL.map(([t,,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join(" · ")}. Code, values, names and the Hudson Design Studio example are illustrative. "Exists" means defined in the architecture or run by today's PEO operations; legal questions are flagged, not answered.`;
const start=(location.hash||"").slice(1);
go(CH.some(c=>c.id===start)?start:"overview");

</script>
