<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AEO Service Map and Assembly Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky chapter bar → eight chapters. Overview and catalog run full width; architecture, assembly, decision and risk chapters split narrative left and a live architecture map right. The catalog is the spine: every service links to its bill of materials and lights up its components on the map. */
:root{
  color-scheme:light;
  --bg:#f6f7f8; --surface:#ffffff; --sunk:#eef1f3; --ink:#16222b; --muted:#5b6973; --line:#dde2e6;
  --accent:#1f5f7a; --accent-soft:#e3eef3; --brass:#9a6b1f;
  --ok:#1f7a52; --ok-bg:#e2f2ea; --warn:#8a6510; --warn-bg:#f7eed8; --bad:#a3412b; --bad-bg:#f8e6e1; --info:#5a5fa0; --info-bg:#e9eaf6;
  --on:#fff3cf; --on-line:#c99a2e;
  --f-display:"Familjen Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10171c; --surface:#172129; --sunk:#1c2831; --ink:#e4eaee; --muted:#93a1ab; --line:#2a3741;
  --accent:#6fb3cf; --accent-soft:#1b3340; --brass:#d6a75a;
  --ok:#6fcf9f; --ok-bg:#16352a; --warn:#e2bd6a; --warn-bg:#3a2f15; --bad:#ee9a85; --bad-bg:#3d221c; --info:#a7abe8; --info-bg:#272a4a;
  --on:#3a3115; --on-line:#d6a75a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10171c; --surface:#172129; --sunk:#1c2831; --ink:#e4eaee; --muted:#93a1ab; --line:#2a3741;
  --accent:#6fb3cf; --accent-soft:#1b3340; --brass:#d6a75a;
  --ok:#6fcf9f; --ok-bg:#16352a; --warn:#e2bd6a; --warn-bg:#3a2f15; --bad:#ee9a85; --bad-bg:#3d221c; --info:#a7abe8; --info-bg:#272a4a;
  --on:#3a3115; --on-line:#d6a75a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(22px,2.8vw,30px);font-weight:700}
h2{font-size:clamp(22px,2.6vw,28px);font-weight:600;line-height:1.15}
h3{font-size:16px;font-weight:600}
p{margin:0}
code{font:500 12px var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
button{font:inherit;color:inherit;cursor:pointer}
select,input{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mast{position:sticky;top:0;z-index:9;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.mast .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand p{color:var(--muted);font-size:13.5px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px 10px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-right:6px}

main .wrap{padding-block:24px 64px}
.chapter{display:flex;flex-direction:column;gap:18px}
.chead{display:flex;flex-direction:column;gap:6px;max-width:920px}
.chead p{color:var(--muted);max-width:80ch}
.sub{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.sub p{color:var(--muted);max-width:80ch;font-size:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:20px;align-items:start}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:112px}
@media (max-width:980px){.sticky{position:static}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .k{font:500 11px var(--f-mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.card p{font-size:14px}
.card .it{font-size:13px;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.callout{border-radius:6px;padding:10px 12px;font-size:14px;background:var(--accent-soft)}
.callout b{color:var(--accent)}
.hint{font:500 11.5px var(--f-mono);color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font:500 11.5px var(--f-mono);padding:2px 8px;border-radius:4px;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-warn{background:var(--warn-bg);color:var(--warn)} .t-bad{background:var(--bad-bg);color:var(--bad)} .t-info{background:var(--info-bg);color:var(--info)} .t-mute{background:var(--sunk);color:var(--muted)} .t-acc{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
pre{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font:400 12.5px/1.6 var(--f-mono);color:var(--ink);white-space:pre}
.cap{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* overview */
.path{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0;counter-reset:p}
@media (max-width:860px){.path{grid-template-columns:minmax(0,1fr)}}
.path li{counter-increment:p;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.path li.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.path li::before{content:"Stage " counter(p);font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.path p{font-size:13.5px;color:var(--muted)}
.custody{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:stretch}
.party{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.party.h{border-top:3px solid var(--accent)} .party.c{border-top:3px solid var(--warn)}
.party ul{margin:0;padding-left:18px;font-size:13.5px}
.party .was{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bound{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;gap:6px}
.bound i{flex:1;border-left:2px dashed var(--info);min-height:12px}
.bound span{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--info);writing-mode:vertical-rl;transform:rotate(180deg)}
@media (max-width:720px){.custody{grid-template-columns:minmax(0,1fr)}.bound{flex-direction:row;padding:8px 0}.bound i{border-left:0;border-top:2px dashed var(--info);min-height:0}.bound span{writing-mode:horizontal-tb;transform:none}}
.vbar{display:flex;height:34px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.vbar div{display:flex;align-items:center;justify-content:center;font:500 12px var(--f-mono);min-width:0;white-space:nowrap;overflow:hidden}
.vlegend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.vlegend b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.m-A{background:var(--ok-bg);color:var(--ok)} .m-E{background:var(--info-bg);color:var(--info)} .m-P{background:var(--accent-soft);color:var(--accent)} .m-B{background:var(--bad-bg);color:var(--bad)}
.s-A{background:var(--ok)} .s-E{background:var(--info)} .s-P{background:var(--accent)} .s-B{background:var(--bad)}
.em .eq{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font:500 11.5px var(--f-mono)}
.em .eq span.op{color:var(--muted)}
.em .eq code{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-size:11.5px}
.em .eq strong{font:600 13.5px var(--f-display);color:var(--accent)}
.em .serves{display:flex;flex-wrap:wrap;gap:4px}
.chipbtn{font:500 11px var(--f-mono);border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:3px;padding:1px 6px}
.chipbtn:hover{border-color:var(--accent)}
.howto{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.howto li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.howto li b{font-family:var(--f-display);font-size:15px}

/* primer */
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gloss .card h4{font-size:15px}
.gloss .an{font-size:13.5px}
.gloss .diff{font-size:13px;color:var(--muted)}
.search{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search input{min-width:240px;flex:1;max-width:420px}

/* catalog */
.filters{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.frow .lbl{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:4px 11px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.active{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--on);border:1px solid var(--on-line);border-radius:6px;padding:6px 10px;font-size:13.5px}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
#cat{min-width:980px}
#cat thead th{position:sticky;top:0;background:var(--surface);font:600 12.5px var(--f-display);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);z-index:1}
#cat th.c,#cat td.c{text-align:center}
tr.dom td{background:var(--bg);font:600 12px var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px;border-bottom:1px solid var(--line)}
tr.dom td small{font:400 11.5px var(--f-body);text-transform:none;letter-spacing:0;margin-left:8px}
tr.row td{border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--accent-soft)}
tr.row.open td{background:var(--accent-soft)}
td.svc{padding-left:14px!important;min-width:240px}
.sid{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-right:8px;white-space:nowrap}
.newt{display:inline-block;margin-left:6px;font:500 10px var(--f-mono);color:var(--brass);letter-spacing:.04em;text-transform:uppercase}
.peo{font-size:12.5px;color:var(--muted)}
.peo code{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:5px;font-size:11px}
.pill{display:inline-flex;justify-content:center;min-width:64px;padding:2px 7px;border-radius:4px;font:500 11.5px var(--f-mono);white-space:nowrap}
.cu-A{color:var(--accent);background:var(--accent-soft)} .cu-C{color:var(--warn);background:var(--warn-bg)} .cu-J{color:var(--info);background:var(--info-bg)}
.b-C{color:var(--ok);background:var(--ok-bg)} .b-A{color:var(--warn);background:var(--warn-bg)} .b-P{color:var(--info);background:var(--info-bg)}
tr.detail td{background:var(--bg);border-bottom:1px solid var(--line);padding:12px 14px 16px}
.dg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px 28px;font-size:13.5px}
@media (max-width:760px){.dg{grid-template-columns:minmax(0,1fr)}}
.dg dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.dg dt{color:var(--muted)} .dg dd{margin:0}
.dg ul{margin:4px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.dg li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
.bom{display:flex;flex-wrap:wrap;gap:4px}
.bc{display:inline-flex;align-items:center;gap:4px;font:500 11px var(--f-mono);padding:1px 6px;border-radius:3px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.d-X{background:var(--ok)} .d-T{background:var(--info)} .d-N{background:var(--bad)} .d-P{background:var(--accent)}
.ref{font:500 11px var(--f-mono);color:var(--brass)}
.empty{padding:24px;text-align:center;color:var(--muted)}
details.inv{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.inv summary{cursor:pointer;font-family:var(--f-display);font-weight:600}
.layers{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.layer{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:8px}
.layer .ln h4{font-size:14px}
.layer .ln p{font-size:12px;color:var(--muted)}
@media (max-width:720px){.layer{grid-template-columns:minmax(0,1fr)}}
.blocks{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.blk{display:inline-flex;align-items:center;gap:7px;font:500 12.5px var(--f-body);border:1px solid var(--line);background:var(--bg);padding:5px 9px 5px 7px;border-radius:5px;text-align:left;max-width:100%}
.blk:hover{border-color:var(--accent)}
.blk[aria-pressed="true"]{background:var(--on);border-color:var(--on-line)}
.blk .bid{font:500 10.5px var(--f-mono);color:var(--muted)}
.blk .uses{font:500 11px var(--f-mono);color:var(--muted);border-left:1px solid var(--line);padding-left:7px}

/* stepper narrative */
.story{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.story h3{font-size:20px}
.story .body{display:flex;flex-direction:column;gap:10px}
.story .body p,.story .body li{max-width:70ch}
.story .body ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.stepmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:500 11px var(--f-mono);color:var(--muted);padding:0}
.dots button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.nav{display:flex;gap:8px}
.fields{display:flex;flex-direction:column;gap:6px}
.fld{display:grid;grid-template-columns:100px minmax(0,1fr);gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
.fld code{color:var(--accent)}
.fld .svs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

/* architecture map */
.lens{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.lens select{max-width:100%;flex:1;min-width:200px}
.lensbar{background:var(--on);border:1px solid var(--on-line);border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.map{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px}
@media (max-width:560px){.map{grid-template-columns:minmax(0,1fr)}}
.bands{display:flex;flex-direction:column;gap:6px;min-width:0}
.band{border:1px solid var(--line);border-radius:6px;padding:6px 8px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;align-items:center;background:var(--bg)}
.band.gw{border-color:var(--accent);background:var(--accent-soft)}
.band .bl,.rail .bl{font:600 11px var(--f-mono);letter-spacing:.04em;color:var(--muted);text-transform:uppercase;line-height:1.3}
.band.gw .bl{color:var(--accent)}
.comps{display:flex;flex-wrap:wrap;gap:4px}
.comp{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 7px;font-size:12px;line-height:1.3;text-align:left;transition:opacity .2s,background .2s}
.comp:hover{border-color:var(--accent)}
.comp.on{background:var(--on);border-color:var(--on-line);font-weight:600}
.comp.sel{outline:2px solid var(--accent);outline-offset:1px}
.map.focus .comp:not(.on){opacity:.35}
.railcol{display:flex;flex-direction:column;gap:8px}
.rail{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:6px;padding:6px}
.rail .comps{flex-direction:column}
.flowline{display:flex;justify-content:center;font:500 10.5px var(--f-mono);color:var(--muted);margin:-2px 0}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.detail dl{margin:0;display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.detail dt{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.detail dd{margin:0}
.ledger{display:flex;flex-direction:column;gap:4px;font-size:13px}
.ledger div{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px}
.ledger div span:first-child{font:500 11px var(--f-mono);color:var(--muted);padding-top:2px}
.ledger div.new{background:var(--on);border-radius:4px}

/* risk */
.scen{display:flex;flex-wrap:wrap;gap:6px}
.scen button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.scen button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);font-size:13.5px}
.chk.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.chk.fut{opacity:.4}
.verdict{border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;background:var(--sunk)}
.verdict .lbl{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.verdict .v{font-size:14px}

/* governance */
.mx{min-width:1060px}
.mx th,.mx td,.st th,.st td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.mx thead th,.st th{font:600 12.5px var(--f-display);background:var(--surface);vertical-align:bottom}
.mx thead th small{display:block;font:400 10.5px var(--f-mono);color:var(--muted);margin-top:2px}
.mx td.c{text-align:center;vertical-align:middle}
.mx tr:last-child td,.st tr:last-child td{border-bottom:0}
.mx tbody tr{cursor:pointer}
.mx tbody tr:hover td{background:var(--accent-soft)}
.st{min-width:760px}
.st td:first-child{font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.norm{font:500 11.5px var(--f-mono);padding:2px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.cell{display:inline-flex;gap:2px}
.cell span{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font:600 11px var(--f-mono)}
.c-P{background:var(--ok-bg);color:var(--ok)} .c-D{background:var(--info-bg);color:var(--info)} .c-R{background:var(--warn-bg);color:var(--warn)} .c-E{background:var(--sunk);color:var(--muted)} .c-T{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);align-items:center}
.find{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.find ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
footer{color:var(--muted);font-size:12.5px;padding-block:8px 40px}
footer a{color:var(--accent)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:5px;font-size:13px;z-index:20}
@media (max-width:720px){.mast{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

 ["Map, don't migrate","Systems of record stay where they are. A mapping graph ties their columns and documents to business concepts, so a schema change only touches a mapping.","IT today: point-to-point integrations refactored every time a source changes."],
 ["Classify concepts, not files","Sensitivity is set on concepts like pay rate or medical leave reason. Anything mapped to a concept inherits its level, and derived content takes the highest level of its inputs.","IT today: labels applied file by file, missing everything generated."],

/* ---------- Architecture steps ---------- */
const ARCH=[
 {t:"Who acts",hl:["CA","IA","HU"],b:`<p>Three kinds of actor touch the platform. <b>Insperity agents</b> come first: they prove every control internally. <b>Client agents</b> join later as another agent family on the same contract; that is the AEO. <b>People</b> approve and review whatever the platform holds.</p><div class="callout"><b>Key idea:</b> the AEO adds no new kind of actor. A client's agent is governed exactly like Insperity's own.</div>`},
 {t:"North Star: the agent fabric",hl:["N1","N2","N3","N4","N5"],b:`<p>Work is split across small agents instead of one large one. The orchestrator delegates but holds no data access. Each domain agent sees only its domain. Insights runs governed SQL rather than letting a model do arithmetic.</p><p>Every action leaves the fabric as a <b>decision envelope</b>. Agents cannot call action tools directly, so nothing reaches a system of action unobserved.</p><div class="callout"><b>For IT:</b> think least-privilege microservices where every outbound call is a structured, approvable event.</div>`},
 {t:"The gateway: one checkpoint, no side doors",hl:["G1","G2","G3","G4","G5","G6","G7"],b:`<p>Every call passes the gateway, including calls from one agent to another. Otherwise an orchestrator could pass data to an agent that should not see it.</p><ul><li><b>Stage 0</b> builds the context bundle: who, what, when, where, why.</li><li><b>Steps 1–4</b> check structure, time rules, six policy domains and unsafe actions.</li><li><b>Step 5</b> gives the agent governed context, not raw instructions.</li><li>The <b>service facade</b> checks output; the <b>Simplex gate</b> holds irreversible actions; the <b>circuit breaker</b> measures drift; <b>sanitization</b> keeps bad output out of training.</li></ul>`},
 {t:"The governance layer: rules compiled, not re-coded",hl:["R2","R3","R1"],b:`<p>Rules are written once in the Keel. Before any change ships, the harmonization engine checks the whole rule set for conflicts. Projection agents then compile each rule through six stages into the formats your enforcement points already run.</p><pre>SHACL / SWRL / LKIF rule
  → parse → extract → harmonize → map target → generate → version + publish
  → OPA policy · dbt test · search filter · JSON Schema contract</pre><p>Each compiled artifact carries a URI back to its source rule, so an auditor can always ask which approved rule allowed a behavior.</p>`},
 {t:"The Keel: the model and its rules",hl:["K1","K2","K3","K4","K5","D2"],b:`<p>The Keel holds Insperity's intellectual property: the business model, its constraints, its norms and its classification. Changes arrive only as reviewed change requests and ship as pinned releases.</p><p>Classification is attached to concepts. Map a column to <i>pay rate</i> and it is C3 automatically; derived content takes the highest level of its inputs; only a steward-validated mapping can ever lower a level.</p><p>The <b>agent registry</b> also lives here: every agent's identity, tenant, decision types, tools, attested model and clearance.</p>`},
 {t:"The Mediation Holon: map, don't migrate",hl:["M1","M2","M3","M4"],b:`<p>Between the business model and the physical systems sits a persistent mapping layer. Lineage agents watch source systems and propose mapping updates when schemas drift; stewards approve them.</p><ul><li>The <b>URI registry</b> resolves every system's ID for a vendor, worker or client to one canonical entity.</li><li><b>RAG anchors</b> bind retrieved text to those entities before any rule runs, so an ungrounded chunk is never treated as fact.</li></ul><div class="callout"><b>For IT:</b> when Premier or Workday changes a schema, only a mapping changes. Nothing built on top is touched.</div>`},
 {t:"Ports and data: your estate, unchanged",hl:["P1","P2","SR"],b:`<p>Compiled rules run on enforcement points you already operate: OPA behind API Management, Fabric and dbt masks, search filters, Purview labels, Sentinel. Systems of record are read through a virtual graph, with no copies.</p><p>The platform is stack-independent: Microsoft components are the first adapters, not a dependency.</p>`},
 {t:"The operations rail",hl:["O1","O2","O3","O4"],b:`<p>Four operational capabilities run alongside every layer.</p><ul><li><b>Provenance store:</b> every measurement, verdict, approval and release.</li><li><b>Trustee workbench:</b> where people dispose of held decisions.</li><li><b>OPS Workbench:</b> change impact and health across all levels.</li><li><b>DEV, STG, PRD:</b> rules and agents promoted only after valid fixtures pass and invalid fixtures fail as designed.</li></ul>`}
];

const ASM=[
 {t:"The service and its starting point",hl:[],b:`<p>A client wants its accounts-payable agent to pay vendors on its own up to a limit, with anything larger held for its controller. In the AEO catalog that is <b>MET.03 Budget caps</b> and <b>MET.05 Treasury action escrow</b>.</p><p>Built from scratch, this would need its own identity, policy engine, approval workflow, ERP integration and audit trail. On the platform, every one of those exists. The work is six steps of configuration.</p><div class="callout"><b>Watch the map:</b> highlighted components are configured in each step. None of them is new code.</div>`,led:[]},
 {t:"Specify the governance contract",hl:["K2","HU"],b:`<p>A steward writes the ORSD: purpose, scope and the norms the service must enforce, before anything is modeled.</p>`,code:["ORSD · illustrative","orsd: aeo:SpendControl\npurpose: Keep agent-initiated payments within limits the client sets\nscope: client agents with decision type aeo:VendorPayment\nnorms:\n  permission:  pay a verified payee up to the agent's spend limit\n  obligation:  hold any payment above the limit for a named approver\n  prohibition: pay a payee that does not resolve to a verified vendor\nsteward: Treasury Domain Governance Team"],led:["ORSD aeo:SpendControl approved by the steward"]},
 {t:"Model the concepts and norms",hl:["K1","K3","K4","K5","K2"],b:`<p>The steward adds the decision type, the limit and the three norms to a domain holon, as a KGCL change request. The SHACL shape makes "payee must be verified" a structural rule. The classification default is C2, client business information.</p>`,code:["Turtle and KGCL · illustrative syntax","aeo:VendorPayment rdfs:subClassOf aeo:FinancialCommitment .\naeo:spendLimit isp-class:defaultSensitivity isp-class:C2 .\n\naeo:Norm_HoldAboveLimit a lkif:Obligation ;\n    aeo:appliesTo aeo:VendorPayment ;\n    aeo:condition \"amount > spendLimit\" ;\n    lkif:sanction aeo:SimplexHold .\n\naeo:VerifiedPayeeShape a sh:NodeShape ;\n    sh:targetClass aeo:VendorPayment ;\n    sh:property [ sh:path aeo:payee ; sh:class pes:VerifiedVendor ;\n                  sh:message \"Payee must resolve to a verified vendor.\" ] .\n\n# CR-0107  target: ontology-domain-treasury  approver: Treasury DGT\ncreate class aeo:VendorPayment"],led:["KGCL CR-0107 adds aeo:VendorPayment, spend limit and three norms"]},
 {t:"Map the client's systems",hl:["M1","M2","M3","P2","SR"],b:`<p>The client's ERP vendor master is mapped, not integrated. A lineage agent proposes the mapping; the steward validates it. From now on, a payee in an envelope resolves to one canonical vendor ID, or it does not resolve at all.</p>`,code:["Mapping assertion","wb:map_hudson_vendor_master a isp-map:Mapping ;\n    isp-map:subject pes:VerifiedVendor ;\n    isp-map:predicate skos:exactMatch ;\n    isp-map:object wb:col_hudson_erp_vendor_id ;\n    isp-map:correspondenceType isp-map:DomainToAssetSchema ;\n    isp-map:confidence 0.96 ;\n    isp-map:status isp-map:Validated ;\n    isp-map:proposedBy \"Lineage Ingestion Agent\" ;\n    isp-map:validatedBy \"Treasury Domain Governance Team\" ."],led:["Mapping to the client vendor master validated (confidence 0.96)"]},
 {t:"Compile the rules",hl:["R2","R3","R1","P1"],b:`<p>The harmonization engine checks the new norms against every existing rule; there is no conflict. The six-stage pipeline compiles them to an OPA policy that runs at the gateway, stamped with the release and a link back to the norm.</p>`,code:["Rego · generated","package aeo.spend\n\n# source: aeo:Norm_HoldAboveLimit, aeo:VerifiedPayeeShape\n# release: keel:release/2026.10.3\n\ndecision := \"halt\" if {\n    not input.payee_verified\n} else := \"hold\" if {\n    input.amount > data.limits[input.agent]\n} else := \"release\""],led:["Harmonization: no conflicts","Policy aeo.spend published to the registry, release 2026.10.3"]},
 {t:"Compose: register the agent",hl:["D2","N5","CA","K5"],b:`<p>The client's agent is registered with its tenant, decision types, tools, limit, approver and attested model. Its clearance tier is computed from its tools' data, not declared. It emits envelopes through the envelope SDK.</p>`,code:["Registry entry","{\n  \"agent\": \"client:hudson.ap-payables\",\n  \"tenant\": \"client:hudson\",\n  \"decisionTypes\": [\"aeo:VendorPayment\"],\n  \"tools\": [\"erp.vendor.read\", \"erp.payment.create\"],\n  \"clearance\": \"T1 (reads up to C2)\",\n  \"spendLimitUSD\": 10000,\n  \"approver\": \"role:hudson.controller\",\n  \"attestedModel\": \"ap-agent@2.3.0\",\n  \"tier\": \"attest-and-insure\"\n}"],led:["Agent registered; clearance computed as T1"]},
 {t:"Prove and promote",hl:["O4","O2","G6","HU"],b:`<p>Fixtures prove the rules do what the ORSD says, including the cases that must fail. Then the service moves DEV to STG to PRD, and the agent runs in shadow, then advisory, then enforcement.</p>`,code:["Fixtures","valid    pay  $4,800 to a verified payee        → release\nvalid    pay $12,400 to a verified payee        → hold for approver\ninvalid  pay    $900 to an unresolved payee     → halt      (expected)\ninvalid  agent raises its own spend limit       → denied    (expected)"],after:`<div class="callout"><b>Built new for this service:</b> nothing. One ORSD, one change request, one mapping, one compiled policy, one registry entry and four fixtures.</div>`,led:["Fixtures: 2 pass, 2 fail as designed","Promoted to PRD; shadow mode started"]}
];

/* ---------- Decision steps ---------- */
const DEC=[
 {t:"The agent proposes a payment",hl:["CA","N5"],b:`<p>The AP agent matches an invoice and proposes paying $12,400. It cannot call the ERP. It can only emit an envelope.</p>`,code:["Decision envelope","{\n  \"decisionId\": \"D-AP-20931\",\n  \"agent\": \"client:hudson.ap-payables\",\n  \"decisionType\": \"aeo:VendorPayment\",\n  \"output\": { \"amountUSD\": 12400, \"payee\": \"Northside Supply\" },\n  \"context\": { \"who\": \"hr:PersonaFinance\", \"what\": \"aeo:VendorPayment\",\n               \"when\": \"stage:Approve\", \"where\": [\"IL\"], \"why\": \"outcome:PayOnTerms\" },\n  \"evidence\": [\"invoice:INV-7781\", \"po:PO-1180\"],\n  \"model\": { \"id\": \"ap-agent\", \"version\": \"2.3.0\" },\n  \"standards\": \"keel:release/2026.10.3\",\n  \"tenant\": \"client:hudson\"\n}"],led:["Envelope D-AP-20931 received"],state:["Received","t-info"]},
 {t:"Who is this agent?",hl:["G1","D2"],b:`<p>The gateway checks the registry: the agent exists, belongs to tenant Hudson, is ONLINE, and is running the attested model 2.3.0. <b>aeo:VendorPayment</b> is one of its registered decision types.</p><p>Any mismatch stops here: an unknown agent, a dropped agent, a wrong tenant, or an unattested model version.</p>`,led:["Identity, tenant, state and model version verified"],state:["Identified","t-info"]},
 {t:"Pin the rules and build the context",hl:["G1","K2","K5"],b:`<p>The gateway loads the exact rule release the envelope names, 2026.10.3, so this verdict can be replayed later against the same rules. It builds the context bundle: a finance persona, the approval stage, Illinois, and the outcome "pay on terms".</p>`,led:["Rules pinned: keel:release/2026.10.3","Context bundle built (5 dimensions)"],state:["In context","t-info"]},
 {t:"Ground the payee",hl:["M2","M4","M1","P2"],b:`<p>"Northside Supply" is a string. The URI registry resolves it through the validated mapping to the client's vendor master: canonical entity <b>ent:V-4471</b>, a verified vendor. If it had not resolved, the prohibition norm would apply.</p>`,led:["Payee resolved to ent:V-4471 (verified vendor)"],state:["Grounded","t-info"]},
 {t:"Enforce the rules",hl:["G2","R1","G3"],b:`<ul><li><b>Step 1, structure:</b> the payee shape is satisfied.</li><li><b>Step 2, time:</b> the invoice is within payment terms.</li><li><b>Step 3, policy:</b> the compiled <code>aeo.spend</code> policy returns <span class="tag t-warn">hold</span> because $12,400 exceeds the $10,000 limit.</li><li><b>Step 4, safety:</b> a payment is an irreversible action, so it is routed to the Simplex gate whatever the amount.</li></ul>`,led:["Steps 1–2 passed","Policy aeo.spend → hold (12,400 > 10,000)","Irreversible action → Simplex gate"],state:["Hold","t-warn"]},
 {t:"Measure the decision",hl:["G6","D2"],b:`<p>The circuit breaker measures how far the decision sits from the reference model, weighted for a finance persona.</p><pre>structural  Ds 0.02   tolerance 0.12
behavioral  Db 0.05   tolerance 0.10
context     Dr 0.07   tolerance 0.09</pre><p>All three are within tolerance, so the agent's reliability is not in question and it stays ONLINE. The verdict is <span class="tag t-warn">FREEZE</span> only because a norm requires a person: the decision is held, not rejected.</p>`,led:["Distances within tolerance; agent stays ONLINE","Verdict FREEZE (held for approver)"],state:["Frozen","t-warn"]},
 {t:"A person decides",hl:["G5","O2","HU"],b:`<p>The controller sees the held payment in the workbench with its full evidence: invoice, PO, resolved vendor, the policy that held it and the distances. She approves. The approval is signed and recorded against this decision.</p><p>Had she rejected it, the rejection would be recorded the same way and the agent would get the verdict back.</p>`,led:["Approved by role:hudson.controller (signed)"],state:["Approved","t-ok"]},
 {t:"Release and record",hl:["G4","P1","SR","O1","G7"],b:`<p>The service facade checks the response against its acceptance criteria and classification. The payment is created in the ERP through its port. The provenance store records the full chain; metering tags the envelope for billing; the outcome feeds the agent's MTBH.</p><div class="callout"><b>Result:</b> the agent did its job, a person held the one irreversible decision, and every fact needed for an audit or a claim already exists.</div>`,led:["Facade check passed; payment created via port","PROV-O chain written; envelope metered"],state:["Released","t-ok"]}
];

  <div class="tablebox"><table class="st"><thead><tr><th>Metric</th><th>Target</th><th>Consequence of breach</th><th>Owning service</th></tr></thead><tbody>
   <tr><td>Drift cap</td><td class="num">±1.5% vs. validation baseline</td><td>Rollback to the last stable checkpoint; billing credit</td><td>${svcChip("SAF.02")}</td></tr>
   <tr><td>Uptime and tool-call latency</td><td class="num">99.95% · under 1,200 ms</td><td>Tiered fee rebate</td><td>${svcChip("PLT.01")}</td></tr>
   <tr><td>Context isolation</td><td class="num">100% tenant isolation</td><td>Termination right plus security-audit indemnity</td><td>${svcChip("CMP.06")}</td></tr>
   <tr><td>Circuit-breaker response</td><td class="num">under 250 ms to revoke</td><td>AEO absorbs losses after the interval</td><td>${svcChip("SAF.01")}</td></tr>
  </tbody></table></div>
  <div class="sub"><h2>Agent clearance tiers</h2><p>An agent's clearance is the highest sensitivity its tools read, so the tier is set by its tools and data, not its job title. Regime floors (HIPAA, BIPA, FCRA, I-9, privilege, MNPI) force C4.</p></div>
  <div class="tablebox"><table class="st"><thead><tr><th>Tier</th><th>Max sensitivity</th><th>Typical agent</th><th>Human sign-off</th><th>Agent Comp rating</th></tr></thead><tbody>
   <tr><td>T0 Reference</td><td class="num">C0–C1</td><td>Policy questions grounded in statutes and the handbook</td><td>None</td><td>Base</td></tr>
   <tr><td>T1 Business</td><td class="num">C2</td><td>Accounts payable; client-level reporting over aggregates meeting cell size 5</td><td>Irreversible actions and external sends</td><td>Base</td></tr>
   <tr><td>T2 Worker data</td><td class="num">C3</td><td>Payroll exception triage; leave-balance answers to the worker</td><td>Any write to a record of pay</td><td>Loaded</td></tr>
   <tr><td>T3 Regulated</td><td class="num">C4 + regime</td><td>Claims, background-check support, I-9 review</td><td>Every release outside the custody boundary</td><td>Excess cover required ${svcChip("AGC.06")}</td></tr>
  </tbody></table></div>
  <div class="find">
   <div class="card"><h3>Defense in depth</h3><ul><li>Every integrity scenario meets at least two independent preventive or detective controls before a loss can occur.</li><li>The one with no technical stop, an approved payment to a fraudulent vendor, is stopped by design: the platform enforces the client's rules and records who approved.</li></ul></div>
   <div class="card"><h3>Where exposure remains</h3><ul><li>Drift between measurements on lower-consequence work.</li><li>Unmapped free text, held at C3 until classified.</li><li>Client-side master data, such as vendor bank details.</li><li>Bias proxies that emerge after attestation.</li></ul></div>
   <div class="card"><h3>What has to be true</h3><ul><li>The gateway, envelope contract and agent registry are proven on Insperity's own advisors first.</li><li>Counsel reviews the liability schedule; it is a contract construct, not settled law.</li><li>A carrier writes Agent Comp; until then it is partner-delivered.</li></ul></div>
  </div>`;
}
function bindGov(){
  $$(".mx tbody tr").forEach(tr=>{const f=()=>{scen=tr.dataset.s;step.risk=RISK.find(r=>r.id===scen).checks.length;go("risk")};tr.onclick=f;tr.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();f()}}});
}

function bindGo(root){$$("[data-go]",root||document).forEach(b=>b.onclick=e=>{e.stopPropagation();go(b.dataset.go)})}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function render(){
  const c=CH.find(x=>x.id===chap);
  $$(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.c===chap));
  const R={overview:renderOverview,primer:renderPrimer,catalog:renderCatalog,arch:()=>renderSteps("arch",ARCH,""),assemble:()=>renderSteps("assemble",ASM,"Artifacts produced so far"),decision:()=>renderSteps("decision",DEC,"Evidence recorded so far"),risk:renderRisk,gov:renderGov};
  $("#main").innerHTML=`<section class="chapter" role="tabpanel" aria-labelledby="t-${chap}"><div class="chead"><span class="eyebrow">Chapter ${CH.indexOf(c)+1} of ${CH.length}</span><h2>${c.title}</h2><p>${c.lede}</p></div>${R[chap]()}</section>`;
  if(chap==="primer")bindPrimer();
  if(chap==="catalog")bindCatalog();
  if(["arch","assemble","decision"].includes(chap)){const steps={arch:ARCH,assemble:ASM,decision:DEC}[chap];bindStepper(chap,steps);bindMap(steps[step[chap]].hl)}
  if(chap==="risk")bindRisk();
  if(chap==="gov")bindGov();
  bindGo($("#main"));bindSvcChips($("#main"));
}
function go(id,keepLens){if(!keepLens)lens=null;chap=id;try{history.replaceState(null,"","#"+id)}catch(e){}render();window.scrollTo({top:0})}

$("#tabs").innerHTML=CH.map((c,i)=>`<button class="tab" role="tab" id="t-${c.id}" data-c="${c.id}"><span class="n">${i+1}</span>${c.n}</button>`).join("");
$$(".tab").forEach(t=>t.onclick=()=>go(t.dataset.c));
addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea,select"))return;
  if(!["ArrowRight","ArrowLeft"].includes(e.key))return;
  const b=e.key==="ArrowRight"?($("#next")||$("#rnext")):($("#prev")||$("#rprev"));
  if(b&&!b.disabled){e.preventDefault();b.click()}
});
$("#foot").innerHTML=`Woven from the AEO Service Map, AEO Service Assembly and AEO Assembly Walkthrough. Sources: ${SOURCES.map(([t,,u])=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join(" · ")}. Code, values and names are illustrative. "Exists" means defined in the architecture or run by today's PEO operations; the gateway, envelope contract and agent registry are designed and assumed to be proven on Insperity's own advisors before the AEO launches.`;
const start=(location.hash||"").slice(1);
go(CH.some(c=>c.id===start)?start:"overview");
</script>
