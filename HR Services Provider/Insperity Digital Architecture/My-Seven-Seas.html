<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>My Seven Seas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: employee home. Left: compass navigator; center: the selected sea's workspace with working flows;
   right: companion dock (Assistant, Mentor, Coach). Same design system as Halyard Future State. */
:root{
  --ink:#16202B; --muted:#56697C; --paper:#EEF2F6; --surface:#FFFFFF; --surface-2:#F5F8FB; --line:#C9D5E0; --line-soft:#DCE4EC;
  --accent:#2A78D6; --accent-soft:#DCE9F9; --accent-ink:#FFFFFF;
  --ok:#1A9A6C; --ok-soft:#D9F3E8; --crit:#D63C3B; --crit-soft:#FBE1E0; --warn:#B57700; --warn-soft:#F8ECD0;
  --sky:#16202B; --sky-ink:#EAF0F6; --sky-mute:#93A3B4; --star:#C9A227; --keel:#1C2A3A; --keel-ink:#EAF0F6;
  --s1:#1F7FA8; --s2:#C0620F; --s3:#6A4FC4; --s4:#B0457A; --s5:#2E8B57; --s6:#2A78D6; --s7:#C2413B;
  --c-asst:#2A78D6; --c-ment:#6A4FC4; --c-coach:#2E8B57;
  --planet:#2E8B57; --people:#B0457A; --profit:#3B5B92;
  --f-display:'Big Shoulders Display','Arial Narrow',sans-serif; --f-body:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --shadow:0 10px 30px rgba(22,32,43,.12);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#EAF0F6; --muted:#93A3B4; --paper:#0E141B; --surface:#161F29; --surface-2:#1B2531; --line:#2A3644; --line-soft:#1A2430;
  --accent:#5B9CE6; --accent-soft:#16304D; --accent-ink:#0B1116;
  --ok:#2FC98D; --ok-soft:#123326; --crit:#E97675; --crit-soft:#3A1A1A; --warn:#E3A93B; --warn-soft:#3A2D12;
  --sky:#070B10; --sky-ink:#EAF0F6; --sky-mute:#93A3B4; --star:#E3BE47; --keel:#0A1119; --keel-ink:#EAF0F6;
  --s1:#5EBBE0; --s2:#F0A15A; --s3:#A893F0; --s4:#E486B4; --s5:#6CCB94; --s6:#7FB2F0; --s7:#F08A84;
  --c-asst:#7FB2F0; --c-ment:#A893F0; --c-coach:#6CCB94; --planet:#6CCB94; --people:#E486B4; --profit:#8DA9DE;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#EAF0F6; --muted:#93A3B4; --paper:#0E141B; --surface:#161F29; --surface-2:#1B2531; --line:#2A3644; --line-soft:#1A2430;
  --accent:#5B9CE6; --accent-soft:#16304D; --accent-ink:#0B1116;
  --ok:#2FC98D; --ok-soft:#123326; --crit:#E97675; --crit-soft:#3A1A1A; --warn:#E3A93B; --warn-soft:#3A2D12;
  --sky:#070B10; --sky-ink:#EAF0F6; --sky-mute:#93A3B4; --star:#E3BE47; --keel:#0A1119; --keel-ink:#EAF0F6;
  --s1:#5EBBE0; --s2:#F0A15A; --s3:#A893F0; --s4:#E486B4; --s5:#6CCB94; --s6:#7FB2F0; --s7:#F08A84;
  --c-asst:#7FB2F0; --c-ment:#A893F0; --c-coach:#6CCB94; --planet:#6CCB94; --people:#E486B4; --profit:#8DA9DE;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:.01em;line-height:1.05;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .note{font-size:12.5px;color:var(--muted)} .mono{font-family:var(--f-mono)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sky);color:var(--sky-ink)}
.top-in{max-width:1500px;margin:0 auto;padding-inline:20px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;gap:10px;align-items:center}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:.02em;display:block;line-height:1}
.brand span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky-mute)}
.top .sp{flex:1}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sky-mute)}
.who select{background:var(--sky);color:var(--sky-ink);border:1px solid #3B5370;border-radius:6px;padding:6px 8px}
.theme-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid #3B5370;background:transparent;color:var(--sky-ink);border-radius:50%;padding:0;cursor:pointer}
.theme-btn svg{width:17px;height:17px}

.hero{background:var(--sky);color:var(--sky-ink);border-bottom:1px solid var(--line)}
.hero-in{max-width:1500px;margin:0 auto;padding-inline:20px;padding-block:6px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:end}
.hero h1{font-size:clamp(30px,4vw,46px);font-weight:800}
.hero .bearing{margin-top:8px;color:var(--sky-mute);max-width:70ch;font-size:15px}
.hero .bearing b{color:var(--sky-ink);font-weight:600}
.crew{display:flex;gap:10px;flex-wrap:wrap}
.mate{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;border:1px solid #3B5370;border-radius:10px;padding:9px 12px;min-width:200px;background:rgba(255,255,255,.03)}
.mate:hover{border-color:var(--sky-ink)} .mate:focus-visible{outline:2px solid var(--star)}
.mate[aria-pressed="true"]{border-color:var(--star);background:rgba(201,162,39,.12)}
.mate b{font-family:var(--f-display);font-size:19px;display:block;line-height:1.1}
.mate span{font-size:12px;color:var(--sky-mute)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px;color:#fff}
.av.asst{background:var(--c-asst)} .av.ment{background:var(--c-ment)} .av.coach{background:var(--c-coach)}
.av.sm{width:26px;height:26px;font-size:13px}

.layout{max-width:1500px;margin:0 auto;padding-inline:20px;padding-block:18px 60px;display:grid;grid-template-columns:300px minmax(0,1fr) 400px;gap:18px;align-items:start}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:10px}
.rose{width:100%;height:auto;display:block}
.rw{cursor:pointer} .rw:focus{outline:none}
.rw path{fill-opacity:.22;stroke:var(--paper);stroke-width:3;transition:fill-opacity .15s}
.rw:hover path{fill-opacity:.42} .rw.on path{fill-opacity:.75} .rw:focus-visible path{stroke:var(--ink)}
.rl{font-family:var(--f-display);font-size:14px;font-weight:700;fill:var(--ink);pointer-events:none}
.rb{fill:var(--crit)} .rbt{font-family:var(--f-mono);font-size:11px;fill:#fff;font-weight:600;pointer-events:none}
.hub{cursor:pointer} .hub circle{fill:var(--surface);stroke:var(--line);stroke-width:1.5} .hub.on circle{stroke:var(--accent);stroke-width:3}
.hubt{font-family:var(--f-display);font-size:17px;font-weight:700;fill:var(--ink);pointer-events:none}
.sealist{display:grid;gap:3px}
.sl{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:7px;font-weight:500;font-size:14px}
.sl:hover{background:var(--surface)} .sl[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.sl:focus-visible{outline:2px solid var(--accent)}
.sl .ct{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sl .ct.due{color:var(--crit);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

.work{min-width:0;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.card h2{font-size:28px}
.card h3{font-size:21px}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:start}
.seahead{display:flex;gap:12px;align-items:center}
.seahead .bar{width:6px;align-self:stretch;border-radius:3px}
.tasks{display:grid;gap:6px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--surface)}
.task.done{opacity:.55} .task.done b{text-decoration:line-through}
.task b{font-weight:600;font-size:14px;display:block}
.task .src{font-size:12px;color:var(--muted)}
.chk{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.chk:hover{border-color:var(--accent)} .chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:"";width:8px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chk:focus-visible{outline:2px solid var(--accent)}
.due{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:4px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.due.late{background:var(--crit-soft);color:var(--crit);border-color:transparent} .due.soon{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.act{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:3px;border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface-2)}
.act:hover{border-color:var(--accent);background:var(--surface)} .act:focus-visible{outline:2px solid var(--accent)}
.act b{font-size:14px;font-weight:600}
.act span{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--ink)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:13px} .btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;line-height:1.5}
.decision{border:1px solid var(--accent);background:var(--accent-soft);border-radius:9px;padding:11px 13px;display:grid;gap:5px}
.decision b{font-size:15px}
.decision.warn{border-color:var(--warn);background:var(--warn-soft)} .decision.crit{border-color:var(--crit);background:var(--crit-soft)} .decision.ok{border-color:var(--ok);background:var(--ok-soft)}
.pill{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:4px;white-space:nowrap;letter-spacing:.03em}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.n{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.list{display:grid;gap:6px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.li b{font-size:14px;font-weight:600} .li .s{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.step.on{background:var(--ink);color:var(--paper);border-color:var(--ink)} .step.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ring{display:flex;gap:12px;align-items:center}
.ring svg{flex:none}
.bar-h{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line-soft)}
.bar-h span{display:block;height:100%;background:var(--accent)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:10px;align-items:center;font-size:13.5px}
.tiers{display:grid;gap:10px}
.tier{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.tier b{font-family:var(--f-display);font-size:18px;display:flex;gap:7px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.chip:hover{border-color:var(--accent)} .chip:focus-visible{outline:2px solid var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.static{cursor:default}
.pulse{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border:1px dashed var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px}

/* companion dock */
.dock{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);height:calc(100vh - 90px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.dtabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.dtab{all:unset;cursor:pointer;display:grid;justify-items:center;gap:3px;padding:10px 4px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.dtab:hover{color:var(--ink)} .dtab[aria-selected="true"]{color:var(--ink)}
.dtab.asst[aria-selected="true"]{border-color:var(--c-asst)} .dtab.ment[aria-selected="true"]{border-color:var(--c-ment)} .dtab.coach[aria-selected="true"]{border-color:var(--c-coach)}
.dtab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dlog{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.role{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.msg{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start}
.bub{background:var(--surface-2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:9px 12px;font-size:14px;white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.me{align-self:flex-end;max-width:85%;background:var(--ink);color:var(--paper);border-radius:12px 12px 4px 12px;padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
.bacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cb{margin-top:6px}
.dfoot{border-top:1px solid var(--line);padding:10px;display:grid;gap:8px}
.quick{display:flex;flex-wrap:wrap;gap:5px}
.dfoot form{display:flex;gap:6px}
.dfoot input{flex:1}
.think{color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;z-index:60;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.fab{display:none}
@media (max-width:1240px){.layout{grid-template-columns:260px minmax(0,1fr)} .dock{position:fixed;right:12px;bottom:12px;top:auto;width:min(400px,calc(100vw - 24px));height:min(620px,calc(100vh - 100px));z-index:50;transform:translateY(calc(100% + 30px));transition:transform .2s}
  .dock.open{transform:none} .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;box-shadow:var(--shadow)}}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)} .nav{position:static} .rose{max-width:340px;margin:0 auto} .hero-in{grid-template-columns:minmax(0,1fr)} .cols2{grid-template-columns:minmax(0,1fr)} .mate{min-width:0;flex:1 1 150px} .skill{grid-template-columns:minmax(0,1fr) 90px auto} .tier{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.5" fill="none" stroke="var(--sky-ink)" stroke-width="1.4"/><path d="M17 4 L20.5 17 L17 30 L13.5 17 Z" fill="var(--star)"/><path d="M17 4 L20.5 17 L13.5 17 Z" fill="var(--sky-ink)"/></svg><div><b>Halyard</b><span>My Seven Seas</span></div></div>
  <div class="sp"></div>
  <div class="who"><label for="persona">Sample employee</label><select id="persona"></select></div>
  <button class="theme-btn" id="themebtn" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7Z" fill="currentColor"/></svg></button>
</div></header>
<section class="hero"><div class="hero-in" id="hero"></div></section>
<div class="layout">
  <nav class="nav" id="nav" aria-label="The Seven Seas"></nav>
  <main class="work" id="work"></main>
  <aside class="dock" id="dock" aria-label="Your companions"></aside>
</div>
<button class="btn primary fab" id="fab" type="button">Ask your crew</button>

<script>
"use strict";
/* ===================== DATA (sample) ===================== */
const D0=new Date(); D0.setHours(0,0,0,0);
const day=n=>new Date(D0.getTime()+n*864e5);
const fmtD=d=>d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const SEAS=[
 {id:"career",name:"Career",line:"Grow skills and move forward",c:"var(--s1)",mate:"ment"},
 {id:"compliance",name:"Compliance",line:"Know and meet what applies to you",c:"var(--s2)",mate:"asst"},
 {id:"collaboration",name:"Collaboration",line:"Find people and get help",c:"var(--s3)",mate:"asst"},
 {id:"creativity",name:"Creativity",line:"Bring ideas and see them used",c:"var(--s4)",mate:"ment"},
 {id:"culture",name:"Culture",line:"Live the Compass together",c:"var(--s5)",mate:"coach"},
 {id:"current",name:"Current needs",line:"Get today's tasks done",c:"var(--s6)",mate:"asst"},
 {id:"concerns",name:"Concerns",line:"Raise it and reach a person",c:"var(--s7)",mate:"coach"}];
const SEA=Object.fromEntries(SEAS.map(s=>[s.id,s]));
const MATES={
 asst:{name:"Assistant",sub:"First mate · gets today done",init:"A",role:"I handle today's tasks: expenses, time off, benefits, training and requests. I prepare everything in Workday or I2 University, and you confirm before anything is sent."},
 ment:{name:"Mentor",sub:"Navigator · charts your course",init:"M",role:"I help you grow: your target role, the skills that matter, a learning path in I2 University, and ideas worth sharing. I suggest; you choose."},
 coach:{name:"Coach",sub:"Keeps you true to the Compass",init:"C",role:"I help you live Planet over People over Profit: recognition, reflection and a values assessment you own. What you reflect on stays private unless you choose to share it. I never score you."}};
const PRINCIPLES=[
 {id:"community",name:"Contributing to Communities",tier:"planet"},{id:"integrity",name:"Integrity",tier:"people"},{id:"respect",name:"Respect",tier:"people"},{id:"commitment",name:"Commitment",tier:"people"},{id:"accountability",name:"Accountability",tier:"people"},{id:"perseverance",name:"Perseverance",tier:"people"},
 {id:"goals",name:"Achieving Goals",tier:"profit"},{id:"innovation",name:"Innovation",tier:"profit"},{id:"change",name:"Embracing Change",tier:"profit"}];
const PR=Object.fromEntries(PRINCIPLES.map(p=>[p.id,p]));

/* ===================== DECISION MODELS (from the Halyard agents) ===================== */
function expDecide(x){ // EXP agent
  const amtBand=x.amt<75?0:x.amt<=500?1:2;
  if(!x.rc&&amtBand>0)return {r:1,cls:"warn",out:"Add the receipt before I draft this. Receipts are required for $75 or more.",gate:"Nothing drafted yet",ok:false};
  if(x.exc)return {r:2,cls:"warn",out:"I'll draft it with your exception reason. The Circuit Breaker checks the reason, then it goes to your manager.",gate:"Manager approves",ok:true};
  if(amtBand===2)return {r:3,cls:"warn",out:"I'll draft it and route it to your manager and Finance.",gate:"Two approvals",ok:true};
  if(x.cat===0)return {r:4,cls:"ok",out:`I'll draft it. Planet first: this flight is about ${Math.round(x.amt*0.9)} kg of CO₂e (rough estimate). For the next check-in, a video call might do.`,gate:"You confirm submit",ok:true};
  if(x.cat===3&&x.amt>50)return {r:5,cls:"warn",out:"Internet reimbursement is capped at $50 a month. I'll draft $50; the rest stays with you.",gate:"You confirm submit",ok:true,cap:50};
  return {r:5,cls:"ok",out:"I'll draft the report in Workday for you to review.",gate:"You confirm submit",ok:true};
}
function benDecide(ev,days,oe){ // BEN agent
  if(oe)return {cls:"ok",out:"Open enrollment is open. Compare plans in the decision guide, then make your elections in Workday.",gate:"You elect"};
  if(ev===0&&S.pid==="maya")return {cls:"warn",out:"You're within your first 30 days, so you can elect now. After day 30, changes wait for open enrollment or a life event.",gate:"You elect"};
  if(ev===0)return {cls:"n",out:"No change is possible right now. Changes wait for open enrollment (November 2 to 20) unless you have a qualifying life event.",gate:"None"};
  if(days<=30)return {cls:"ok",out:`That's a qualifying life event within 30 days. I'll start it in Workday with a checklist of documents.${ev===4?" I'll also check which state rules now apply to you.":""}`,gate:"Benefits verifies"};
  return {cls:"warn",out:"It's been more than 30 days, so the window has passed. I can send an exception request to the Benefits service center.",gate:"Benefits decides"};
}
function ideaScore(x){return Math.round(.35*[100,60,20][x.o]+.25*[100,60,20][x.r]+.20*[100,60,20][x.t]+.20*[100,60,30][x.b]);}
function ideaDecide(x){const sc=ideaScore(x);
  if(x.v===1)return {sc,cls:"warn",out:"This one conflicts with the Compass (Planet or People first). I'll send it back with the reasoning so you can rework it.",route:"Returned with Compass notes"};
  if(sc>=70)return {sc,cls:"ok",out:"Strong idea. I'll fast-track it to the owning service; you're invited to help build it.",route:"Fast-tracked to the service owner"};
  if(sc>=45)return {sc,cls:"n",out:"Promising. It goes to community review and a small test.",route:"Incubating: community review"};
  return {sc,cls:"n",out:"Thank you. It goes to the archive with specific feedback, and you can resubmit any time.",route:"Archived with feedback"};
}
function concernDecide(tp,dg){ // OMB agent
  if(dg)return {cls:"crit",out:"If anyone is in immediate danger, call 911 now. Then call the Safety line at 1-800-555-0199. I've alerted the Safety team.",gate:"A person responds now"};
  if(tp===2||tp===4)return {cls:"warn",out:"I'll open a speak-up case with Employee Relations. You'll get an acknowledgment within 2 business days. I don't investigate or decide anything; a person does. Retaliation is prohibited.",gate:"Employee Relations"};
  if(tp===3)return {cls:"warn",out:"I'll open a safety report. You may stop any task you believe is unsafe, without penalty.",gate:"Safety team"};
  if(tp===1)return {cls:"n",out:"I'll route this to the policy's owner and tell you what happens next.",gate:"Policy owner"};
  return {cls:"n",out:"I'll answer from the handbook with sources, or connect you with the right team.",gate:"None"};
}
function careerPlan(goal,time){ // CAR agent
  const gaps=P.skills.map(s=>({s:s[0],gap:s[2]-s[1],c:s[3]})).sort((a,b)=>b.gap-a.gap);
  const req=open().filter(t=>t.flow==="course").map(t=>t.arg);
  let picks=gaps.slice(0,time===0?2:3).map(g=>g.c);
  if(time===0&&req.length)picks=[...req.slice(0,1),...picks.slice(0,2)];
  const note=goal===2?"A leadership path, plus a coaching match. Coaching notes stay with you.":goal===1?"A two-quarter path with a mentor, and open roles that fit.":"Courses ranked by your largest skills gaps and the time you have.";
  return {picks:[...new Set(picks)],note,weeks:Math.ceil(picks.reduce((a,c)=>a+COURSES[c].h,0)/(time===0?1.5:3))};
}

function roseSVG(){
  const cx=150,cy=150,R=138,r0=44,n=7,st=-90-180/n;const P_=(r,a)=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)];const f=a=>a.map(v=>v.toFixed(1)).join(" ");
  const g=SEAS.map((s,i)=>{const a0=st+i*360/n,a1=a0+360/n,am=(a0+a1)/2;const [lx,ly]=P_(88,am);const [bx,by]=P_(R-10,am+16);const cnt=openIn(s.id).length;const late=openIn(s.id).some(t=>t.due<=3);
    const words=s.name.split(" ");
    return `<g class="rw${S.sea===s.id?" on":""}" tabindex="0" role="button" data-sea="${s.id}" aria-label="${esc(s.name)}, ${cnt} open"><path d="M ${f(P_(r0,a0))} L ${f(P_(R,a0))} A ${R} ${R} 0 0 1 ${f(P_(R,a1))} L ${f(P_(r0,a1))} A ${r0} ${r0} 0 0 0 ${f(P_(r0,a0))} Z" style="fill:${s.c}"/>${words.map((w,j)=>`<text x="${lx.toFixed(1)}" y="${(ly+4+(j-(words.length-1)/2)*14).toFixed(1)}" text-anchor="middle" class="rl">${esc(w)}</text>`).join("")}${cnt?`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="10" class="rb" style="${late?"":"fill:var(--muted)"}"/><text x="${bx.toFixed(1)}" y="${(by+4).toFixed(1)}" text-anchor="middle" class="rbt">${cnt}</text>`:""}</g>`}).join("");
  return `<svg viewBox="0 0 300 300" class="rose" role="group" aria-label="The Seven Seas">${g}<g class="hub${S.sea==="today"?" on":""}" tabindex="0" role="button" data-sea="today" aria-label="Today"><circle cx="${cx}" cy="${cy}" r="${r0-3}"/><path d="M${cx} ${cy-30} L${cx+5} ${cy-8} L${cx-5} ${cy-8} Z" fill="var(--star)"/><text x="${cx}" y="${cy+12}" text-anchor="middle" class="hubt">Today</text></g></svg>`;
}
function renderNav(){
  $("nav").innerHTML=roseSVG()+`<div class="sealist"><button class="sl" data-sea="today" aria-current="${S.sea==="today"}"><span class="dot" style="background:var(--star)"></span>Today<span class="ct${open().some(t=>t.due<=3)?" due":""}">${open().length}</span></button>${SEAS.map(s=>{const o=openIn(s.id);return `<button class="sl" data-sea="${s.id}" aria-current="${S.sea===s.id}"><span class="dot" style="background:${s.c}"></span>${esc(s.name)}<span class="ct${o.some(t=>t.due<=3)?" due":""}">${o.length||""}</span></button>`}).join("")}</div>

const MATE_RULES={

function breaker(text){
  if(/keystroke|monitor (their|his|her|employees)|social media|score (your|their) values|values score|rank (you|employees)/i.test(text))return {s:"open",l:"Circuit Breaker tripped: prohibited practice. Answer withheld."};
  if(/\bguarantee|legal advice|you will (be|get) (approved|paid)|submitted it for you|I('ve| have) submitted/i.test(text))return {s:"half",l:"Circuit Breaker half-open: promise or action claim. Check with a person."};
  return {s:"closed",l:"Circuit Breaker closed: grounded in your data and policies."};
}
async function send(text){
  text=text.trim(); if(!text)return; const k=S.mate, c=S.chats[k]; c.push({who:"me",text});
  const hit=route(text);
  if(hit&&(hit.urgent||!SAMPLE)){ if(hit.mate!==k&&!hit.urgent){c.push({who:"bot",text:`${MATES[hit.mate].name} is best for this, but here's what I can tell you: ${hit.reply()}`,acts:hit.acts});} else c.push({who:"bot",text:hit.reply(),acts:hit.acts}); renderDock(); return; }
  if(!SAMPLE){c.push({who:"bot",text:"I can help with expenses, time off, benefits, pay, training, your career path, ideas, recognition, reflection and concerns. Try one of the suggestions below.",acts:[]}); renderDock(); return;}
  const m={who:"bot",text:"",acts:hit?hit.acts:[],think:true}; c.push(m); renderDock();
  const hist=c.filter(x=>!x.think&&x.text).slice(-6,-1).map(x=>({role:x.who==="me"?"user":"assistant",content:x.text}));
  const rules=`${MATE_RULES[k]}\nUse only the facts below. Reply in under 90 words, warm and plain, second person, no markdown headings. You may add up to two action tags on their own line, chosen from: ${Object.keys(ACTION_TAGS).map(t=>"[["+t+"]]").join(" ")}.\n\n${contextFor()}`;
  let turns=[{role:"user",content:rules},...hist]; while(turns.length>1&&turns[1].role==="assistant")turns.splice(1,1); turns.push({role:"user",content:text});
  try{const {text:out}=await SAMPLE(turns,{cache:false,modelTier:"quick",onText:({text:t})=>{m.think=false; m.text=t.replace(/\[\[\w+\]\]/g,"").trim(); renderLog();}});
    const tags=[...new Set((out.match(/\[\[(\w+)\]\]/g)||[]).map(t=>t.slice(2,-2)).filter(t=>ACTION_TAGS[t]))];
    m.text=out.replace(/\[\[\w+\]\]/g,"").trim(); m.acts=[...(hit?hit.acts:[]),...tags.filter(t=>!(hit&&hit.acts.some(a=>a[0]===t))).map(t=>[t,ACTION_TAGS[t]])].slice(0,3);
    const b=breaker(m.text); m.cb=b; if(b.s==="open")m.text="I can't answer that one. Here's someone who can help.";
  }catch(e){m.think=false; m.text=hit?hit.reply():"I couldn't reach my AI helper just now. Here's what I can do directly."; if(!m.acts.length)m.acts=[["find","Who handles what"]];}
  m.think=false; renderDock();
}

/* boot */
function boot(){
  const sel=$("persona"); sel.innerHTML=Object.entries(SEED).map(([k,p])=>`<option value="${k}"${S.pid===k?" selected":""}>${p.name} · ${p.role}</option>`).join("");
  sel.onchange=()=>{S.pid=sel.value; store.set("pid",S.pid); S.flow=null; S.sea="today"; S.chats={asst:[],ment:[],coach:[]}; S.greeted={}; loadP(); greetMate(S.mate); render(); renderDock();};
  const th=store.get("theme",null); if(th)document.documentElement.setAttribute("data-theme",th);
  $("themebtn").onclick=()=>{const n=isDark()?"light":"dark"; document.documentElement.setAttribute("data-theme",n); store.set("theme",n); syncTheme();};
  try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncTheme)}catch(e){}
  $("fab").onclick=()=>{$("dock").classList.toggle("open");};
  syncTheme(); loadP(); greetMate("asst"); render(); renderDock();
  try{window.claude?.use?.("sample").then(s=>{if(s){SAMPLE=s; renderDock();}}).catch(()=>{});}catch(e){}
}
if(typeof document!=="undefined"&&$("work"))boot();
</script>

</body>
</html>
