<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Halyard Future State</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one vessel cross-section as the map of the platform. Header tabs switch pages; every cell is clickable;
   details open in a docked panel at right so the imagery never moves. Accelerator Console design system (from the Keel and North Star demos). */
:root{
  --ink:#16202B; --ink-soft:#2A3846; --muted:#56697C; --paper:#EEF2F6; --surface:#FFFFFF; --surface-2:#F5F8FB; --line:#C9D5E0; --line-soft:#DCE4EC;
  --accent:#2A78D6; --accent-soft:#DCE9F9; --accent-ink:#FFFFFF;
  --ok:#1BAF7A; --ok-soft:#D9F3E8; --crit:#E34948; --crit-soft:#FBE1E0; --warn:#C98500; --warn-soft:#F8ECD0;
  --sky:#16202B; --sky-ink:#EAF0F6; --sky-mute:#93A3B4; --star:#C9A227;
  --sea:#DCE7F0; --sea-line:#7C93A8;
  --hull:#E3EAF3; --keel:#1C2A3A; --keel-ink:#EAF0F6; --keel-card:#273A50; --keel-line:#3B5370;
  --ballast:#F3EAD0; --ballast-line:#C9A227; --sail:#FBFCFD; --sail-line:#9AABBC;
  --s1:#1F7FA8; --s2:#C0620F; --s3:#6A4FC4; --s4:#B0457A; --s5:#2E8B57; --s6:#2A78D6; --s7:#C2413B;
  --f-display:'Big Shoulders Display','Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --shadow:0 10px 30px rgba(22,32,43,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#EAF0F6; --ink-soft:#C9D5E0; --muted:#93A3B4; --paper:#0E141B; --surface:#161F29; --surface-2:#1B2531; --line:#2A3644; --line-soft:#1A2430;
  --accent:#5B9CE6; --accent-soft:#16304D; --accent-ink:#0B1116;
  --ok:#2FC98D; --ok-soft:#123326; --crit:#E97675; --crit-soft:#3A1A1A; --warn:#E3A93B; --warn-soft:#3A2D12;
  --sky:#070B10; --sky-ink:#EAF0F6; --sky-mute:#93A3B4; --star:#E3BE47; --sea:#12202D; --sea-line:#4E6A85;
  --hull:#1D2A38; --keel:#0A1119; --keel-ink:#EAF0F6; --keel-card:#16212D; --keel-line:#2E4560;
  --ballast:#2A2412; --ballast-line:#B8952A; --sail:#E6ECF2; --sail-line:#6F8397;
  --s1:#5EBBE0; --s2:#F0A15A; --s3:#A893F0; --s4:#E486B4; --s5:#6CCB94; --s6:#7FB2F0; --s7:#F08A84;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --ink:#EAF0F6; --ink-soft:#C9D5E0; --muted:#93A3B4; --paper:#0E141B; --surface:#161F29; --surface-2:#1B2531; --line:#2A3644; --line-soft:#1A2430;
  --accent:#5B9CE6; --accent-soft:#16304D; --accent-ink:#0B1116;
  --ok:#2FC98D; --ok-soft:#123326; --crit:#E97675; --crit-soft:#3A1A1A; --warn:#E3A93B; --warn-soft:#3A2D12;
  --sky:#070B10; --sky-ink:#EAF0F6; --sky-mute:#93A3B4; --star:#E3BE47; --sea:#12202D; --sea-line:#4E6A85;
  --hull:#1D2A38; --keel:#0A1119; --keel-ink:#EAF0F6; --keel-card:#16212D; --keel-line:#2E4560;
  --ballast:#2A2412; --ballast-line:#B8952A; --sail:#E6ECF2; --sail-line:#6F8397;
  --s1:#5EBBE0; --s2:#F0A15A; --s3:#A893F0; --s4:#E486B4; --s5:#6CCB94; --s6:#7FB2F0; --s7:#F08A84;
  --shadow:0 12px 34px rgba(0,0,0,.5); color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:28px 28px}
button,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance;line-height:1.05}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1480px;margin:0 auto;padding-inline:20px;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:.02em;line-height:1;display:block}
.brand span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:2px;flex:1;min-width:0}
.tab{all:unset;cursor:pointer;padding:7px 11px;border-radius:6px;font-weight:500;font-size:14px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
.tab:focus-visible{outline:2px solid var(--accent)}
.tools{display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.theme-btn{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);background:var(--ink);color:var(--paper);border-radius:50%;padding:0;cursor:pointer}
.theme-btn svg{width:17px;height:17px}

/* layout: page + docked panel */
.layout{max-width:1480px;margin:0 auto;padding-inline:20px;padding-block:20px 60px;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:22px;align-items:start}
.page{min-width:0}
.dock{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);max-height:calc(100vh - 92px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.dock-head{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;gap:10px;align-items:start;padding:14px 18px 10px;border-bottom:1px solid var(--line);z-index:1}
.dock-head h2{font-size:26px;margin-top:3px}
.dock-body{padding:14px 18px 22px;display:grid;gap:14px}
.dock-body h4{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
.dock-body p{font-size:14.5px}
.dock-body ul{margin:0;padding-left:18px;font-size:14px}
.dock-body li{margin-bottom:4px}
.x{all:unset;cursor:pointer;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 9px;color:var(--muted)}
.x:hover{color:var(--ink)} .x:focus-visible{outline:2px solid var(--accent)}
.lead{font-size:15.5px}
.tech{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:10px}
.tech>.eyebrow{color:var(--accent)}

/* page heads */
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:end;margin-bottom:16px}
.ph h1{font-size:clamp(34px,4.2vw,52px);font-weight:800}
.ph p{color:var(--muted);max-width:70ch;margin-top:8px}
.sec{margin-top:28px}
.sec>h2{font-size:28px;margin-bottom:4px}
.sec>p{color:var(--muted);max-width:70ch;margin-bottom:12px}

/* clickable cells */
.cell{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:4px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 13px;min-width:0;transition:border-color .12s,box-shadow .12s}
.cell:hover{border-color:var(--accent)}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cell.is-sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.cell b{font-weight:600;font-size:14.5px;line-height:1.3}
.cell span{font-size:13px;color:var(--muted)}
.cell .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:10px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))} .gauto{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface);color:var(--ink);max-width:100%}
.chip:hover{border-color:var(--accent)} .chip:focus-visible{outline:2px solid var(--accent)}
.chip.is-sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:10.5px;padding:2px 7px;border-radius:4px;letter-spacing:.04em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.n{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ms{font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
.L-Keel{background:var(--keel);color:var(--keel-ink);border-color:var(--keel)} .L-Hull{background:var(--hull);color:var(--ink)} .L-Adapter{background:var(--warn-soft);color:var(--ink)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
tr:last-child td{border-bottom:0}

/* vessel */
.vessel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vessel svg{display:block;width:100%;height:auto}
.vh{cursor:pointer}
.vh:focus{outline:none}
.vh .hl{fill:none;stroke:transparent;stroke-width:3}
.vh:hover .hl,.vh:focus-visible .hl{stroke:var(--accent)}
.vh.is-sel .hl{stroke:var(--accent);stroke-width:4}
.vt{font-family:var(--f-body);font-size:13px;fill:var(--ink);pointer-events:none}
.vt-b{font-family:var(--f-display);font-size:19px;font-weight:700;fill:var(--ink);pointer-events:none;letter-spacing:.02em}
.vt-m{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted);letter-spacing:.1em;pointer-events:none}
.on-sky{fill:var(--sky-ink)} .on-sky-m{fill:var(--sky-mute)} .on-keel{fill:var(--keel-ink)}
.sail-band{fill:var(--sail);stroke:var(--sail-line);stroke-width:1}
.vh:hover .sail-band{fill:var(--accent-soft)} .vh.is-sel .sail-band{fill:var(--accent-soft)}
.keel-row{fill:var(--keel-card);stroke:var(--keel-line);stroke-width:1}
.vh:hover .keel-row,.vh.is-sel .keel-row{fill:var(--keel-line)}
.hull-cell{fill:var(--surface);stroke:var(--line)}
.vh:hover .hull-cell,.vh.is-sel .hull-cell{fill:var(--accent-soft)}
.sea-tile{fill:var(--surface);stroke:var(--line)}
.vh:hover .sea-tile,.vh.is-sel .sea-tile{fill:var(--accent-soft)}
.port{fill:var(--surface-2);stroke:var(--sea-line);stroke-dasharray:4 3}
.vh:hover .port,.vh.is-sel .port{fill:var(--warn-soft)}
.halyard{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round}
.vh.is-sel .halyard,.vh:hover .halyard{stroke-width:6}
.hit{stroke:transparent;stroke-width:22;fill:none}
.vlegend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

/* seven seas rose */
.rose{width:100%;height:auto;display:block}
.rw path{fill-opacity:.22;stroke:var(--paper);stroke-width:3;transition:fill-opacity .15s}
.rw:hover path{fill-opacity:.4} .rw.is-sel path{fill-opacity:.7}
.rw{cursor:pointer} .rw:focus{outline:none} .rw:focus-visible path{stroke:var(--ink)}
.rl{font-family:var(--f-display);font-size:17px;font-weight:700;fill:var(--ink);pointer-events:none;letter-spacing:.02em}
.rn{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted);pointer-events:none}
.seas-top{display:grid;grid-template-columns:minmax(240px,420px) minmax(0,1fr);gap:20px;align-items:center}

/* matrices */
.mx td,.mx th{vertical-align:top}
.mx td{min-width:150px}
.mx .rowh{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-size:19px;font-weight:700}
.mx .rowh:hover{color:var(--accent)} .mx .rowh:focus-visible{outline:2px solid var(--accent)}
.mx .rowh.is-sel{color:var(--accent)}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:block;border:1px solid var(--line);border-radius:6px;padding:6px 9px;margin-bottom:6px;background:var(--surface);font-size:13px;font-weight:500;line-height:1.3}
.tile:hover{border-color:var(--accent)} .tile:focus-visible{outline:2px solid var(--accent)} .tile.is-sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tile.dim{opacity:.35}
.tile small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.heat{border-collapse:separate;border-spacing:2px;width:auto}
.heat th,.heat td{padding:0;border:0;background:transparent}
.heat th.c{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;padding:4px 0;height:56px}
.heat th.r{font-family:var(--f-body);font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--ink);text-align:right;padding-right:8px;white-space:nowrap;font-weight:500}
.hc{all:unset;cursor:pointer;display:block;width:22px;height:22px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-soft)}
.hc.on{background:var(--accent);border-color:var(--accent)}
.hc.on.L-Keel{background:var(--keel);border-color:var(--keel)}
.hc.on.L-Adapter{background:var(--warn);border-color:var(--warn)}
.hc:hover{outline:2px solid var(--accent)} .hc.is-sel{outline:3px solid var(--ink)}
.hb{all:unset;cursor:pointer} .hb:hover{color:var(--accent)} .hb:focus-visible{outline:2px solid var(--accent)}
.cross td{text-align:center;min-width:120px}
.xc{all:unset;cursor:pointer;display:grid;gap:3px;justify-items:center;padding:10px 8px;border-radius:8px;width:100%;box-sizing:border-box;border:1px solid var(--line)}
.xc.allow{background:var(--ok-soft)} .xc.block{background:var(--crit-soft)}
.xc:hover{outline:2px solid var(--accent)} .xc.is-sel{outline:3px solid var(--ink)}
.xc b{font-family:var(--f-display);font-size:18px}
.xc.allow b{color:var(--ok)} .xc.block b{color:var(--crit)}
.zones{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.9fr) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.zone{padding:16px;display:grid;gap:8px;align-content:start}
.zone h3{font-size:22px}
.zone.own{background:var(--keel);color:var(--keel-ink)} .zone.own .eyebrow{color:var(--keel-ink);opacity:.75}
.zone.own .cell{background:var(--keel-card);border-color:var(--keel-line);color:var(--keel-ink)} .zone.own .cell span{color:var(--keel-ink);opacity:.75}
.zone.cross{background:var(--accent-soft);border-left:2px dashed var(--accent);border-right:2px dashed var(--accent)}
.zone.vend{background:var(--surface)}

/* agents */
.agent-cell b{font-family:var(--f-display);font-size:21px;font-weight:700}
.try{display:grid;gap:10px}
.field{display:grid;gap:3px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
.result{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:11px 13px;display:grid;gap:7px}
.result b{font-size:15px}
.calls{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.arrow{color:var(--muted);font-size:12px}
.score{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.dt td{font-size:12px} .dt tr.sel td{background:var(--accent-soft)}

/* roadmap */
.road th.p{font-family:var(--f-display);font-size:20px;text-transform:none;letter-spacing:.01em;color:var(--ink)}
.road th.p small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.road td{min-width:200px}
.road .wsh{font-family:var(--f-display);font-size:18px;font-weight:700;white-space:nowrap}
.rc{all:unset;box-sizing:border-box;cursor:pointer;display:block;font-size:13.5px;line-height:1.4;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);width:100%}
.rc:hover{border-color:var(--accent)} .rc.is-sel{box-shadow:0 0 0 2px var(--accent) inset;border-color:var(--accent)} .rc:focus-visible{outline:2px solid var(--accent)}
.reuse{display:flex;gap:10px;align-items:baseline}
.reuse b{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}

.thesis b{font-family:var(--f-display);font-size:22px;font-weight:700}


/* capabilities */
.caprows{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.caprow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;padding:14px 16px;border-top:1px solid var(--line);align-items:start;background:var(--surface)}
.caprow:first-child{border-top:0;background:var(--surface-2)}
.caprow:last-child{background:var(--keel);color:var(--keel-ink)}
.caprow:last-child .cell{background:var(--keel-card);border-color:var(--keel-line);color:var(--keel-ink)} .caprow:last-child .cell span{color:var(--keel-ink);opacity:.75}
.caplab b{font-family:var(--f-display);font-size:22px;display:block}
.caplab span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.flow,.loop{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.flow .cell,.loop .cell{flex:1 1 180px}
.farrow{align-self:center;color:var(--muted);font-size:20px}
.flow-under{margin-top:8px;max-width:520px}
.tiers3{display:grid;gap:6px}
.tiers3 .t-top{border-left:5px solid var(--accent)} .tiers3 .t-mid{border-left:5px solid var(--star)} .tiers3 .t-bot{border-left:5px solid var(--sea-line)}
.mstack{display:grid;gap:6px;max-width:760px}
.mstack .m-found{background:var(--keel);color:var(--keel-ink);border-color:var(--keel)} .mstack .m-found span{color:var(--keel-ink);opacity:.75}
@media (max-width:760px){.caprow{grid-template-columns:minmax(0,1fr)} .farrow{display:none}}

@media (max-width:1180px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .dock{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:62vh;border-radius:14px 14px 0 0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(105%);transition:transform .2s}
  .dock.open{transform:none}
  .seas-top{grid-template-columns:minmax(0,1fr)}

function roseSVG(){

  const g=FS_SEAS.map((s,i)=>{const a0=st+i*360/n,a1=a0+360/n,am=(a0+a1)/2;const lx=cx+132*Math.cos(am*Math.PI/180),ly=cy+132*Math.sin(am*Math.PI/180);
    return `<g class="rw" tabindex="0" role="button" ${attrs("sea",s.id,s.name)}><path d="M ${P(r0,a0)} L ${P(R,a0)} A ${R} ${R} 0 0 1 ${P(R,a1)} L ${P(r0,a1)} A ${r0} ${r0} 0 0 0 ${P(r0,a0)} Z" style="fill:${SEA_COLOR[s.id]}"/><text x="${lx.toFixed(1)}" y="${(ly-2).toFixed(1)}" text-anchor="middle" class="rl">${esc(s.name)}</text><text x="${lx.toFixed(1)}" y="${(ly+14).toFixed(1)}" text-anchor="middle" class="rn">${FS_FEAT.filter(f=>f.sea===s.id).length} services</text></g>`}).join("");
  return `<svg viewBox="0 0 440 440" class="rose" role="group" aria-label="The Seven Seas"><circle cx="${cx}" cy="${cy}" r="${R+8}" fill="none" stroke="var(--line)" stroke-width="1.5"/>${g}<g class="rw" tabindex="0" role="button" ${attrs("part","northstar","North Star")}><circle cx="${cx}" cy="${cy}" r="${r0-4}" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><path d="M${cx} ${cy-34} L${cx+7} ${cy-7} L${cx+34} ${cy} L${cx+7} ${cy+7} L${cx} ${cy+34} L${cx-7} ${cy+7} L${cx-34} ${cy} L${cx-7} ${cy-7} Z" fill="var(--star)"/><path d="M${cx} ${cy-34} L${cx+7} ${cy-7} L${cx-7} ${cy-7} Z" fill="var(--ink)"/></g><text x="${cx}" y="${cy+52}" text-anchor="middle" class="rn" style="letter-spacing:.08em">NORTH STAR</text></svg>`;
}

  const cell=c=>`<button class="cell" ${attrs("cap",c.id)}><b>${esc(c.name)}</b><span>${esc(c.where)}</span></button>`;
  const g=(k,id,cls)=>{const x=GEN[k][id];return `<button class="cell${cls?" "+cls:""}" ${attrs(k,id)}><span class="k">${esc(x.e)}</span><b>${esc(x.n)}</b><span>${esc(x.l)}</span></button>`};

   <div class="caprows">${rows.map(([L,sub])=>{const cs=CAPS.filter(c=>c.layer===L);return `<div class="caprow"><div class="caplab"><b>${esc(L)}</b><span>${esc(sub)}</span></div><div class="grid gauto">${cs.map(cell).join("")}</div></div>`}).join("")}</div>

    <div class="flow">${g("pol","pap")}<span class="farrow">→</span>${g("pol","pdp")}<span class="farrow">→</span>${g("pol","pep")}</div><div class="flow-under">${g("pol","pip")}</div></section>
   <section class="sec"><h2>Three-tier extraction</h2><p>Sources meet meaning in the middle. Methods escalate only when needed.</p>
    <div class="tiers3">${g("tier","t1","t-top")}${g("tier","t2","t-mid")}${g("tier","t3","t-bot")}</div><div class="flow" style="margin-top:10px">${g("tier","m1")}<span class="farrow">→</span>${g("tier","m2")}<span class="farrow">→</span>${g("tier","m3")}</div></section>
   <section class="sec"><h2>Measurement: from experience to cause</h2><p>Each layer builds on the one below; metrology defines them all.</p>
    <div class="mstack">${["cau","out","ops","exp"].map(id=>g("mst",id)).join("")}${g("mst","met","m-found")}</div></section>

/* ===================== PANEL ===================== */
function head(eyebrow,title){return `<div class="dock-head"><div><span class="eyebrow">${eyebrow}</span><h2>${esc(title)}</h2></div>${S.sel?`<button class="x" data-close>Close</button>`:""}</div>`}
const techHint=()=>tech()?"":`<p class="note">Switch to the technical view for decision tables, microservices and standards.</p>`;
function pDefault(){
  const intro={caps:["Where each capability lives","Click a capability to see what it does, the services and agents that use it, and a button that shows it on the vessel."],overview:["Start here","Click the North Star, the halyard, the sail, the bridge, any hull cell, a keel row, the ballast or any of the Seven Seas."],seas:["The front door","Click a sea on the compass or in the table to see its jobs, systems, services and agents."],services:["The catalog","Click any service tile. The filter dims services for the other audience."],agents:["Decision models","Open an agent to try its decision model with your own inputs."],micro:["Shared parts","Click a microservice or any cell in the reuse matrix."],boundary:["IP boundary","Click a zone item, a rule, or a cell in the crossing matrix."],roadmap:["Roadmap","Click a phase, a roadmap cell, a measure, a risk or a decision."]}[S.page];
  return head("Details",intro[0])+`<div class="dock-body"><p class="lead">${esc(intro[1])}</p>
   <div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><div class="score">${FS_FEAT.length}</div><span class="note">services</span></div><div><div class="score">${FS_AGENTS.length}</div><span class="note">agents</span></div><div><div class="score">${FS_MS.length}</div><span class="note">microservices</span></div></div>
   <div><h4>Reuse by phase</h4>${FS_PH.map((p,i)=>`<div class="reuse"><b>${i?RU[i].pct+"%":RU[0].fresh.length}</b><span class="note">${i?`Phase ${p.n} reuse · ${RU[i].fresh.length} new microservice${RU[i].fresh.length===1?"":"s"}`:"microservices built in phase 1"}</span></div>`).join("")}</div>
   <p class="note">Viewing as ${tech()?"a technical leader":"an executive"}. Use the switch at the top to change.</p></div>`;

function pnSea(id){const s=FS_SEA[id]; const fs=FS_FEAT.filter(f=>f.sea===id||f.sea==="all"); const ags=[...new Set(fs.flatMap(f=>f.ag))]; const ms=[...new Set(fs.flatMap(f=>f.ms))];

function pnAgent(id){const a=FS_A[id], v=agVals(a), e=fsEval(a,v); const fs=FS_FEAT.filter(f=>f.ag.includes(id));

function pnMs(id){const m=FS_M[id]; const fs=usedBy(id), ags=agentsUsing(id);
  return head(`${m.layer==="Adapter"?"Adapter":m.layer} · ${id}`,m.name)+`<div class="dock-body"><p class="lead">${esc(m.what)}</p><p class="note">${esc(LAYER_MEAN[m.layer])}</p>

function pnUse(key){const [fid,mid]=key.split("|"),f=FS_F[fid],m=FS_M[mid],on=f.ms.includes(mid);
  return head(on?"Reuse":"Not used",`${f.name} · ${mid}`)+`<div class="dock-body"><p class="lead">${on?`${esc(f.name)} uses ${esc(m.name)}.`:`${esc(f.name)} does not use ${esc(m.name)}.`}</p>
   <div><h4>Service</h4><div class="chips">${svcChip(fid)}</div><p class="note" style="margin-top:6px">${esc(f.v)}</p></div>
   <div><h4>Microservice</h4><div class="chips">${msChip(mid)}</div><p class="note" style="margin-top:6px">${esc(m.what)}</p></div>
   <p class="note">${esc(m.name)} serves ${usedBy(mid).length} services in total.</p></div>`;}
function pnPort(id){const p=PORTS[id];
  return head(`Port · adapter ${esc(p.ad)}`,p.name)+`<div class="dock-body"><p class="lead">${esc(p.lead)}</p>
   <div><h4>Comes in</h4>${ul(p.inn)}</div><div><h4>Goes out</h4>${ul(p.out)}</div><div><h4>Never leaves Insperity</h4>${ul(p.never)}</div>
   <div class="chips">${FS_M[p.ad]?msChip(p.ad):""}${agChip("IPG")}${goBtn("boundary")}</div></div>`;}
function pnCross(key){const [di,pi,tm]=key.split("|").map(Number),a=FS_A.IPG,e=fsEval(a,{ds:di,py:pi,tm}),allow=/^Allow/.test(e.r.out);
  return head(`Crossing · rule ${e.i+1}`,allow?"Allowed":"Blocked")+`<div class="dock-body"><p class="lead">${esc(a.inputs[1].opts[pi])} to ${esc(a.inputs[0].opts[di])}.</p>
   <div class="result"><span class="eyebrow">Decision</span><b>${esc(e.r.out)}</b><span class="note">${esc(a.inputs[2].opts[tm])}</span></div>
   ${tech()?`<div class="tech"><span class="eyebrow">Microservices called</span><div class="calls">${e.r.calls.map((m,i)=>`${i?'<span class="arrow">→</span>':""}<button class="chip" ${attrs("ms",m)}><span class="ms L-${FS_M[m].layer}">${m}</span></button>`).join("")}</div></div>`:""}
   <div class="chips">${agChip("IPG")}</div>${techHint()}</div>`;}
function pnIpRule(i){const r=FS_A.IPG.rules[+i];
  return head(`IP boundary guardian · rule ${+i+1}`,/^Allow/.test(r.out)?"Allow":"Block")+`<div class="dock-body"><p class="lead">${esc(r.out)}.</p><p class="note">Rules are checked from the top; the first match decides. Blocking rules come first, so the most protective outcome wins.</p><div class="chips">${agChip("IPG")}${goBtn("boundary")}</div></div>`;}
function pnRoad(key){const [ws,i]=key.split("|"),w=WS.find(x=>x.id===ws),p=FS_PH[+i];
  return head(`${esc(w.name)} · Phase ${p.n}`,p.name)+`<div class="dock-body"><p class="lead">${esc(w.c[+i])}</p><div><h4>Phase goal</h4><p>${esc(p.goal)} (${esc(p.when)}).</p></div><div><h4>Exit criteria</h4>${ul(p.exit)}</div><div class="chips"><button class="chip" ${attrs("phase",String(p.n))}>Phase ${p.n} details</button></div></div>`;}
function pnSimple(kind,i){const arr={measure:MEASURES,risk:RISKS,decision:DECISIONS}[kind],x=arr[+i];
  const ey={measure:"Measure",risk:"Risk",decision:"Decision "+(+i+1)}[kind];
  return head(ey,x[0])+`<div class="dock-body">${kind==="risk"?`<h4>Response</h4>`:""}<p class="lead">${esc(x[1])}</p>${kind==="measure"?`<p class="note">Baseline in phase 1; target agreed with the sponsor before phase 2.</p>`:""}</div>`;}

function renderPanel(){
  const d=$("dock"); const s=S.sel; let h;
  try{ h=!s?pDefault():s.k==="part"?pnPart(s.id):s.k==="phase"?pnPhase(+s.id):s.k==="sea"?pnSea(s.id):s.k==="svc"?pnSvc(s.id):s.k==="agent"?pnAgent(s.id):s.k==="ms"?pnMs(s.id):s.k==="use"?pnUse(s.id):s.k==="port"?pnPort(s.id):s.k==="cross"?pnCross(s.id):s.k==="iprule"?pnIpRule(s.id):s.k==="road"?pnRoad(s.id):s.k==="thesis"?pnThesis(s.id):s.k==="cap"?pnCap(s.id):GEN[s.k]?pnGen(s.k,s.id):pnSimple(s.k,s.id);}catch(e){h=pDefault();}
  d.innerHTML=h; d.classList.toggle("open",!!s); d.scrollTop=0; markSel();
}
function markSel(){document.querySelectorAll("[data-k]").forEach(el=>el.classList.toggle("is-sel",!!S.sel&&el.dataset.k===S.sel.k&&el.dataset.id===S.sel.id));}

/* ===================== RENDER & EVENTS ===================== */
function renderTabs(){
  $("tabs").innerHTML=PAGES.map(([k,l])=>`<button class="tab" data-go="${k}" aria-current="${S.page===k?"page":"false"}">${l}</button>`).join("");
  $("aud").innerHTML=[["exec","Executive"],["tech","Technical"]].map(([k,l])=>`<button data-aud="${k}" aria-pressed="${S.aud===k}">${l}</button>`).join("");
}
function renderPage(){
  const f={caps:pCaps,overview:pOverview,seas:pSeas,services:pServices,agents:pAgents,micro:pMicro,boundary:pBoundary,roadmap:pRoadmap}[S.page];
  $("page").innerHTML=f(); markSel();
}
function go(page,keepSel){if(!PAGES.some(p=>p[0]===page))page="overview"; S.page=page; if(!keepSel)S.sel=null; renderTabs(); renderPage(); renderPanel(); window.scrollTo(0,0);}
function open(k,id){S.sel={k,id}; renderPanel();}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-k],[data-go],[data-aud],[data-close],[data-filt],[data-tm],[data-show]"); if(!t)return;
  if(t.dataset.show){const [k,id]=t.dataset.show.split("|"); S.sel={k,id}; go("overview",true); setTimeout(()=>{const el=document.querySelector(`.vessel [data-k="${k}"][data-id="${id}"]`); if(el&&el.scrollIntoView)el.scrollIntoView({block:"center",behavior:"smooth"});},40); return;}
  if(t.hasAttribute("data-close")){S.sel=null; renderPanel(); return;}
  if(t.dataset.go){ const inPanel=!!t.closest("#dock"); go(t.dataset.go,inPanel); return;}
  if(t.dataset.aud){S.aud=t.dataset.aud; store.set("aud",S.aud); renderTabs(); renderPage(); renderPanel(); return;}
  if(t.dataset.filt){S.filt=t.dataset.filt; renderPage(); return;}
  if(t.dataset.tm){S.tm=+t.dataset.tm; renderPage(); if(S.sel&&S.sel.k==="cross"){const p=S.sel.id.split("|"); S.sel.id=p[0]+"|"+p[1]+"|"+S.tm; renderPanel();} return;}
  if(t.dataset.k)open(t.dataset.k,t.dataset.id);
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("g[data-k]")){e.preventDefault(); open(e.target.dataset.k,e.target.dataset.id); return;}
  if(e.key==="Escape"&&S.sel){S.sel=null; renderPanel();}
});
document.addEventListener("change",e=>{const t=e.target; if(t.dataset&&t.dataset.agin&&S.sel&&S.sel.k==="agent"){agVals(FS_A[S.sel.id])[t.dataset.agin]=+t.value; const id=t.id, sc=$("dock").scrollTop; renderPanel(); $("dock").scrollTop=sc; document.getElementById(id)?.focus();}});

/* theme */
function isDark(){const t=document.documentElement.getAttribute("data-theme"); return t?t==="dark":!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);}
function syncTheme(){const b=$("themebtn"),d=isDark(),p=b.querySelector("path"); const l=d?"Switch to light mode":"Switch to dark mode"; b.setAttribute("aria-label",l); b.title=l;
  p.setAttribute("d",d?"M8 4.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7ZM8 0v2.5M8 13.5V16M0 8h2.5M13.5 8H16M2.3 2.3l1.8 1.8M11.9 11.9l1.8 1.8M2.3 13.7l1.8-1.8M11.9 4.1l1.8-1.8":"M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7Z"); p.setAttribute("stroke",d?"currentColor":"none"); p.setAttribute("stroke-width","1.5");}
if(typeof document!=="undefined"&&$("page")){
  const th=store.get("theme",null); if(th)document.documentElement.setAttribute("data-theme",th);
  $("themebtn").addEventListener("click",()=>{const n=isDark()?"light":"dark"; document.documentElement.setAttribute("data-theme",n); store.set("theme",n); syncTheme();});
  try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncTheme)}catch(e){}
  syncTheme();
  let h=""; try{h=(location.hash||"").slice(1)}catch(e){}
  go(PAGES.some(p=>p[0]===h)?h:"overview");
}
</script>

</body>
