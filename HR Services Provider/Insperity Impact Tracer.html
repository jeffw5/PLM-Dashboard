<!DOCTYPE html>
<html lang="en">
<head>

<title>Insperity Impact Tracer</title>
<style>
:root{
  --navy:#0B1F3A;--navy2:#12305A;--navy-soft:#1C3A63;
  --gold:#C8A951;--gold-hi:#E4C572;
  --ice:#EDF2F8;--ice2:#F6F9FC;--surface:#FFFFFF;
  --ink:#20344B;--muted:#5E7188;--hair:#D8E1EC;
  --up:#B8842B;--down:#2E7D5B;--inf:#7A5AA6;--reg:#B23A3A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--ice);line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}
h1,h2,h3,h4{margin:0;font-weight:600}
header.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold);flex:0 0 auto}
.top .wrap{display:flex;align-items:center;gap:14px;padding:12px 18px;flex-wrap:wrap}
.brandmark{width:30px;height:30px}
.brandtext .k{font-family:var(--serif);font-size:18px}
.brandtext .s{font-size:11px;color:#9db4d4;letter-spacing:.06em;text-transform:uppercase}
.top .spacer{flex:1}
.applink{font-size:12px;font-weight:600;text-decoration:none;color:var(--navy);background:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:5px 12px}
.applink:hover{background:var(--gold-hi)}
/* controls */
.controls{flex:0 0 auto;background:var(--ice2);border-bottom:1px solid var(--hair);display:flex;gap:14px;align-items:center;padding:9px 18px;flex-wrap:wrap}
.controls label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.controls select,.controls input{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--hair);border-radius:7px;background:#fff;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;padding:6px 11px;border:0;background:#fff;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.btn{font:inherit;font-size:12.5px;padding:6px 11px;border:1px solid var(--hair);border-radius:7px;background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--navy-soft)}
.zoom{display:inline-flex;gap:4px;align-items:center}
.zoom button{width:28px;height:28px;font-size:16px;line-height:1;border:1px solid var(--hair);border-radius:7px;background:#fff;cursor:pointer}
/* body split */
.main{flex:1 1 auto;display:flex;min-height:0}
.canvas{flex:1 1 auto;overflow:auto;background:
  radial-gradient(circle at 1px 1px, #dbe4ef 1px, transparent 0) 0 0/22px 22px, var(--ice)}
.panel{flex:0 0 330px;background:var(--surface);border-left:1px solid var(--hair);overflow-y:auto;padding:16px 16px 40px}
.panel h3{font-family:var(--serif);font-size:16px;margin-bottom:4px}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
.panel h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy2);margin:14px 0 6px;border-bottom:1px solid var(--hair);padding-bottom:3px}
.panel .row{font-size:12.5px;margin:3px 0;display:flex;gap:6px;align-items:baseline;justify-content:space-between}
.panel .row .nm{flex:1}
.tag{font-size:10px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tag.d{background:#E6F1EC;color:var(--down)}
.tag.i{background:#EDE7F4;color:var(--inf)}
.tag.reg{background:#F6E4E4;color:var(--reg)}
.metric{background:var(--ice2);border:1px solid var(--hair);border-radius:8px;padding:10px 12px;margin:8px 0}
.metric .big{font-family:var(--serif);font-size:22px;color:var(--navy)}
.metric .lbl{font-size:11px;color:var(--muted)}
.bar{height:7px;border-radius:4px;background:#EDE7F4;overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--down)}
.hint{font-size:12.5px;color:var(--muted)}
.hint b{color:var(--ink)}
.legend{display:flex;flex-direction:column;gap:5px;font-size:11.5px;margin-top:6px}
.legend .li{display:flex;align-items:center;gap:7px}
.sw{width:22px;height:0;border-top:3px solid #9DB2C8;display:inline-block}
.sw.dash{border-top-style:dashed}
.sw.up{border-top-color:var(--up)}
.sw.down{border-top-color:var(--down)}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
/* svg node/edge states */
.edge{fill:none;stroke:#AFC0D3;stroke-width:1.4}
.edge.inf{stroke-dasharray:5 4}
.edge.dim{opacity:.05}
.edge.act-up{stroke:var(--up);stroke-width:2.4;opacity:1}
.edge.act-down{stroke:var(--down);stroke-width:2.4;opacity:1}
.node rect{fill:#fff;stroke:var(--hair);stroke-width:1.3;rx:7}
.node text{font-size:10.5px;fill:var(--ink);font-family:var(--sans)}
.node.infnode rect{stroke:var(--inf);stroke-dasharray:4 3}
.node{cursor:pointer}
.node:hover rect{stroke:var(--navy-soft)}
.node.dim{opacity:.13}
.node.sel rect{fill:var(--navy);stroke:var(--navy)}
.node.sel text{fill:#fff}
.node.up rect{fill:#FBF3DF;stroke:var(--up);stroke-width:2}
.node.down rect{fill:#E9F3ED;stroke:var(--down);stroke-width:2}
.colhead{font-size:11px;font-weight:700;fill:var(--navy2);font-family:var(--sans)}
.colguide{stroke:#E1E9F2;stroke-width:1}
@media (max-width:820px){.panel{flex-basis:250px}}
</style>
</head>

const NODE = {}; N.forEach(([id,l,t,m])=>NODE[id]={id,l,t,m:m||{}});
const EDGES = E.map((s,i)=>{const [f,t,k,r]=s.split("|");return {id:"e"+i,f,t,k,r};});
const OUT={},IN={};
EDGES.forEach(e=>{(OUT[e.f]=OUT[e.f]||[]).push(e);(IN[e.t]=IN[e.t]||[]).push(e);});

function bfs(start,dir,scope){
  const sn=new Set([start]),se=new Set(),q=[start];
  while(q.length){const cur=q.shift();
    const list=(dir==="out"?OUT[cur]:IN[cur])||[];
    for(const e of list){ if(scope==="direct"&&e.k!=="direct")continue;
      se.add(e.id); const nx=dir==="out"?e.t:e.f;
      if(!sn.has(nx)){sn.add(nx);q.push(nx);} }

/* ============================================================
   LAYOUT
   ============================================================ */
const NODEW=172,NODEH=38,ROWGAP=44,COLGAP=204,MARGINL=30,TOPPAD=44;
const byLayer={}; N.forEach(([id,l])=>{(byLayer[l]=byLayer[l]||[]).push(id);});
let maxRows=0; for(const l in byLayer) maxRows=Math.max(maxRows,byLayer[l].length);
const H=TOPPAD+maxRows*ROWGAP+20;
const W=MARGINL+(LAYERS.length-1)*COLGAP+NODEW+MARGINL;
const POS={};
for(let l=0;l<LAYERS.length;l++){
  const ids=byLayer[l]||[]; const off=(maxRows-ids.length)/2*ROWGAP;
  ids.forEach((id,i)=>{POS[id]={x:MARGINL+l*COLGAP, y:TOPPAD+off+i*ROWGAP};});
}

const SVGNS="http://www.w3.org/2000/svg";
const NODEEL={},EDGEEL={};
let scale=1;

function wrap(t){
  const M=28; if(t.length<=M) return [t];
  const w=t.split(" "); let a="";
  while(w.length && (a+(a?" ":"")+w[0]).length<=M){a+=(a?" ":"")+w.shift();}
  if(!a){a=t.slice(0,M);return [a,t.slice(M,M*2-1)+(t.length>M*2-1?"…":"")];}
  let b=w.join(" "); if(b.length>M) b=b.slice(0,M-1)+"…";
  return [a,b];
}
function E_(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function render(){
  const svg=document.createElementNS(SVGNS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("width",W*scale); svg.setAttribute("height",H*scale);
  // column guides + headers
  for(let l=0;l<LAYERS.length;l++){
    const cx=MARGINL+l*COLGAP;
    const g=document.createElementNS(SVGNS,"line");
    g.setAttribute("x1",cx-14);g.setAttribute("x2",cx-14);g.setAttribute("y1",34);g.setAttribute("y2",H-10);
    g.setAttribute("class","colguide"); svg.appendChild(g);
    const h=document.createElementNS(SVGNS,"text");
    h.setAttribute("x",cx);h.setAttribute("y",22);h.setAttribute("class","colhead");
    h.textContent=(l+1)+" · "+LAYERS[l].k; svg.appendChild(h);
  }
  // edges
  EDGES.forEach(e=>{
    const s=POS[e.f],t=POS[e.t]; if(!s||!t)return;
    const sx=s.x+NODEW,sy=s.y+NODEH/2,tx=t.x,ty=t.y+NODEH/2,dx=(tx-sx)*0.45;
    const p=document.createElementNS(SVGNS,"path");
    p.setAttribute("d",`M${sx},${sy} C${sx+dx},${sy} ${tx-dx},${ty} ${tx},${ty}`);
    p.setAttribute("class","edge"+(e.k==="inferred"?" inf":""));
    EDGEEL[e.id]=p; svg.appendChild(p);
  });
  // nodes
  N.forEach(([id,l,t,m])=>{
    const p=POS[id]; const g=document.createElementNS(SVGNS,"g");
    g.setAttribute("class","node"+(m&&m.inf?" infnode":"")); g.dataset.id=id;
    g.setAttribute("transform",`translate(${p.x},${p.y})`);
    const r=document.createElementNS(SVGNS,"rect");
    r.setAttribute("width",NODEW);r.setAttribute("height",NODEH);r.setAttribute("rx",7);
    g.appendChild(r);
    const tx=document.createElementNS(SVGNS,"text");
    tx.setAttribute("x",NODEW/2);tx.setAttribute("text-anchor","middle");
    const lines=wrap(t);
    lines.forEach((ln,i)=>{const ts=document.createElementNS(SVGNS,"tspan");
      ts.setAttribute("x",NODEW/2);ts.setAttribute("y",lines.length===1?NODEH/2+4:14+i*13);
      ts.textContent=ln;tx.appendChild(ts);});
    g.appendChild(tx);
    const title=document.createElementNS(SVGNS,"title");
    title.textContent=t+(m&&m.s?" — "+m.s:"")+(m&&m.dv?" ["+m.dv+"]":"");
    g.appendChild(title);
    NODEEL[id]=g; svg.appendChild(g);
  });
  const c=document.getElementById("canvas"); c.innerHTML=""; c.appendChild(svg);
  svg.addEventListener("click",ev=>{const g=ev.target.closest(".node"); if(g)select(g.dataset.id); else clearSel();});
}

function select(id){
  curId=id; const sc=scope();
  const up=bfs(id,"in",sc), down=bfs(id,"out",sc);
  const active=new Set([...up.sn,...down.sn]);
  for(const nid in NODEEL){const el=NODEEL[nid];el.classList.remove("sel","up","down","dim");
    if(nid===id)el.classList.add("sel");
    else if(active.has(nid))el.classList.add(down.sn.has(nid)?"down":"up");
    else el.classList.add("dim");}
  for(const eid in EDGEEL){const el=EDGEEL[eid];el.classList.remove("act-up","act-down","dim");
    if(down.se.has(eid))el.classList.add("act-down");
    else if(up.se.has(eid))el.classList.add("act-up");
    else el.classList.add("dim");}
  buildPanel(id);
  const rs=document.getElementById("regimeSel"); rs.value=(NODE[id].l===0?id:""); document.getElementById("projSel").value=(NODE[id].l===3?id:"");
}
function clearSel(){curId=null;
  for(const nid in NODEEL)NODEEL[nid].classList.remove("sel","up","down","dim");

    ? `<span class="tag d">direct</span>` : `<span class="tag i">inferred</span>`;
  let html=`<h3><span class="dot" style="background:${layerC};margin-right:7px"></span>${E_(n.t)}</h3>`;
  html+=`<div class="sub">${E_(LAYERS[n.l].k)}${n.m.s?" · "+E_(n.m.s):""}${n.m.w?" · impact weight "+n.m.w:""}${n.m.dv?' · <span class="tag '+(n.m.inf?"i":"d")+'">'+n.m.dv+"</span>":""}${n.m.reg?' <span class="tag reg">regulated</span>':""}</div>`;

  if(ops.length){
    const opsDir=ops.filter(x=>downDir.sn.has(x)).length;
    const pct=Math.round(100*opsDir/ops.length);
    html+=`<div class="metric"><div class="lbl">Business operations reached</div>
      <div class="big">${ops.length}<span style="font-size:13px;color:var(--muted)"> total · ${opsDir} via direct-only</span></div>
      <div class="lbl">${ops.length-opsDir} depend on an inferred link · path purity ${pct}%</div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }
  if(regimes.length){
    html+=`<h4>Traces back to</h4>`;
    regimes.forEach(r=>{html+=`<div class="row"><span class="nm">${E_(NODE[r].t)}</span>${tag(r,upDir)}</div>`;});
  }
  if(rulesOn.length){
    html+=`<h4>SSOT rules on path (${rulesOn.length})</h4>`;
    rulesOn.forEach(r=>{html+=`<div class="row"><span class="nm">${E_(NODE[r].t)}</span></div>`;});
  }
  if(projs.length){
    html+=`<h4>Projects on path (${projs.length})</h4>`;
    projs.forEach(p=>{html+=`<div class="row"><span class="nm">${E_(NODE[p].t)}</span><span class="tag d">${E_((NODE[p].m.s||"").split(" · ")[0])}</span></div>`;});
  }
  if(caps.length){
    html+=`<h4>Value-prop capabilities (${caps.length})</h4>`;
    caps.forEach(c=>{html+=`<div class="row"><span class="nm">${E_(NODE[c].t)}</span></div>`;});
  }
  if(domains.length){
    html+=`<h4>Domains touched (${domains.length})</h4>`;
    domains.forEach(d=>{html+=`<div class="row"><span class="nm">${E_(NODE[d].t)}</span>${tag(d,downDir)}</div>`;});
    if(domains.length>1) html+=`<div class="hint" style="margin-top:4px">Crosses ${domains.length} domains — cross-domain impact.</div>`;
  }
  if(vs.length){
    html+=`<h4>Value streams (${vs.length})</h4>`;
    vs.forEach(v=>{html+=`<div class="row"><span class="nm">${E_(NODE[v].t)}</span>${tag(v,downDir)}</div>`;});
  }
  if(ops.length){
    html+=`<h4>Operations (${ops.length})</h4>`;
    ops.forEach(o=>{html+=`<div class="row"><span class="nm">${E_(NODE[o].t)}</span>${tag(o,downDir)}</div>`;});
  }
  if(!ops.length && !regimes.length){
    html+=`<div class="hint" style="margin-top:12px">This node is a roll-up / terminal node in the current trace scope. Switch <b>Trace via</b> or pick another node.</div>`;
  }
  html+=legendHTML();
  document.getElementById("panel").innerHTML=html;
}

function legendHTML(){
  return `<h4>Legend</h4><div class="legend">
    <div class="li"><span class="sw"></span> direct relation (deterministic)</div>
    <div class="li"><span class="sw dash"></span> inferred relation (AI / estimated)</div>
    <div class="li"><span class="sw up"></span> upstream — why this is flagged</div>
    <div class="li"><span class="sw down"></span> downstream — what it impacts</div>
    <div class="li"><span class="dot" style="background:var(--inf)"></span> dashed border = LLM-judgment node</div>
  </div>`;
}
function defaultPanel(){
  document.getElementById("panel").innerHTML=
   `<h3>Trace an impact path</h3>
    <div class="sub">From Insperity's governing statutes, through the SSOT rules and program projects, to the business operations they protect.</div>
    <div class="hint">
      <p><b>Click any node</b> to light up its full trace: gold = upstream (which regime / defect drives it), green = downstream (which services, value streams and operations it moves).</p>
      <p>Or <b>start from a regime</b> (e.g. FLSA) or <b>a project</b> (e.g. ISP-10) in the dropdowns to see which rules it carries, which capabilities it realizes and which business operations it protects.</p>
      <p>Toggle <b>Trace via → Direct only</b> to drop every AI-inferred link and watch which business impacts <i>disappear</i> — those are the conclusions that depend on inference rather than deterministic knowledge.</p>
    </div>${legendHTML()}`;
}

/* ============================================================
   WIRING
   ============================================================ */
const rs=document.getElementById("regimeSel");
N.filter(n=>n[1]===0).forEach(([id,,t])=>{const o=document.createElement("option");o.value=id;o.textContent=t;rs.appendChild(o);});
const ps=document.getElementById("projSel");
N.filter(n=>n[1]===3).forEach(([id,,t])=>{const o=document.createElement("option");o.value=id;o.textContent=t;ps.appendChild(o);});
ps.addEventListener("change",()=>{ if(ps.value){select(ps.value); const p=POS[ps.value];
  document.getElementById("canvas").scrollTo({left:Math.max(0,p.x*scale-300),top:Math.max(0,(p.y-200)*scale),behavior:"smooth"});} else clearSel();});
rs.addEventListener("change",()=>{ if(rs.value){select(rs.value); const p=POS[rs.value];
  document.getElementById("canvas").scrollTo({left:Math.max(0,p.x*scale-40),top:Math.max(0,(p.y-120)*scale),behavior:"smooth"});} else clearSel();});

document.querySelectorAll("#scopeSeg button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#scopeSeg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); if(curId)select(curId);}));

document.getElementById("resetBtn").addEventListener("click",clearSel);

const search=document.getElementById("search");
search.addEventListener("keydown",e=>{ if(e.key!=="Enter")return;
  const q=search.value.trim().toLowerCase(); if(!q)return;
  const hit=N.find(n=>n[2].toLowerCase().includes(q)); if(hit){select(hit[0]);
    const p=POS[hit[0]];document.getElementById("canvas").scrollTo({left:Math.max(0,p.x*scale-200),top:Math.max(0,(p.y-120)*scale),behavior:"smooth"});}
});

function setZoom(z){scale=Math.min(1.6,Math.max(0.5,z));
  const svg=document.querySelector("#canvas svg"); if(svg){svg.setAttribute("width",W*scale);svg.setAttribute("height",H*scale);}
  document.getElementById("zLbl").textContent=Math.round(scale*100)+"%";}
document.getElementById("zIn").addEventListener("click",()=>setZoom(scale+0.15));
document.getElementById("zOut").addEventListener("click",()=>setZoom(scale-0.15));

render(); defaultPanel();
</script>
</body>
</html>
