<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Keel-to-PLM Operating Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an explorer. Home is the vessel grid (keel → workbench → components → PLM → operating model); every tile opens its own page with breadcrumbs, a back control and links onward. */
:root{
  --ground:#EEF2F5; --paper:#FFFFFF; --ink:#13202E; --muted:#566575; --rule:#D3DBE3;
  --keel:#1B3550; --keel-fg:#F1F4F8; --brass:#9A6B1F; --brass-soft:#F4EAD7;
  --wb:#5B4B8A; --wb-soft:#ECE8F6;
  --comp:#1D7466; --comp-soft:#DDF0EC; --risk:#B0432C; --risk-soft:#F7E2DC; --impact:#3953A0; --impact-soft:#E1E7F7;
  --dt:#F6F8FA; --rt:#F1F5F2;
  --f-display:"Spectral", "Iowan Old Style", Georgia, serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0D141B; --paper:#151F29; --ink:#E3E9EF; --muted:#93A2B2; --rule:#2A3847;
  --keel:#22415F; --keel-fg:#EAF0F6; --brass:#D6A757; --brass-soft:#3A2F1C;
  --wb:#B3A3E6; --wb-soft:#2A2440;
  --comp:#56C2B1; --comp-soft:#173B36; --risk:#E7826B; --risk-soft:#43231C; --impact:#93A9EE; --impact-soft:#1F2A4A;
  --dt:#18232E; --rt:#17241F; color-scheme:dark;}}
:root[data-theme="dark"]{
  --ground:#0D141B; --paper:#151F29; --ink:#E3E9EF; --muted:#93A2B2; --rule:#2A3847;
  --keel:#22415F; --keel-fg:#EAF0F6; --brass:#D6A757; --brass-soft:#3A2F1C;
  --wb:#B3A3E6; --wb-soft:#2A2440;
  --comp:#56C2B1; --comp-soft:#173B36; --risk:#E7826B; --risk-soft:#43231C; --impact:#93A9EE; --impact-soft:#1F2A4A;
  --dt:#18232E; --rt:#17241F; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600}
h1{font-size:clamp(26px,3.6vw,38px);line-height:1.12}
h2{font-size:22px;line-height:1.2}
h3{font-size:17px}
p{margin:0}
a{color:var(--impact)}
.lede{max-width:72ch;color:var(--muted);font-size:16px}
.note{font-size:12.5px;color:var(--muted)}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}

/* App bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--ground);border-bottom:1px solid var(--rule)}
.bar .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:10px}
.brand{font:600 16px var(--f-display);color:var(--ink);text-decoration:none;margin-right:6px}
.nav{display:flex;flex-wrap:wrap;gap:2px}
.nav a{font:500 13px var(--f-body);color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px}
.nav a:hover,.nav a:focus-visible{background:var(--paper);color:var(--ink);outline:none}
.nav a[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:inset 0 -2px 0 var(--brass)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:14px 0;font:500 12.5px var(--f-body);color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs .sep{opacity:.5}
.back{all:unset;cursor:pointer;font:500 12.5px var(--f-mono);border:1px solid var(--rule);border-radius:5px;padding:2px 8px;background:var(--paper);color:var(--ink);margin-right:6px}
.back:hover,.back:focus-visible{border-color:var(--brass)}
main{display:grid;gap:22px;padding-block:14px 0}
.phead{display:grid;gap:8px}
.kicker{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.section{display:grid;gap:12px}
.section>h2{font-size:19px}

/* Generic blocks */
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:16px;display:grid;gap:10px;min-width:0;align-content:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{display:grid;gap:4px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px;align-content:start;min-width:0}
.tile:hover,.tile:focus-visible{border-color:var(--brass);outline:none}
.tile b{font:600 14.5px var(--f-body)}
.tile span{font-size:12.5px;color:var(--muted)}
.tile .id{font:500 11px var(--f-mono);color:var(--muted)}
.tile .go{font:500 11px var(--f-mono);color:var(--brass);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11.5px var(--f-mono);text-decoration:none;color:var(--ink);background:var(--dt);border:1px solid var(--rule);border-radius:4px;padding:2px 7px}
a.chip:hover,a.chip:focus-visible{border-color:var(--brass);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{font:500 11px var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--dt);color:var(--muted)}
.extlink{font:500 13px var(--f-body);text-decoration:none;color:var(--wb);border:1px solid var(--wb);border-radius:6px;padding:5px 10px;background:var(--wb-soft);display:inline-block}
.pip{font:500 10.5px var(--f-mono);padding:1px 5px;border-radius:3px;border-left:3px solid;color:var(--ink);text-decoration:none}
.pip.C{border-color:var(--comp);background:var(--comp-soft)} .pip.R{border-color:var(--risk);background:var(--risk-soft)} .pip.I{border-color:var(--impact);background:var(--impact-soft)}
a.pip:hover{outline:1px solid var(--brass)}
ul.clean{margin:0;padding-left:18px;display:grid;gap:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;align-items:baseline}
.kv dt{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0}
h4{margin:0;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.dot.C{background:var(--comp)} .dot.R{background:var(--risk)} .dot.I{background:var(--impact)} .dot.W{background:var(--wb)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.howto div{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;font-size:13.5px;display:grid;gap:2px}
.howto b{font:600 11px var(--f-mono);color:var(--brass);letter-spacing:.06em}

/* Flow grid */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.flow{min-width:1060px;display:grid;grid-template-columns:170px repeat(5,minmax(0,1fr));gap:6px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px}
.phase{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:6px;border-radius:6px;color:var(--muted)}
.phase.dt{background:var(--dt)} .phase.rel{background:var(--brass-soft);color:var(--brass)} .phase.rt{background:var(--rt)}
.colh{font:600 13px var(--f-body);padding:4px 8px;color:var(--ink);border-bottom:2px solid var(--rule)}
.colh small{display:block;font:400 11px var(--f-mono);color:var(--muted)}
.keelband{grid-column:2 / -1;background:var(--keel);color:var(--keel-fg);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.keelband .kt{font:600 15px var(--f-display)}
.kchip{font:500 11.5px var(--f-mono);border:1px solid color-mix(in srgb,var(--keel-fg) 35%,transparent);border-radius:4px;padding:3px 7px;color:var(--keel-fg);text-decoration:none}
.kchip:hover,.kchip:focus-visible{background:color-mix(in srgb,var(--keel-fg) 14%,transparent);outline:none}
.grouph{grid-column:1 / -1;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 2px 0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.grouph span{font:400 12px var(--f-body);letter-spacing:0;text-transform:none}
.compile{grid-column:2 / -1;font:500 11px var(--f-mono);color:var(--brass);text-align:center;padding:2px}
.rowh{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px;border-left:3px solid var(--keel);background:var(--dt);border-radius:0 6px 6px 0;text-decoration:none;color:var(--ink)}
.rowh.wbh{border-left-color:var(--wb);background:var(--wb-soft)}
.rowh:hover,.rowh:focus-visible{outline:2px solid var(--brass);outline-offset:-1px}
.rowh b{font:600 14px var(--f-body)}
.rowh span{font-size:12px;color:var(--muted);line-height:1.35}
.cell{display:flex;flex-direction:column;gap:6px;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);min-width:0;text-decoration:none;color:var(--ink)}
.cell.dtc{background:var(--dt)} .cell.relc{background:color-mix(in srgb,var(--brass-soft) 45%,var(--paper))} .cell.rtc{background:var(--rt)}
.cell.wbc{background:color-mix(in srgb,var(--wb-soft) 55%,var(--paper))}
.cell:hover,.cell:focus-visible{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);outline:none}
.cell .ct{font:600 13px var(--f-body);line-height:1.3}
.cell .cs{font-size:12px;color:var(--muted);line-height:1.4}
.pips{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.plmband{grid-column:1 / -1;display:grid;grid-template-columns:170px repeat(5,minmax(0,1fr));gap:6px;margin-top:4px;padding-top:8px;border-top:2px dashed var(--rule)}
.plmh{background:var(--brass);color:var(--paper);border-radius:6px;padding:8px;display:flex;flex-direction:column;justify-content:center;text-decoration:none}
.plmh b{font:600 15px var(--f-display)} .plmh span{font-size:11.5px;opacity:.9;line-height:1.35}
.gate{border:1px solid var(--brass);border-radius:6px;padding:8px;display:grid;gap:3px;background:var(--paper);text-decoration:none;color:var(--ink)}
.gate:hover,.gate:focus-visible{box-shadow:inset 0 0 0 1px var(--brass);outline:none}
.gate .gid{font:600 11px var(--f-mono);color:var(--brass);letter-spacing:.06em}
.gate .gn{font:600 13px var(--f-body)}
.gates2{display:grid;gap:6px}
.bomband{grid-column:1 / -1;display:grid;grid-template-columns:170px 1fr;gap:6px;margin-top:2px}
.bomh{background:var(--impact);color:var(--paper);border-radius:6px;padding:8px;display:flex;flex-direction:column;justify-content:center;text-decoration:none}
.bomh b{font:600 15px var(--f-display)} .bomh span{font-size:11.5px;opacity:.92;line-height:1.35}
.bomstrip{display:flex;flex-wrap:wrap;gap:6px}
.bomstrip a{flex:1 1 150px;text-decoration:none;color:var(--ink);border:1px solid var(--impact);border-radius:6px;padding:8px;background:var(--impact-soft);display:grid;gap:2px}
.bomstrip a:hover,.bomstrip a:focus-visible{box-shadow:inset 0 0 0 1px var(--impact);outline:none}
.bomstrip a b{font:600 13px var(--f-body)} .bomstrip a span{font:400 11px var(--f-mono);color:var(--muted)}

/* Lifecycle strip on tool pages */
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;min-width:760px}
.stepnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between}
.stepnav a{font:500 13px var(--f-body);text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:6px 10px;background:var(--paper);color:var(--ink)}
.stepnav a:hover,.stepnav a:focus-visible{border-color:var(--brass);outline:none}

/* Tables */
.tbl{border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--dt)}
td.mono{font:500 12px var(--f-mono);white-space:nowrap}
td.na{color:var(--muted);opacity:.5}
td a{text-decoration:none}
td a:hover{text-decoration:underline}
.wide{min-width:820px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{font:500 12px var(--f-mono);color:var(--muted)}
select,input[type=search]{font:14px var(--f-body);padding:6px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);max-width:100%}
select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;font:500 12.5px var(--f-body);padding:5px 10px;background:var(--paper);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}

/* Impact */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;display:grid;gap:2px;background:var(--paper)}
.stat b{font:600 22px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font:400 11px var(--f-mono);color:var(--muted)}
.summary{border-left:4px solid var(--impact);background:var(--impact-soft);border-radius:0 8px 8px 0;padding:12px 14px;display:grid;gap:8px;font-size:14.5px}
.summary .sl{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--impact)}
.tree{display:grid;gap:12px}
.tdom{border-left:3px solid var(--impact);padding-left:10px;display:grid;gap:6px}
.tdom>a{font:600 14.5px var(--f-body);color:var(--ink);text-decoration:none}
.tsvc{display:grid;gap:4px;padding-left:4px}
.tsvc>a{font:600 13px var(--f-body);color:var(--muted);text-decoration:none}
.tdom>a:hover,.tsvc>a:hover,.tproc a:hover{text-decoration:underline}
.tproc{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:13.5px;padding-left:10px}
.tproc a{font-weight:500;color:var(--ink);text-decoration:none}
.prov{font:500 10.5px var(--f-mono);padding:1px 5px;border-radius:3px;background:var(--dt);color:var(--muted);border:1px solid var(--rule)}
.prov.d{color:var(--comp);border-color:var(--comp)}
.prov.p{color:var(--risk);border-color:var(--risk)}
.prov.c,.prov.e,.prov.r,.prov.u{color:var(--impact);border-color:var(--impact)}
.mlist{display:grid;gap:8px;font-size:13.5px}
.mlist>div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.gapbar{font:500 11px var(--f-mono);padding:1px 6px;border-radius:3px;white-space:nowrap}
.gapbar.bad{background:var(--risk-soft);color:var(--risk)} .gapbar.ok{background:var(--comp-soft);color:var(--comp)}
.proc{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding:6px 9px;border-radius:5px;border:1px solid var(--rule);font-size:13.5px;text-decoration:none;color:var(--ink);background:var(--paper)}
.proc:hover,.proc:focus-visible{border-color:var(--brass);outline:none}
.proc .pc{font:500 10.5px var(--f-mono);color:var(--muted);white-space:nowrap}

/* Causal chain */
.chain{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:1100px}
.node{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px;display:grid;gap:4px;position:relative;margin-right:22px;align-content:start}
.node.live{border-color:var(--impact)}
.node:not(:last-child)::after{content:"→";position:absolute;right:-19px;top:50%;transform:translateY(-50%);color:var(--brass);font:600 16px var(--f-mono)}
.node:last-child{margin-right:0}
.node .nt{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.node .nn{font:600 15px var(--f-display)}
.node .ne{font-size:12.5px;color:var(--muted)}
.node .ex{font:500 11.5px var(--f-mono);border-top:1px solid var(--rule);padding-top:6px;margin-top:4px}
.node.live .ex{color:var(--impact)}
.guard{background:var(--keel);color:var(--keel-fg);border-radius:10px;padding:18px;display:grid;gap:10px}
.guard ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.guard h3{color:var(--keel-fg)}
.sc{border-top:4px solid}
.sc.C{border-top-color:var(--comp)} .sc.R{border-top-color:var(--risk)} .sc.I{border-top-color:var(--impact)}
.sc .from{font:400 12px var(--f-mono);color:var(--muted)}
.empty{color:var(--muted);font-size:13.5px}
@media (max-width:640px){h2{font-size:20px}}
</style>

function trace(id){
 const paths=[];const add=(t,prov,via)=>paths.push({t,prov,via});
 const ruleT=(rid,prov,via)=>{const r=RULE[rid];if(!r)return;r.t.forEach(([t,p])=>add(t,(prov&&p!=="p")?prov:p,via||(p==="u"?"Sales Advisor answers":"register")))};
 const carriers=aid=>(USERS[aid]||[]).forEach(cid=>CNS[cid].home.forEach(t=>add(t,"c",cid)));
 if(RULE[id]){ruleT(id);carriers(id)}
 else if(CON[id]||CALC[id]){const a=CON[id]||CALC[id];a.refs.forEach(r=>ruleT(r,"r",r));carriers(id);if(CALC[id]&&CNS[a.owner])CNS[a.owner].home.forEach(t=>add(t,"c",a.owner))}
 else if(CNS[id]){const c=CNS[id];c.home.forEach(t=>add(t,"d","registry"));c.rules.forEach(r=>ruleT(r,"e",r))}
 return paths;
}
function resolve(t){if(PROC[t])return{dom:PROC[t].dom,svc:PROC[t].svc,proc:t};if(SVC[t])return{dom:SVC[t].dom,svc:t,proc:null};return null}
function aggregate(paths){
 const tree={};
 paths.forEach(p=>{const r=resolve(p.t);if(!r)return;const key=r.proc||r.svc;
  tree[r.dom]=tree[r.dom]||{};tree[r.dom][r.svc]=tree[r.dom][r.svc]||{};
  const n=tree[r.dom][r.svc][key]=tree[r.dom][r.svc][key]||{proc:r.proc,prov:new Set(),via:new Set()};
  n.prov.add(p.prov);if(p.via)n.via.add(p.via)});
 return tree;
}
function measuresFor(keys){const out=[];const seen=new Set();
 keys.forEach(k=>(BD.VGO[k]||[]).forEach(v=>{const key=k+v[0]+v[1];if(seen.has(key))return;seen.add(key);out.push({k,vg:v})}));

/* ---------- router ---------- */
const NAVOF={home:"home",cell:"home",row:"home",bom:"bom",dom:"bom",svc:"bom",proc:"bom",assets:"assets",asset:"assets",measures:"measures",measure:"measures",plm:"plm",gate:"plm",keel:"keel",causal:"causal"};
let CUR="",HIST=[];
function parse(h){const parts=(h||"").replace(/^#/,"").split("~").filter(Boolean);return parts.length?parts:["home"]}
function render(keep){
 const [pg,...args]=parse(CUR);const fn=P[pg]||P.notfound;let r;
 try{r=fn(...args)}catch(e){console.error(e);r=P.notfound()}
 if(typeof r==="string")r={crumbs:null,html:r};
 const app=document.getElementById("app");app.innerHTML=r.html;
 const cr=document.getElementById("crumbs");
 cr.innerHTML=(HIST.length?`<button class="back" id="backBtn">← Back</button>`:"")+(r.crumbs?[["Flow","#home"],...r.crumbs].filter((c,i,a)=>!(i>0&&c[1]==="#home")).map((c,i,a)=>i<a.length-1&&c[1]?`<a href="${c[1]}">${esc(c[0])}</a><span class="sep">/</span>`:`<span>${esc(c[0])}</span>`).join(""):"");
 document.getElementById("backBtn")?.addEventListener("click",()=>{const prev=HIST.pop();if(prev!=null){CUR=prev;setHash(prev);render()}});
 document.querySelectorAll("#nav a").forEach(a=>a.toggleAttribute("aria-current",a.dataset.n===NAVOF[pg]));
 document.querySelectorAll("#nav a[aria-current]").forEach(a=>a.setAttribute("aria-current","page"));
 if(r.after)r.after();
 if(!keep)window.scrollTo(0,0);
}
function setHash(h){try{if(location.hash!==h)history.replaceState(null,"",h)}catch(e){}}
function go(h){if(h===CUR)return;HIST.push(CUR);if(HIST.length>60)HIST.shift();CUR=h;setHash(h);render()}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(!a||e.metaKey||e.ctrlKey)return;e.preventDefault();go(a.getAttribute("href"))});
window.addEventListener("hashchange",()=>{const h=location.hash||"#home";if(h!==CUR){HIST.push(CUR);CUR=h;render()}});
CUR=location.hash&&location.hash.length>1?location.hash:"#home";
render();
</script>
