<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Halyard Living Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — instrument rail at left, working surface at right; the handbook is assembled, never stored as a document. */
:root{
  --paper:#EEF2F1; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#14243A; --ink-2:#4B5B6C; --ink-3:#73828F;
  --rule:#D3DCDD; --accent:#0E6B68; --accent-soft:#D7ECEA; --accent-ink:#FFFFFF;
  --planet:#3C7A4A; --people:#B04A5A; --profit:#3B5B92;
  --ok:#2E7B4E; --warn:#A86B12; --crit:#C2361F; --ok-soft:#DDEFE3; --warn-soft:#F6E8CF; --crit-soft:#F8DDD7;
  --legal:#F2F0E8; --shadow:0 8px 28px rgba(20,36,58,.14);
  --dom-1:#1F7A73; --dom-2:#3E63A8; --dom-3:#B5651D; --dom-4:#7A4FA0; --dom-5:#9A7A1F; --dom-6:#4E6878; --dom-7:#5E8A2E; --dom-8:#B0465F;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E161E; --surface:#15202B; --surface-2:#1A2733; --ink:#E3EAF0; --ink-2:#A2B2C0; --ink-3:#7D8E9D;
  --rule:#273643; --accent:#4DB6AE; --accent-soft:#163B3B; --accent-ink:#0B1A1A;
  --planet:#71B47F; --people:#E07C8A; --profit:#8DA9DE;
  --ok:#5BBF84; --warn:#E0A84A; --crit:#F07760; --ok-soft:#173326; --warn-soft:#3A2D14; --crit-soft:#3E1C17;
  --legal:#1C2530; --shadow:0 10px 30px rgba(0,0,0,.45); --dom-1:#4FB8AE; --dom-2:#7FA2E4; --dom-3:#E3995A; --dom-4:#B08AD6; --dom-5:#D9B85A; --dom-6:#8FA8B8; --dom-7:#93C062; --dom-8:#E07C95; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E161E; --surface:#15202B; --surface-2:#1A2733; --ink:#E3EAF0; --ink-2:#A2B2C0; --ink-3:#7D8E9D;
  --rule:#273643; --accent:#4DB6AE; --accent-soft:#163B3B; --accent-ink:#0B1A1A;
  --planet:#71B47F; --people:#E07C8A; --profit:#8DA9DE;
  --ok:#5BBF84; --warn:#E0A84A; --crit:#F07760; --ok-soft:#173326; --warn-soft:#3A2D14; --crit-soft:#3E1C17;
  --legal:#1C2530; --shadow:0 10px 30px rgba(0,0,0,.45); --dom-1:#4FB8AE; --dom-2:#7FA2E4; --dom-3:#E3995A; --dom-4:#B08AD6; --dom-5:#D9B85A; --dom-6:#8FA8B8; --dom-7:#93C062; --dom-8:#E07C95; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:.82em}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:20px;padding:22px 16px;border-right:1px solid var(--rule);background:var(--surface)}
.brand{display:flex;gap:10px;align-items:center}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:750;letter-spacing:-.02em;display:block;line-height:1.05}
.brand span{font-size:12px;color:var(--ink-3)}
.theme-btn{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid var(--rule);background:var(--ink);color:var(--paper);border-radius:50%;padding:0;cursor:pointer;flex:none}
.theme-btn svg{width:18px;height:18px}
.theme-btn:hover{filter:brightness(1.15)}
.theme-btn[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .k{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--ink-3);display:grid;gap:8px}
.rail-foot .stack{display:grid;gap:3px}
.main{min-width:0;padding-inline:clamp(16px,3vw,40px);padding-block:26px 64px}
.view-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px}
.view-head h1{font-size:clamp(26px,3.2vw,36px);font-weight:750}
.view-head p{margin:6px 0 0;max-width:62ch;color:var(--ink-2)}

/* controls */
.ctrl-row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.field{display:grid;gap:4px;min-width:0}
.field label,.field .lbl{font-size:12px;font-weight:600;color:var(--ink-2)}
select,input[type=text],input[type=search],textarea{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-width:0}
textarea{resize:vertical;width:100%;line-height:1.5}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-planet{background:var(--planet)} .d-people{background:var(--people)} .d-profit{background:var(--profit)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;font-weight:500;padding:2px 7px;border-radius:4px;letter-spacing:.03em}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r)}

/* experience */
.profile-bar{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:end;padding:14px 16px;margin-bottom:20px}
.profile-bar .sep{width:1px;align-self:stretch;background:var(--rule)}
.compass-row{display:flex;gap:6px;flex-wrap:wrap}
.exp{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:12px;font-size:13.5px;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
.toc a{color:var(--ink-2);text-decoration:none;display:block;padding:2px 0}
.toc a:hover{color:var(--ink)}
.toc .p{font-weight:600;color:var(--ink)}
.toc .s{padding-left:12px;border-left:1px solid var(--rule)}
.reader{max-width:760px;min-width:0}
.hb-meta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;color:var(--ink-2);margin-bottom:26px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.part{margin-bottom:38px;scroll-margin-top:20px}
.part>h2{font-size:26px;font-weight:750;display:flex;gap:12px;align-items:baseline;margin-bottom:6px}
.part>h2 .num{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:500}
.sec{margin-top:22px;scroll-margin-top:20px}
.sec>h3{font-size:14px;font-family:var(--f-mono);font-weight:500;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:10px}
.comp{padding:18px 0 18px;border-top:1px solid var(--rule);transition:opacity .2s}
.comp:first-of-type{border-top:0}
.comp.dim{opacity:.32}
.comp-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.comp h4{font-size:19px;font-weight:650;margin-bottom:8px}
.comp p{margin:0 0 10px;max-width:68ch}
.comp ul{margin:0 0 10px;padding-left:20px;max-width:66ch}
.comp li{margin-bottom:4px}
.comp .callout{border-left:3px solid var(--accent);padding:8px 12px;background:var(--accent-soft);border-radius:0 6px 6px 0;margin:10px 0;max-width:66ch}
.comp.legal .body{background:var(--legal);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.comp.legal .body p:last-child{margin-bottom:0}
.cite{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-top:8px}
.comp-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12.5px;color:var(--ink-3);margin-top:8px}
.comp-foot .why{display:inline-flex;gap:6px;align-items:center}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:500;font-size:12.5px}
.linkbtn:hover{text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--accent)}
.term{all:unset;cursor:help;border-bottom:1.5px dotted var(--accent);color:inherit;font-weight:500}
.term:hover{background:var(--accent-soft)}
.term:focus-visible{outline:2px solid var(--accent)}
.newtag{background:var(--accent);color:var(--accent-ink)}
.diagram{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:10px}
.diagram svg{display:block;min-width:560px;width:100%;height:auto}
svg .n{fill:var(--surface-2);stroke:var(--rule)}
svg .n-acc{fill:var(--accent-soft);stroke:var(--accent)}
svg .t{fill:var(--ink);font-family:var(--f-body);font-size:13px}
svg .t-b{fill:var(--ink);font-family:var(--f-display);font-size:15px;font-weight:650}
svg .t-s{fill:var(--ink-2);font-family:var(--f-body);font-size:11.5px}
svg .t-m{fill:var(--ink-3);font-family:var(--f-mono);font-size:10.5px}
svg .ln{stroke:var(--ink-3);fill:none;stroke-width:1.4}
svg .ln-acc{stroke:var(--accent);fill:none;stroke-width:1.6}
svg .ah{fill:var(--ink-3)}
svg .sb-water{fill:var(--accent-soft);opacity:.7} svg .sb-sail{fill:var(--surface-2);stroke:var(--ink-3);stroke-width:1.4} svg .sb-spar{stroke:var(--ink);fill:none;stroke-linecap:round} svg .sb-hull{fill:var(--ink)} svg .sb-halyard{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round} svg .sb-sheave{fill:var(--surface);stroke:var(--accent);stroke-width:2} svg .sb-winch{fill:var(--accent);stroke:var(--surface);stroke-width:2} svg .sb-dot{fill:var(--accent)} svg .sb-acc{fill:var(--accent)}
svg .band{fill:var(--ok-soft)} svg .band-t{fill:var(--ok);font-family:var(--f-mono);font-size:11px}
.ack{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}

/* popover & drawer */
.pop{position:fixed;z-index:40;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;font-size:14px}
.pop h5{font-family:var(--f-display);font-size:16px;margin:2px 0 6px}
.pop p{margin:0 0 8px}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 0;font-size:12px}
.pop dt{color:var(--ink-3)} .pop dd{margin:0;font-family:var(--f-mono);font-size:11.5px;overflow-wrap:anywhere}
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--surface);z-index:35;border-left:1px solid var(--rule);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--rule)}
.drawer-body{overflow:auto;padding:16px 20px 28px;display:grid;gap:18px;align-content:start}
.drawer h2{font-size:21px}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3);font-size:12.5px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--f-mono);font-size:12px}
.path span{background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;padding:2px 6px}
pre.code{font-family:var(--f-mono);font-size:12px;line-height:1.55;background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;overflow-x:auto;margin:0;white-space:pre}
.req{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--surface-2);font-size:14px}
.req .rid{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:500}

/* ombudsman */
.omb{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.chat{display:flex;flex-direction:column;min-height:540px}
.msgs{display:flex;flex-direction:column;gap:16px;padding:18px;flex:1}
.msg-u{align-self:flex-end;max-width:80%;background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:14px 14px 4px 14px}
.msg-a{display:grid;gap:10px;max-width:96%}
.msg-a .who{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.src-list{display:grid;gap:8px}
.src{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--surface-2)}
.src .id{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);padding-top:2px}
.src b{display:block;font-weight:600;font-size:14px}
.src span{font-size:13.5px;color:var(--ink-2)}
.ai-ans{border-left:3px solid var(--accent);padding:4px 0 4px 14px;white-space:pre-wrap}
.ai-ans .think{color:var(--ink-3);font-style:italic}
.escalate{border:1px solid var(--crit);background:var(--crit-soft);border-radius:6px;padding:10px 12px;font-size:14px}
.composer{border-top:1px solid var(--rule);padding:12px;display:grid;gap:10px}
.composer form{display:flex;gap:8px}
.composer input{flex:1}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.notes{display:grid;gap:10px}
.note{padding:12px 14px;display:grid;gap:4px}
.note .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.note b{font-size:14px}
.note p{margin:0;font-size:13.5px;color:var(--ink-2)}

/* studio */
.studio{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.studio .panel{padding:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ears{font-size:15px;padding:12px 14px;background:var(--surface-2);border:1px dashed var(--rule);border-radius:6px}
.ears em{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.preview{border:1px solid var(--rule);border-radius:6px;padding:12px 14px;background:var(--surface-2);line-height:1.75;min-height:80px;white-space:pre-wrap}
mark{background:none;color:inherit;padding:0 1px;border-radius:2px}
mark.m-term{border-bottom:2px solid var(--accent)}
mark.m-weak{background:var(--warn-soft);text-decoration:underline wavy var(--warn);text-underline-offset:3px}
mark.m-viol{background:var(--crit-soft);border-bottom:2px solid var(--crit)}
mark.m-undef{background:var(--crit-soft);outline:1px dashed var(--crit)}
mark.m-cite{border-bottom:2px solid var(--ok)}
mark.m-badcite{background:var(--crit-soft);border-bottom:2px dashed var(--crit)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}
.breaker{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center}
.breaker h3{font-size:24px;font-weight:750}
.state-closed{color:var(--ok)} .state-half{color:var(--warn)} .state-open{color:var(--crit)}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.meter{border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.meter b{font-family:var(--f-display);font-size:22px;display:block;font-variant-numeric:tabular-nums}
.meter span{font-size:11.5px;color:var(--ink-3)}
.findings{display:grid;gap:8px;max-height:460px;overflow:auto}
.finding{border:1px solid var(--rule);border-radius:6px;padding:9px 11px;display:grid;gap:3px;font-size:13.5px}
.finding .hd{display:flex;justify-content:space-between;gap:8px;align-items:center}
.finding q{font-family:var(--f-mono);font-size:12px;quotes:none;color:var(--ink)}
.finding .fix{color:var(--ink-2);font-size:13px}
.sev{display:inline-flex;gap:2px}
.sev i{width:6px;height:10px;border-radius:1px;background:var(--rule)}
.sev i.on{background:currentColor}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.toggles label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;background:var(--surface)}
.stack-g{display:grid;gap:14px}

/* assembly */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.stat{padding:14px 16px}
.stat b{font-family:var(--f-display);font-size:30px;font-weight:750;display:block;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-2)}
.asm{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:middle}
th{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td.c{text-align:center}
tr.row-click{cursor:pointer}
tr.row-click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}
.cell{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid var(--rule)}
.cell.on{background:var(--accent);border-color:var(--accent)}
.cell.held{background:var(--crit-soft);border-color:var(--crit)}
.prose{max-width:68ch;color:var(--ink-2);font-size:14.5px}
.prose p{margin:0 0 10px}

/* vocabulary */
.vocab-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.vocab-tools input{flex:1;min-width:200px}
.vterm td:first-child{font-weight:600}
.vterm .def{color:var(--ink-2);max-width:52ch}
.uses{display:flex;flex-wrap:wrap;gap:4px}
.uses button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--rule);border-radius:4px;padding:1px 5px}

/* organization navigator */
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.org{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
.org-nav{padding:10px;max-height:calc(100vh - 210px);overflow:auto;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.org-nav input{width:100%;margin-bottom:8px}
.tn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:8px;align-items:center;width:100%;padding:6px 8px;border-radius:5px;font-size:13.5px;line-height:1.3}
.tn:hover{background:var(--surface-2)}
.tn[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.tn:focus-visible{outline:2px solid var(--accent)}
.tn .ct{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.tn .car{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);width:10px;flex:none}
.tn.l1{font-weight:600}.tn.l2{padding-left:24px}.tn.l3{padding-left:42px;color:var(--ink-2)}
.tn .sub{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400}
.grp{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:12px 8px 4px}
.org-detail{padding:20px 22px;display:grid;gap:20px;min-width:0}
.org-detail h2{font-size:26px;font-weight:750}
.org-detail h4{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.crumbs button{all:unset;cursor:pointer;color:var(--ink-2)} .crumbs button:hover{color:var(--ink);text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.static{cursor:default}
.dbar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.rowlist{display:grid;gap:8px}
.rowitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--surface-2)}
.rowitem b{font-weight:600;font-size:14px}
.rowitem .s{font-size:13px;color:var(--ink-2);grid-column:1/-1}
.flags{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.gap{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:6px;padding:10px 12px;font-size:13.5px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tier{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;display:grid;gap:6px;align-content:start}
.tier b{font-family:var(--f-display);font-size:16px;display:flex;gap:8px;align-items:center}
.tier span{font-size:12.5px;color:var(--ink-2)}
.svc-chip{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:1px 8px;background:var(--surface)}
.svc-chip:hover{border-color:var(--ink-3);color:var(--ink)}
.svc-chip:focus-visible{outline:2px solid var(--accent)}
.principles{display:grid;gap:14px;margin-top:6px}
.ptier{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start;border-top:1px solid var(--rule);padding-top:12px}
.ptier>div:first-child b{font-family:var(--f-display);font-size:17px;display:flex;gap:8px;align-items:center}
.ptier>div:first-child span{font-size:12px;color:var(--ink-3)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pcard{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;display:grid;gap:4px;background:var(--surface)}
.pcard b{font-size:14.5px}
.pcard p{margin:0;font-size:13px;color:var(--ink-2)}
.pcard .m{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;z-index:50;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.ai-only[hidden]{display:none!important}
.note-ai{font-size:12.5px;color:var(--ink-3)}

@media (max-width:1100px){
  .omb,.studio,.asm,.org{grid-template-columns:minmax(0,1fr)}

}
@media (max-width:900px){

  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--rule);overflow-x:auto}
  .brand span,.rail-foot{display:none}
  .nav{flex-direction:row}
  .nav .k{display:none}
  .nav button{white-space:nowrap;padding:7px 10px}
  .exp{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
  .grid2{grid-template-columns:minmax(0,1fr)}

@media (max-width:520px){
  .profile-bar .sep{display:none}
  .meters{grid-template-columns:repeat(3,minmax(0,1fr))}
  .breaker{grid-template-columns:72px minmax(0,1fr)}
  .msg-u{max-width:92%}

/* ---------- rail search ---------- */
.rail-search{display:flex}
.rail-search input{width:100%;font-size:13px;padding:7px 9px}
/* ---------- overview ---------- */
.ov-hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;margin-bottom:30px}
.ov-hero h1{font-size:clamp(30px,4vw,46px);font-weight:750;letter-spacing:-.02em}

.ov-sec{margin-top:40px}
.ov-sec>h2{font-size:24px;font-weight:750;margin-bottom:6px}
.ov-sec>p.lede{color:var(--ink-2);max-width:68ch;margin:0 0 16px}
.vessel{display:grid;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--rule)}
.vl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;padding:12px 16px;align-items:start;border-top:1px solid var(--rule)}
.vl:first-child{border-top:0}
.vl .lab b{font-family:var(--f-display);font-size:16px;display:block}
.vl .lab span{font-size:12px;color:var(--ink-3);display:block}
.vl .items{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.vl.bearing{background:var(--surface)} .vl.sup{background:var(--surface)} .vl.bridge{background:var(--surface-2)}
.vl.water{background:repeating-linear-gradient(170deg,var(--accent-soft) 0 6px,var(--surface) 6px 14px)}
.vl.sea{background:var(--accent-soft)} .vl.hull{background:var(--surface-2)}
.vl.keel{background:var(--ink);color:var(--paper)} .vl.keel .lab span{color:var(--paper);opacity:.75}
.vl.ballast{background:var(--surface)}
.vc{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px;border-radius:6px;border:1px solid var(--rule);background:var(--surface);color:var(--ink)}
.vc:hover{border-color:var(--ink-3)} .vc:focus-visible{outline:2px solid var(--accent)}
.vl.keel .vc{background:transparent;color:var(--paper);border-color:rgba(255,255,255,.3)}
.vc[aria-current="true"]{outline:2px solid var(--accent);outline-offset:1px}
.vc .stp{font-family:var(--f-mono);font-size:10.5px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 4px}
.vc.dimmed{opacity:.35}
.vc .st{width:7px;height:7px;border-radius:50%;flex:none}
.st-built{background:var(--ok)} .st-sample{background:var(--warn)} .st-next{background:transparent;border:1.5px solid var(--ink-3)}
.vdetail{padding:16px 18px;margin-top:12px;display:grid;gap:6px}
.flowsteps{display:grid;gap:6px;counter-reset:fs;margin:12px 0 0;padding:0;list-style:none}
.flowsteps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:14px}
.flowsteps li::before{counter-increment:fs;content:counter(fs);font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;width:22px;height:22px;display:grid;place-items:center}
.flowsteps b{font-weight:600}
.flowsteps span{color:var(--ink-2)}
.svcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.svccard{padding:16px;display:grid;gap:8px;align-content:start}
.svccard h3{font-size:17px;font-weight:650}
.svccard p{margin:0;font-size:13.5px;color:var(--ink-2)}
.svccard dl{display:grid;grid-template-columns:78px minmax(0,1fr);gap:4px 10px;margin:0;font-size:12.5px}
.svccard dt{color:var(--ink-3)} .svccard dd{margin:0;min-width:0}
.steps7{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.step7{border:1px solid var(--rule);border-radius:8px;padding:12px;background:var(--surface);display:grid;gap:4px}
.step7 .n{font-family:var(--f-mono);font-size:11px;color:var(--accent)}
.step7 b{font-size:14.5px}
.step7 span{font-size:13px;color:var(--ink-2)}
.step7 .m{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
/* ---------- compliance ---------- */
.cmp-tbl td{vertical-align:top}
.mod{font-family:var(--f-mono);font-size:10.5px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.mod.Obligation{background:var(--accent-soft);color:var(--accent)} .mod.Prohibition{background:var(--crit-soft);color:var(--crit)}
.lvl{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
.lvl-Federal{background:var(--dom-2)} .lvl-State{background:var(--dom-1)} .lvl-County,.lvl-Municipal{background:var(--dom-3)}
.lawbtn{all:unset;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;margin:0 6px 2px 0;color:var(--ink)}
.lawbtn:hover{text-decoration:underline} .lawbtn:focus-visible{outline:2px solid var(--accent)}
.party{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--rule);white-space:nowrap}
.party.PEO{background:var(--accent-soft)} .party.Client{background:var(--surface-2)} .party.Shared{background:var(--warn-soft)}
.laws-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lawcol h4{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.lawitem{border:1px solid var(--rule);border-radius:6px;padding:9px 11px;margin-bottom:8px;background:var(--surface);display:grid;gap:3px;font-size:13px}
.lawitem button{all:unset;cursor:pointer;font-weight:600;font-size:13.5px}

.gates{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gate{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;display:grid;gap:4px;font-size:13px;background:var(--surface)}

.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}

.ns-box{display:flex;gap:8px;margin-bottom:14px}

.rung b{font-size:13.5px}
.rung span{font-size:11.5px;color:var(--ink-3)}
.rung .n{font-family:var(--f-mono);font-size:10.5px;color:var(--accent)}
.rung[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

.ns{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start}

.hit b{font-size:15px;font-weight:600}
.hit p{margin:0;font-size:13.5px;color:var(--ink-2)}
.hit .why{font-size:12px;color:var(--ink-3);font-family:var(--f-mono)}

.gk-c{fill:var(--accent);background:var(--accent)} .gk-t{fill:var(--dom-8);background:var(--dom-8)} .gk-s{fill:var(--dom-2);background:var(--dom-2)} .gk-r{fill:var(--crit);background:var(--crit)}

  while((m=ACR2.exec(text))){const a=m[1],s=m.index,e=s+a.length; if(ACR_MAP[a]||ACR_OK.has(a))continue; if(citeSpans.some(([x,y])=>s>=x&&e<=y))continue; add(s,e,"undef",{rule:"CB-T1",cat:"Undefined term",sev:2,msg:"Acronym “"+a+"” is not in the managed vocabulary.",fix:"Use the vocabulary term, or propose a new term to the steward."});}

/* render text with semantic marks (for preview) */
function markText(text,ranges){
  const pri={viol:5,badcite:4,undef:3,weak:2,cite:1,term:0};
  const sorted=[...ranges].sort((a,b)=>pri[b.kind]-pri[a.kind]||a.s-b.s);
  const taken=[]; const chosen=[];
  for(const r of sorted){ if(taken.some(([a,b])=>r.s<b&&r.e>a))continue; taken.push([r.s,r.e]); chosen.push(r);}
  chosen.sort((a,b)=>a.s-b.s);
  let out="",i=0;
  for(const r of chosen){ out+=esc(text.slice(i,r.s)); const title=r.kind==="term"?(TERM[r.id]?.label||""):""; out+=`<mark class="m-${r.kind}"${title?` title="${esc(title)}"`:""}>${esc(text.slice(r.s,r.e))}</mark>`; i=r.e; }
  return out+esc(text.slice(i));
}

const SENSITIVE=/harass|uncomfortable|discriminat|retaliat|threat|unsafe|hurt|injur|bully|assault|abuse|stalk/i;
const STOP=new Set("a an the i me my do does did can could how what when where why who is are am to of for in on at and or with about get got this that it be have has will would should was were your you our".split(" "));
function search(q,pr){
  const ql=q.toLowerCase(); const qTerms=new Set();
  let m; LABEL_RE.lastIndex=0; while((m=LABEL_RE.exec(q)))qTerms.add(LABEL_MAP[m[0].toLowerCase()]);
  ACR_RE.lastIndex=0; while((m=ACR_RE.exec(q.toUpperCase())))qTerms.add(ACR_MAP[m[0]]);
  const toks=ql.split(/[^a-z0-9-]+/).filter(t=>t.length>2&&!STOP.has(t));
  const scored=Object.values(C).filter(c=>applies(c,pr)).map(c=>{
    const ts=new Set(termsIn(c)); let s=0; qTerms.forEach(t=>{if(ts.has(t))s+=5}); const title=c.title.toLowerCase(), txt=(c.summary+" "+plainText(c)).toLowerCase();
    toks.forEach(t=>{if(title.includes(t))s+=3; else if(txt.includes(t))s+=1;}); if(c.type==="diagram")s*=.6; return {c,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3);
  return {hits:scored.map(x=>x.c),terms:[...qTerms].filter(Boolean)};
}
function searchServices(q,hitIds){
  const toks=q.toLowerCase().split(/[^a-z0-9-]+/).filter(t=>t.length>2&&!STOP.has(t)); if(!toks.length)return [];
  const boost=new Set(hitIds.flatMap(id=>C[id].services));
  return SVCS.map(id=>{const sv=BM.node[id]; const lab=sv.label.toLowerCase(); const rest=[...(sv.children||[]).map(p=>p.label),...(sv.concepts||[]).map(x=>x.label)].join(" ").toLowerCase();
    let sc=0; toks.forEach(t=>{if(lab.includes(t))sc+=3; else if(rest.includes(t))sc+=1;}); if(boost.has(id))sc+=3; return {id,sc};}).filter(x=>x.sc>=3).sort((a,b)=>b.sc-a.sc).slice(0,2).map(x=>x.id);
}
function answerFor(q){

  const hist=[]; S.chat.slice(0,-1).filter(x=>x.ai).slice(-2).forEach(x=>{hist.push({role:"user",content:x.q});hist.push({role:"assistant",content:x.ai});});
  const svcTxt=(m.svcs||[]).map(id=>`${short(BM.node[id].label)} (${short(BM.node[domainOf(id)].label)}; teams: ${(BM.ops[id]||[]).map(o=>OPAREA[o]?.label).filter(Boolean).join(", ")})`).join("\n")||"(none)";

  try{

hal:Part      hal:hasSection  hal:Section .

const ACCESS_LBL={all:"All employees",mgr:"Managers",hr:"HR and Privacy Office"};
const NODE_KIND={c:"Handbook passage",t:"Term",s:"Service",r:"Requirement",l:"Law",tp:"Compliance topic",a:"Digital asset",p:"Principle"};
function buildKG(){
  const N=new Map(), E=[]; const add=(k,label,extra)=>{if(!N.has(k))N.set(k,Object.assign({k,type:k.split(":")[0],label},extra||{}));return N.get(k)};
  const link=(a,b)=>{if(N.has(a)&&N.has(b)&&a!==b)E.push([a,b])};
  TERMS.forEach(t=>add("t:"+t.id,t.label,{text:t.def}));
  PESD.topics.forEach(t=>add("tp:"+t.id,t.label,{text:t.def||""}));
  PESD.reqs.forEach(r=>add("r:"+r.id,r.label,{text:r.note||""}));
  PESD.laws.forEach(l=>add("l:"+l.id,l.short||l.label,{text:(l.label+". "+(l.desc||"")+" "+(l.cite||""))}));
  SVCS.forEach(id=>add("s:"+id,short(BM.node[id].label),{text:[BM.node[id].comment||"",...(BM.node[id].children||[]).map(p=>p.label),...(BM.node[id].concepts||[]).map(x=>x.label)].join(". ")}));
  MODEL.principles.forEach(p=>add("p:"+p.id,p.label,{text:p.comment}));
  Object.values(C).filter(c=>c.status==="published").forEach(c=>add("c:"+c.id,c.title,{text:c.summary+" "+plainText(c)}));
  ASSETS.forEach(a=>add("a:"+a.id,a.title,{text:a.desc+" "+a.type+" "+a.sys}));
  Object.values(C).filter(c=>c.status==="published").forEach(c=>{termsIn(c).forEach(t=>link("c:"+c.id,"t:"+t)); c.services.forEach(s=>link("c:"+c.id,"s:"+s)); c.reqs.forEach(r=>link("c:"+c.id,"r:"+r));});
  Object.entries(TERM_TOPIC).forEach(([t,tps])=>tps.forEach(tp=>link("t:"+t,"tp:"+tp)));
  PESD.reqs.forEach(r=>{r.laws.forEach(l=>link("r:"+r.id,"l:"+l)); r.topics.forEach(tp=>link("r:"+r.id,"tp:"+tp));});
  PESD.laws.forEach(l=>l.topics.forEach(tp=>link("l:"+l.id,"tp:"+tp)));
  PESD.topics.forEach(t=>{if(t.broader)link("tp:"+t.id,"tp:"+t.broader)});
  Object.entries(BM.values).forEach(([s,vs])=>vs.forEach(v=>link("s:"+s,"p:"+v)));
  ASSETS.forEach(a=>a.tags.forEach(tg=>link("a:"+a.id,tg)));
  const adj=new Map(); N.forEach((_,k)=>adj.set(k,new Set())); E.forEach(([a,b])=>{adj.get(a).add(b);adj.get(b).add(a)});
  return {N,E,adj};
}
/* Concept resolution: words -> governed concepts (vocabulary, compliance topics) */
function resolveConcepts(q){
  const out=new Map(); let m;
  LABEL_RE.lastIndex=0; while((m=LABEL_RE.exec(q))){const id=LABEL_MAP[m[0].toLowerCase()]; out.set("t:"+id,m[0]);}
  ACR_RE.lastIndex=0; const up=q.replace(/\b[a-z]{2,6}\b/g,w=>ACR_MAP[w.toUpperCase()]?w.toUpperCase():w); while((m=ACR_RE.exec(up))){out.set("t:"+ACR_MAP[m[0]],m[0]);}
  const ql=q.toLowerCase();
  PESD.topics.forEach(t=>[t.label,...t.alt].forEach(l=>{const w=l.toLowerCase(); if(w.length>3&&ql.includes(w))out.set("tp:"+t.id,l);}));
  return out;
}

const RUNGS=[
 {n:1,t:"Find words",d:"Keyword index",k:"Search index"},
 {n:2,t:"Understand meaning",d:"Words resolve to concepts",k:"SKOS vocabulary + topic taxonomy"},
 {n:3,t:"Follow connections",d:"Concept to service, law, asset",k:"Ontologies as one graph"},

 {n:5,t:"Respect role and policy",d:"Only what applies to you",k:"Policy enforcement points"}];
const KIND_ORDER=["c","a","s","r","l","t","tp","p","i"];
const KIND_LBL={c:"Handbook",a:"Digital assets",s:"Services",r:"Requirements",l:"Laws",t:"Terms",tp:"Topics",p:"Principles",i:"Standards"};
function nsSearch(q,level){
  const kg=buildKG(); const pr=S.profile; const toks=q.toLowerCase().split(/[^a-z0-9()-]+/).filter(t=>t.length>1&&!STOP.has(t));
  const docs=[...kg.N.values()].concat(PESD.iso.map(s=>({k:"i:"+s.id,type:"i",label:s.n+" "+s.label.replace(/^[^—]*— /,""),text:(s.desc||"")+" "+(s.rel||"")})));
  const sc=new Map(), why=new Map(); const bump=(k,v,w)=>{sc.set(k,(sc.get(k)||0)+v); if(w&&!why.has(k))why.set(k,w);};
  docs.forEach(d=>{const ti=d.label.toLowerCase(), tx=(d.text||"").toLowerCase(); let s=0; toks.forEach(t=>{if(ti.includes(t))s+=3; else if(tx.includes(t))s+=1;}); if(s)bump(d.k,s,"Matched words: "+toks.filter(t=>ti.includes(t)||tx.includes(t)).join(", "));});
  let concepts=new Map();
  if(level>=2){ concepts=resolveConcepts(q);
    concepts.forEach((word,ck)=>{ bump(ck,8,`“${word}” is the concept ${kg.N.get(ck)?.label}`); (kg.adj.get(ck)||[]).forEach(n=>bump(n,5,`“${word}” → ${kg.N.get(ck)?.label} → tagged here`)); }); }
  if(level>=3){ const seeds=[...sc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]).filter(k=>kg.adj.has(k));
    seeds.forEach(sk=>(kg.adj.get(sk)||[]).forEach(n=>{ if(!sc.has(n)||sc.get(n)<2)bump(n,2,`Connected: ${kg.N.get(sk)?.label} → ${NODE_KIND[n.split(":")[0]].toLowerCase()}`); })); }
  let hidden=0; const chain=new Set(jurChain(pr));
  let res=[...sc.entries()].filter(([k,v])=>v>0).map(([k,v])=>{const d=kg.N.get(k)||docs.find(x=>x.k===k); return {k,v,d,why:why.get(k)}}).filter(x=>x.d);
  if(level>=5){ res=res.filter(x=>{const [ty,id]=[x.k.split(":")[0],x.k.slice(x.k.indexOf(":")+1)];
    if(ty==="c"&&!applies(C[id],pr)){hidden++;return false}
    if(ty==="l"&&!LAW[id].juris.some(j=>chain.has(j))){hidden++;return false}
    if(ty==="a"){const a=ASSETS.find(z=>z.id===id); if(a.access==="hr"||(a.access==="mgr"&&pr.role!=="mgr")){hidden++;return false}}
    return true;}); }
  res.sort((a,b)=>b.v-a.v);
  return {res:res.slice(0,60),concepts,hidden,kg};
}

  try{const {text}=await SAMPLE(`You are Compass, the enterprise search assistant for Halyard Employer Services (a PEO). Answer the question in under 90 words using ONLY the sources below, citing them by bracketed ID such as [C-021] or [A-08]. If the sources do not answer it, say so. Employee profile: ${ROLES[S.profile.role]}, ${STATES[S.profile.state]}. No legal advice.\nSources:\n${ctx}\nQuestion: ${q}`,{modelTier:"quick",onText:({text})=>{S.nsAnswer={q:key,text};const el=$("#ns-answer");if(el)el.textContent=text;}});

function graphData(){
  const kg=buildKG(); const seeds=[...graphSeeds()].filter(k=>kg.N.has(k)); const keep=new Set(seeds); let frontier=seeds;
  for(let i=0;i<G.depth;i++){const nx=[]; frontier.forEach(k=>(kg.adj.get(k)||[]).forEach(n=>{if(!keep.has(n)&&G.types.has(n.split(":")[0])){keep.add(n);nx.push(n)}})); frontier=nx;}
  let nodes=[...keep].filter(k=>G.types.has(k.split(":")[0])||seeds.includes(k));
  if(nodes.length>140){const pri=k=>seeds.includes(k)?0:(kg.adj.get(k)||new Set()).size; nodes=nodes.sort((a,b)=>pri(b)-pri(a)).slice(0,140); seeds.forEach(s=>{if(!nodes.includes(s))nodes.push(s)});}
  const ns=new Set(nodes); const links=kg.E.filter(([a,b])=>ns.has(a)&&ns.has(b)).map(([a,b])=>({source:a,target:b}));
  return {nodes:nodes.map(k=>({id:k,type:k.split(":")[0],label:kg.N.get(k).label,deg:(kg.adj.get(k)||new Set()).size,seed:seeds.includes(k)})),links,kg,seeds};
}

function drawGraph(data){
  const host=$("#gcanvas"); const W=host.clientWidth||800, H=host.clientHeight||600; const d3=window.d3;
  const svg=d3.select(host).insert("svg",":first-child").attr("viewBox",[0,0,W,H]).attr("role","img").attr("aria-label","Content graph");
  const g=svg.append("g"); svg.call(d3.zoom().scaleExtent([.3,3]).on("zoom",e=>g.attr("transform",e.transform)));
  const nodes=data.nodes.map(d=>Object.assign({},d)), links=data.links.map(l=>Object.assign({},l));
  const r=d=>d.seed?11:Math.max(4,Math.min(10,3+Math.sqrt(d.deg)*1.4));
  const link=g.append("g").selectAll("line").data(links).join("line").attr("class","gl");
  const node=g.append("g").selectAll("g").data(nodes).join("g").attr("class",d=>"gn"+(d.seed?" seed":"")+(G.sel===d.id?" sel":""));
  node.append("circle").attr("r",r).attr("class",d=>"gk-"+d.type);
  node.append("text").attr("x",d=>r(d)+4).attr("y",4).text(d=>d.seed||d.deg>=6||G.sel===d.id?(d.label.length>34?d.label.slice(0,33)+"…":d.label):"");
  node.append("title").text(d=>NODE_KIND[d.type]+": "+d.label);
  const sim=d3.forceSimulation(nodes).force("link",d3.forceLink(links).id(d=>d.id).distance(l=>l.source.seed||l.target.seed?70:50).strength(.6)).force("charge",d3.forceManyBody().strength(-170)).force("center",d3.forceCenter(W/2,H/2)).force("collide",d3.forceCollide().radius(d=>r(d)+3));
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches){sim.stop(); for(let i=0;i<200;i++)sim.tick();}
  const tick=()=>{link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y); node.attr("transform",d=>`translate(${d.x},${d.y})`);};
  sim.on("tick",tick); tick(); G.sim=sim;
  node.call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y;}).on("drag",(e,d)=>{d.fx=e.x; d.fy=e.y;}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0); d.fx=null; d.fy=null;}));
  node.on("click",(e,d)=>{G.sel=d.id; const nb=data.kg.adj.get(d.id)||new Set(); node.classed("sel",x=>x.id===d.id).classed("faded",x=>x.id!==d.id&&!nb.has(x.id)); link.classed("hi",l=>l.source.id===d.id||l.target.id===d.id); node.select("text").text(x=>x.id===d.id||nb.has(x.id)||x.seed?(x.label.length>34?x.label.slice(0,33)+"…":x.label):""); $("#gdet").innerHTML=graphDetail(data);});
}

  const layers=VESSEL.map(l=>`<div class="vl ${l.id}"><div class="lab"><b>${esc(l.name)}</b><span>${esc(l.sub)}</span></div><div class="items">${l.items.map(i=>`<button class="vc${flow&&!stepOf[i[0]]?" dimmed":""}" data-vc="${i[0]}" aria-current="${S.ovSel===i[0]}">${stepOf[i[0]]?`<span class="stp">${stepOf[i[0]]}</span>`:`<span class="st st-${i[3]}"></span>`}${esc(i[1])}</button>`).join("")}</div></div>`).join("");
  return `<section class="ov-hero"><div><span class="eyebrow">Halyard Employer Services · playbook</span><h1>One keel, many services</h1><p>The Living Handbook is the first service built on a reusable playbook. The same governed meaning that assembles a handbook for one employee can assemble a compliance alert, a manager copilot, or a culture survey for every client we serve.</p></div>
    <div class="panel" style="padding:16px 18px;display:grid;gap:10px"><span class="eyebrow">What the handbook reuses today</span><div class="meters" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0"><div class="meter"><b>${distinct}</b><span>components serve ${profs.length} handbook variants</span></div><div class="meter"><b>${placements}</b><span>placements, authored once</span></div><div class="meter"><b>${SVCS.length}</b><span>business-model services linked</span></div><div class="meter"><b>${PESD.laws.length}</b><span>standards traced to passages</span></div></div><button class="btn primary" data-goto="experience" style="justify-self:start">Open the handbook</button></div></section>
  <section class="ov-sec"><h2>How we built it: Keel and North Star</h2><p class="lede">The handbook, Ombudsman, search, Organization and Compliance views are not separate products. They are views from the deck of one vessel. The keel holds governed meaning; Compass and Copilot on the bridge hold none of their own and read it through the hull. Pick a path to number its route through the layers, or click any part.</p>
   <div class="ctrl-row" style="margin-bottom:12px"><div class="seg" role="group" aria-label="Trace a path"><button data-ovflow="" aria-pressed="${!S.ovFlow}">Whole vessel</button>${Object.entries(FLOWS).map(([k,f])=>`<button data-ovflow="${k}" aria-pressed="${S.ovFlow===k}">${esc(f.t)}</button>`).join("")}</div></div>
   <div class="vessel">${layers}</div>
   <div class="legend" style="margin-top:8px"><span><i class="st st-built" style="display:inline-block"></i>Built in this prototype</span><span><i class="st st-sample" style="display:inline-block"></i>Sample or stand-in data</span><span><i class="st st-next" style="display:inline-block"></i>Next on the same keel</span></div>
   ${flow?`<div class="panel vdetail"><span class="eyebrow">Path</span><h3 style="font-size:18px">${esc(flow.t)}</h3><ol class="flowsteps">${flow.steps.map(s=>`<li><div><b>${esc(s[1])}</b> <span>· ${esc(VITEM[s[0]].name)} · ${esc(s[2])}</span></div></li>`).join("")}</ol></div>`
   :`<div class="panel vdetail"><span class="eyebrow">${esc(sel.layer)}</span><h3 style="font-size:18px">${esc(sel.name)}</h3><p style="margin:0">${esc(sel.what)}</p>${sel.view?`<button class="linkbtn" data-goto="${sel.view}" style="justify-self:start">See it in ${esc(VIEW_NAME[sel.view]||sel.view)}</button>`:""}</div>`}
  </section>
  <section class="ov-sec"><h2>What the keel gives each capability</h2><div class="panel tbl-wrap"><table><thead><tr><th>Keel asset</th><th>Enables Compass to…</th><th>Enables Copilot to…</th></tr></thead><tbody>
   ${[["SKOS vocabulary","resolve “sick time” to Paid Sick Leave and rank by meaning","use only managed terms; unknown acronyms trip the breaker"],["Assembly ontology","show exactly which passages apply to a person, and why","answer only from passages that apply"],["Requirements (EARS)","explain why a passage exists","draft text from a requirement"],["HR services ontology","browse who does what, by holon","route questions to the team that owns them"],["Employment standards ontology","trace a passage to the statute behind it","cite only registered sources"],["Compass and principles","filter and explain by value","check drafts against the values order"],["Privacy safeguards","hide what a role may not see","refuse prohibited monitoring language"]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div></section>
  <section class="ov-sec"><h2>The playbook as a template</h2><p class="lede">To build a new value-added service for our clients, follow the same seven steps. Each maps to the knowledge engineering governance lifecycle, and each new service passes the Compass: if it would trade the planet or people for profit, it does not ship.</p>
   <div class="steps7">${PLAY_STEPS.map((s,i)=>`<div class="step7"><span class="n">Step ${i+1}</span><b>${esc(s[0])}</b><span>${esc(s[1])}</span><span class="m">${esc(s[2])}</span></div>`).join("")}</div></section>
  <section class="ov-sec"><h2>Services we can build next on the same keel</h2><p class="lede">Each one extends a service already in our business model and reuses most of what the handbook built.</p>
   <div class="svcgrid">${OFFERS.map(o=>`<div class="panel svccard"><h3>${esc(o.t)}</h3><p>${esc(o.v)}</p><dl><dt>Extends</dt><dd>${BM.node[o.svc]?`<button class="svc-chip" data-svc="${o.svc}"><span class="dot" style="background:${domColor(o.svc)}"></span>${esc(short(BM.node[o.svc].label))}</button>`:esc(o.svc)}</dd><dt>Reuses</dt><dd>${esc(o.reuse)}</dd><dt>New work</dt><dd>${esc(o.fresh)}</dd><dt>Measure</dt><dd>${esc(o.m)}</dd></dl></div>`).join("")}</div></section>
  <section class="ov-sec"><h2>From prototype to build</h2><div class="panel tbl-wrap"><table><thead><tr><th>Layer</th><th>In this prototype</th><th>Target build</th></tr></thead><tbody>
   ${[["Superstructure","One self-contained page with eight views","Embedded in the employee portal, client admin portal and manager tools"],["Bridge","Compass search and Copilot answers in the page","Compass as enterprise search across portals; Copilot through the HR assistant and Microsoft 365"],["Waterline","Law status, effective dates and verification flags","Anti-drift agents watching statute sources, CSA changes and HRIS schemas"],["Hull","Assembly, applicability, breaker and filters run in the browser","Virtual graph over HRIS and payroll, policy engine, MTBH telemetry"],["Keel","Vocabulary, ontologies and requirements embedded as data","Ontologies and registers in a governed repository, compiled to a triple store"],["Ballast","Thresholds, gates and provenance shown in the page","CI pipeline with gates, council approvals and versioned releases"]].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div>
   <p class="note-ai" style="margin-top:10px">Statutes come from the PEO Employment Standards ontology (checked Sep 30, 2026; not legal advice). Company, client, assets and HR data are fictional.</p></section>`;
}

/* ===================== OVERLAYS ===================== */
function closeLayer(){$("#layer").innerHTML="";}
function showTerm(id,anchor){
  const t=TERM[id]; if(!t)return; const r=anchor.getBoundingClientRect();
  $("#layer").innerHTML=`<div class="pop" role="dialog" aria-label="${esc(t.label)}"><span class="eyebrow">${esc(t.scheme)}</span><h5>${esc(t.label)}${t.acr?` (${esc(t.acr)})`:""}</h5><p>${esc(t.def)}</p><dl><dt>Concept</dt><dd>${esc(t.uri)}</dd><dt>Source</dt><dd>${esc(t.source)}</dd><dt>Steward</dt><dd>${esc(t.steward)}</dd></dl></div>`;
  const p=$(".pop"); const w=p.offsetWidth,h=p.offsetHeight; let x=Math.min(Math.max(16,r.left),window.innerWidth-w-16); let y=r.bottom+8; if(y+h>window.innerHeight-16)y=Math.max(16,r.top-h-8);
  p.style.left=x+"px"; p.style.top=y+"px";
}
function showProv(id){
  const c=C[id], pr=S.profile, loc=findSection(id); const a=analyze(plainText(c)); const b=breakerState(a.findings);
  const ts=termsIn(c);
  $("#layer").innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="Provenance for ${id}"><div class="drawer-head"><div><span class="eyebrow">Provenance · ${id}</span><h2>${esc(c.title)}</h2></div><button class="btn sm" data-close>Close</button></div>
  <div class="drawer-body">
   <div class="path"><span>Handbook</span>›<span>${loc?loc.p.id+" "+esc(loc.p.title):"—"}</span>›<span>${loc?loc.s.id:"—"}</span>›<span>${id}</span></div>
   <div class="req"><div class="rid">${c.req.id} · verified by ${esc(c.req.verify)}</div><div style="margin-top:4px">${esc(c.req.text)}</div><div class="cite">Source: ${esc(c.req.source)}</div></div>
   <dl class="kv"><dt>Type</dt><dd>${TYPE_LABEL[c.type]}</dd><dt>Version</dt><dd>v${c.version} · effective ${c.effective}</dd><dt>Owner</dt><dd>${esc(c.owner)}</dd><dt>Applies</dt><dd>${esc(whyApplies(c,pr))}</dd><dt>Values</dt><dd>${c.values.map(v=>`<span class="dot d-${v}"></span> ${VALUES[v].label}`).join(" &nbsp;")}</dd><dt>Terms</dt><dd>${ts.length?ts.map(t=>`<button class="term" data-term="${t}">${esc(TERM[t].label)}</button>`).join(", "):"—"}</dd><dt>Citations</dt><dd class="mono">${c.cites.length?c.cites.map(esc).join("<br>"):"\u2014"}</dd><dt>Requirements</dt><dd>${c.reqs.length?c.reqs.map(rid=>{const r=REQ[rid]; const ch=new Set(jurChain(pr)); const ls=r.laws.map(l=>LAW[l]).filter(l=>l.juris.some(j=>ch.has(j))); return `<div style="margin-bottom:6px"><span class="mod ${r.mod}">${r.mod==="Prohibition"?"MUST NOT":"MUST"}</span> ${esc(r.label)} <span class="party ${(ALLOC[rid]||["—"])[0]}">${esc((ALLOC[rid]||["—"])[0])}</span><div>${ls.map(lawChip).join("")||'<span class="note-ai">No establishing law in this jurisdiction</span>'}</div></div>`}).join(""):"—"}</dd><dt>Delivered by</dt><dd>${c.services.length?c.services.map(id=>`<button class="svc-chip" data-svc="${id}"><span class="dot" style="background:${domColor(id)}"></span>${esc(short(BM.node[id].label))}</button><div class="note-ai" style="margin:2px 0 6px">${esc(short(BM.node[domainOf(id)].label))} \u203a ${esc(short(BM.node[BM.parent[id]].label))}</div>`).join(""):`<span class="pill warn">No delivering service in the business model</span>`}</dd></dl>
   <div class="panel" style="padding:12px 14px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center"><div>${breakerSVG(c.status==="held"?"open":b.state)}</div><div><b class="state-${c.status==="held"?"open":b.state}">Circuit Breaker: ${STATE_COPY[c.status==="held"?"open":b.state].t}</b><div class="note-ai">${a.findings.length} findings, severity sum ${b.total}. Re-checked each time this handbook assembles.</div></div></div>
   <div><span class="eyebrow">Triples</span><pre class="code" style="margin-top:6px">${esc(turtle(c))}</pre></div>
  </div></aside>`;
  $(".drawer .btn")?.focus();
}
function toast(msg){const el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),3200);}

/* ===================== RENDER & EVENTS ===================== */
function render(){
  closeLayer();
  const v={overview:viewOverview,search:viewSearch,compliance:viewCompliance,experience:viewExperience,ombudsman:viewOmbudsman,organization:viewOrganization,studio:viewStudio,assembly:viewAssembly,vocabulary:viewVocabulary}[S.view];
  main().innerHTML=v(); bindProfile();
  if(S.view==="studio")bindStudio();
  if(S.view==="experience"){const f=$("#askform"); f.onsubmit=e=>{e.preventDefault(); ask($("#ask").value)}; const ab=$("#ackbtn"); if(ab)ab.onclick=()=>{S.ack=new Date().toISOString().slice(0,10); store.set("ack",S.ack); render(); toast("Acknowledgment recorded");};}
  if(S.view==="ombudsman"){$("#chatform").onsubmit=e=>{e.preventDefault(); const i=$("#chatin"); const q=i.value; i.value=""; ask(q);}; renderMsgs();}
  if(S.view==="search"){$("#nsform").onsubmit=e=>{e.preventDefault(); S.nsQ=$("#nsq").value; S.nsKind=""; render();}; if(S.nsLevel>=4&&S.nsQ.trim())nsAnswer();}
  if(S.view==="organization"){const i=$("#orgq"); i.oninput=()=>{S.orgQ=i.value; const p=i.selectionStart; render(); const n=$("#orgq"); n.focus(); n.setSelectionRange(p,p);};}
  if(S.view==="vocabulary"){const i=$("#vq"); i.oninput=()=>{S.vq=i.value; const p=i.selectionStart; render(); const n=$("#vq"); n.focus(); n.setSelectionRange(p,p);};}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-term],[data-prov],[data-open],[data-goto],[data-lens],[data-q],[data-sel],[data-scheme],[data-close],[data-svc],[data-org],[data-orglens],[data-arrange],[data-line],[data-principle],[data-askabout],[data-law],[data-gapdraft],[data-rung],[data-kind],[data-nsq],[data-vc],[data-ovflow],[data-gdepth],[data-gsel],[data-gact],[data-gclose],[data-opengraph],.nav button");
  if(!t){ if(!e.target.closest(".pop"))closeLayer(); return; }
  if(t.matches(".nav button"))return setView(t.dataset.view);
  if(t.hasAttribute("data-gclose"))return closeGraph();
  if(t.hasAttribute("data-opengraph"))return openGraph();
  if(t.dataset.gdepth){G.depth=+t.dataset.gdepth; return renderGraph();}
  if(t.dataset.gsel){G.sel=t.dataset.gsel; const det=$("#gdet"); if(det)det.innerHTML=graphDetail(graphData()); return;}
  if(t.dataset.gact){graphAction(t.dataset.gact,t.dataset.gid); const det=$("#gdet"); if(det)det.innerHTML=graphDetail(graphData()); return;}
  if(G.open&&(t.dataset.open||t.dataset.svc||t.dataset.law)){G.open=false; if(G.sim)G.sim.stop(); $("#gwrap")?.remove();}
  if(t.dataset.law)return showLaw(t.dataset.law);
  if(t.dataset.gapdraft)return gapDraft(t.dataset.gapdraft);
  if(t.dataset.rung){S.nsLevel=+t.dataset.rung; S.nsAnswer=null; const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.dataset.kind!=null&&t.classList.contains("facet")){S.nsKind=t.dataset.kind; const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.dataset.nsq){S.nsQ=t.dataset.nsq; S.nsKind=""; if(S.view!=="search")setView("search"); else render(); return;}
  if(t.dataset.vc){S.ovSel=t.dataset.vc; S.ovFlow=""; const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.dataset.ovflow!=null&&t.closest(".seg")){S.ovFlow=t.dataset.ovflow; const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.dataset.term){e.stopPropagation(); return showTerm(t.dataset.term,t);}
  if(t.dataset.prov)return showProv(t.dataset.prov);
  if(t.dataset.svc)return openOrg(t.dataset.svc);
  if(t.dataset.line)return openOrg(t.dataset.line);
  if(t.dataset.principle)return openOrg(t.dataset.principle);
  if(t.dataset.askabout){const sv=BM.node[t.dataset.askabout]; return ask("How does "+short(sv.label).toLowerCase()+" work for me?");}
  if(t.dataset.arrange){S.arrange=t.dataset.arrange; render(); return;}
  if(t.dataset.orglens){S.orgLens=t.dataset.orglens; S.orgQ=""; if(S.orgLens==="values"&&!PRINC[S.orgSel]&&!SAFE[S.orgSel])S.orgSel="ValueIntegrity"; if(S.orgLens==="lines"&&!LINE[S.orgSel]&&!BM.lines[S.orgSel])S.orgSel="ServiceLineValuesStewardship"; if(S.orgLens==="lines")S.orgOpen.add("ServiceLineValuesStewardship"); render(); return;}
  if(t.dataset.org){const id=t.dataset.org; if(BM.kind[id]==="domain"||BM.kind[id]==="subdomain"||LINE[id]){ if(S.orgSel===id&&S.orgOpen.has(id))S.orgOpen.delete(id); else S.orgOpen.add(id);} S.orgSel=id; const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.hasAttribute("data-close"))return closeLayer();
  if(t.dataset.open){const id=t.dataset.open; const c=C[id]; if(c&&c.status!=="held"&&applies(c,S.profile)){setView("experience"); setTimeout(()=>{const el=document.getElementById(id); el?.scrollIntoView({block:"center"}); },40);} else showProv(id); return;}
  if(t.dataset.goto)return setView(t.dataset.goto);
  if(t.dataset.lens){S.lens=S.lens===t.dataset.lens?null:t.dataset.lens; const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.dataset.q)return ask(t.dataset.q);
  if(t.dataset.sel){S.asmSel=t.dataset.sel; const y=window.scrollY; render(); window.scrollTo(0,y); return;}
  if(t.dataset.scheme){S.vscheme=t.dataset.scheme; render(); return;}
});
document.addEventListener("change",e=>{const t=e.target; if(t.dataset&&t.dataset.gtype){t.checked?G.types.add(t.dataset.gtype):G.types.delete(t.dataset.gtype); renderGraph();}});
document.addEventListener("submit",e=>{if(e.target.id==="railsearch"){e.preventDefault(); S.nsQ=$("#railq").value; S.nsKind=""; S.nsAnswer=null; setView("search");}});
document.addEventListener("keydown",e=>{ if(e.key==="/"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"")){e.preventDefault(); const i=$("#nsq")||$("#railq"); i?.focus(); return;}
  if(e.key==="Escape"&&G.open){closeGraph(); return;}
  if(e.key==="Escape")closeLayer(); if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.sel){S.asmSel=e.target.dataset.sel; render();} });

function isDark(){const t=document.documentElement.getAttribute("data-theme"); return t?t==="dark":!!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);}
function syncThemeBtn(){const b=document.getElementById("themebtn"); if(!b)return; const d=isDark(); b.setAttribute("aria-pressed",String(d)); const lbl=d?"Switch to light mode":"Switch to dark mode"; b.setAttribute("aria-label",lbl); b.title=lbl; b.querySelector("path").setAttribute("d",d?"M8 4.5a3.5 3.5 0 1 1 0 7 3.5 3.5 0 0 1 0-7ZM8 0v2.5M8 13.5V16M0 8h2.5M13.5 8H16M2.3 2.3l1.8 1.8M11.9 11.9l1.8 1.8M2.3 13.7l1.8-1.8M11.9 4.1l1.8-1.8":"M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7Z"); b.querySelector("path").setAttribute("stroke",d?"currentColor":"none"); b.querySelector("path").setAttribute("stroke-width","1.5");}
if(typeof document!=="undefined"&&document.getElementById("themebtn")){
  const saved=store.get("theme",null); if(saved)document.documentElement.setAttribute("data-theme",saved);
  document.getElementById("themebtn").addEventListener("click",()=>{const next=isDark()?"light":"dark"; document.documentElement.setAttribute("data-theme",next); store.set("theme",next); syncThemeBtn(); if(G.open)renderGraph();});
  try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncThemeBtn)}catch(e){}
  syncThemeBtn();
}
if(typeof document!=="undefined"&&document.getElementById("main")){
  render();
  try{ window.claude?.use?.("sample").then(s=>{ if(s){SAMPLE=s; if(S.view==="studio"||S.view==="ombudsman"){const y=window.scrollY; render(); window.scrollTo(0,y);} } }).catch(()=>{}); }catch(e){}
}
</script>
