<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gulfstream Capability Model</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
    :root {
        --canvas: #f4f6f8;
        --paper: #ffffff;
        --paper-alt: #f8fafb;
        --border: #dde3e8;
        --ink: #1b2733;
        --slate: #56687a;
        --slate-soft: #7c8b9a;
        --accent-domain: #2980b9;
        --accent-domain-bg: #eaf3fa;
        --accent-cap: #c2410c;
        --accent-cap-bg: #fdf1ea;
        --core-color: #0f766e;
        --commercial-color: #b45309;
        --enabling-color: #4338ca;
        --shadow: 0 1px 2px rgba(27,39,51,0.06), 0 8px 20px -12px rgba(27,39,51,0.12);
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --canvas: #0f1620;
            --paper: #161f2b;
            --paper-alt: #1b2532;
            --border: #2a3542;
            --ink: #e8edf2;
            --slate: #9aa9b8;
            --slate-soft: #71818f;
            --accent-domain: #5ba8db;
            --accent-domain-bg: #1b2f3d;
            --accent-cap: #f0733a;
            --accent-cap-bg: #2c1c11;
            --core-color: #34a897;
            --commercial-color: #d99a4e;
            --enabling-color: #8b7ff0;
            --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -12px rgba(0,0,0,0.5);
        }
    }
    :root[data-theme="dark"] {
        --canvas: #0f1620;
        --paper: #161f2b;
        --paper-alt: #1b2532;
        --border: #2a3542;
        --ink: #e8edf2;
        --slate: #9aa9b8;
        --slate-soft: #71818f;
        --accent-domain: #5ba8db;
        --accent-domain-bg: #1b2f3d;
        --accent-cap: #f0733a;
        --accent-cap-bg: #2c1c11;
        --core-color: #34a897;
        --commercial-color: #d99a4e;
        --enabling-color: #8b7ff0;
        --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -12px rgba(0,0,0,0.5);
    }

    * { box-sizing: border-box; }
    body {
        font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--canvas);
        color: var(--ink);
        margin: 0;
        padding: 2rem 1.5rem 4rem;
    }

    .page { max-width: 1240px; margin: 0 auto; }

    header.hero { text-align: center; margin-bottom: 1.75rem; }
    h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 0.35rem; text-wrap: balance; }
    p.subtitle { color: var(--slate); margin: 0; font-size: 0.95rem; }
    .eyebrow {
        display: inline-flex; align-items: center; gap: 0.4rem;
        font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; font-weight: 600;
        letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-cap);
        background: var(--accent-cap-bg); padding: 0.25rem 0.6rem; border-radius: 999px;
        margin-bottom: 0.75rem;
    }

    .control-panel {
        background: var(--paper); border: 1px solid var(--border); border-radius: 12px;
        box-shadow: var(--shadow); padding: 1.1rem 1.3rem; margin-bottom: 1.75rem;
        display: flex; flex-direction: column; gap: 0.9rem;
    }
    .control-row { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .control-row.between { justify-content: space-between; }
    .control-label {
        font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--slate-soft); white-space: nowrap;
    }

    .view-toggle { display: flex; background: var(--paper-alt); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
    .view-btn {
        border: none; background: transparent; padding: 0.4rem 0.9rem; font-size: 0.82rem; font-weight: 600;
        color: var(--slate); cursor: pointer; border-radius: 6px; transition: background 0.15s, color 0.15s;
    }
    .view-btn.active { background: var(--accent-domain); color: #fff; }
    .view-btn.active[data-view="capability"] { background: var(--accent-cap); }

    .chip-row { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .filter-chip {
        border: 1px solid var(--border); background: var(--paper-alt); color: var(--slate);
        padding: 0.35rem 0.8rem; border-radius: 999px; font-size: 0.78rem; font-weight: 600;
        cursor: pointer; transition: var(--transition, all 0.15s ease);
    }
    .filter-chip:hover { border-color: var(--accent-domain); color: var(--ink); }
    .filter-chip.active { background: var(--accent-domain); border-color: var(--accent-domain); color: #fff; }
    #capability-filters .filter-chip.active { background: var(--accent-cap); border-color: var(--accent-cap); }

    /* ---------- Domain view ---------- */
    #domain-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.1rem; }

    .domain-card {
        background: var(--paper); border: 1px solid var(--border); border-radius: 12px;
        box-shadow: var(--shadow); overflow: hidden;
        transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .domain-card.filtered-out { opacity: 0.12; transform: scale(0.98); pointer-events: none; }

    .domain-header { padding: 1.1rem 1.2rem 1rem; border-bottom: 1px solid var(--border); border-top: 3px solid var(--cat-color, var(--accent-domain)); }
    .domain-eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 0.65rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cat-color, var(--accent-domain)); margin-bottom: 0.3rem; }
    .domain-title { font-size: 1.05rem; font-weight: 700; margin: 0 0 0.35rem; letter-spacing: -0.005em; }
    .domain-description { font-size: 0.85rem; color: var(--slate); margin: 0 0 0.65rem; line-height: 1.4; }
    .domain-caps { display: flex; flex-wrap: wrap; gap: 0.3rem; }

    .badge {
        display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 0.18rem 0.55rem;
        border-radius: 5px; line-height: 1.5; white-space: nowrap;
    }
    .badge.cap { background: var(--accent-cap-bg); color: var(--accent-cap); cursor: pointer; }
    .badge.cap:hover { filter: brightness(0.95); }
    .badge.dom { background: var(--dom-color-bg, var(--accent-domain-bg)); color: var(--dom-color, var(--accent-domain)); cursor: pointer; }
    .badge.dom:hover { filter: brightness(0.95); }
    .badge.svc { background: var(--paper-alt); color: var(--slate); border: 1px solid var(--border); }

    .services-list { padding: 0.9rem 1.2rem 1.1rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .service-item { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .service-title {
        background: var(--paper-alt); padding: 0.6rem 0.8rem; font-weight: 600; font-size: 0.87rem;
        cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
    }
    .service-title:hover { background: var(--accent-domain-bg); }
    .chevron { font-size: 0.7rem; color: var(--slate-soft); transition: transform 0.2s ease; flex-shrink: 0; }
    .service-item.expanded .chevron { transform: rotate(90deg); }
    .service-body { display: none; padding: 0.7rem 0.9rem 0.85rem; border-top: 1px solid var(--border); }
    .service-item.expanded .service-body { display: block; }
    .service-body-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate-soft); margin: 0 0 0.4rem; }
    .service-body-label:not(:first-child) { margin-top: 0.7rem; }
    ul.process-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.3rem; }
    .process-item { font-size: 0.83rem; color: var(--slate); position: relative; padding-left: 1.1rem; line-height: 1.4; }
    .process-item::before { content: '↪'; position: absolute; left: 0; color: var(--accent-domain); font-weight: 700; }
    .service-cap-row { display: flex; flex-wrap: wrap; gap: 0.3rem; }

    /* ---------- Capability view ---------- */
    #capability-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.1rem; }
    .capability-card {
        background: var(--paper); border: 1px solid var(--border); border-radius: 12px;
        box-shadow: var(--shadow); padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: 0.75rem;
        transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .capability-card.filtered-out { opacity: 0.12; transform: scale(0.98); pointer-events: none; }
    .capability-head { display: flex; align-items: flex-start; gap: 0.7rem; }
    .capability-icon {
        width: 34px; height: 34px; border-radius: 8px; background: var(--accent-cap-bg); color: var(--accent-cap);
        display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1rem;
    }
    .capability-title { font-size: 1rem; font-weight: 700; margin: 0 0 0.2rem; letter-spacing: -0.005em; }
    .capability-description { font-size: 0.83rem; color: var(--slate); margin: 0; line-height: 1.42; }
    .capability-section-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--slate-soft); margin: 0 0 0.4rem; }
    .capability-section { border-top: 1px solid var(--border); padding-top: 0.65rem; }
    .stat-row { display: flex; gap: 1.25rem; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
    .stat { display: flex; flex-direction: column; }
    .stat b { font-size: 1.15rem; color: var(--ink); line-height: 1.1; }
    .stat span { font-size: 0.63rem; color: var(--slate-soft); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.15rem; }

    .theme-toggle {
        width: 34px; height: 34px; flex-shrink: 0; border-radius: 8px; border: 1px solid var(--border);
        background: var(--paper-alt); color: var(--slate); display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .theme-toggle:hover { border-color: var(--accent-domain); color: var(--ink); }
    .theme-toggle svg { width: 17px; height: 17px; }
    .theme-toggle .icon-moon { display: none; }
    .theme-toggle .icon-sun { display: block; }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .theme-toggle .icon-sun { display: none; }
        :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: block; }
    }
    :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
    :root[data-theme="light"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="light"] .theme-toggle .icon-moon { display: none; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--slate-soft); font-size: 0.9rem; }

    @media (max-width: 640px) {
        .control-row.between { flex-direction: column; align-items: flex-start; }
    }
</style>
</head>

<div class="page">
    <header class="hero">
        <div class="eyebrow">v2.0 · Capability Layer</div>
        <h1>Gulfstream Aerospace Business Model</h1>
        <p class="subtitle">An interactive domain map — now with the cross-cutting capabilities that connect services back to every domain they support.</p>
    </header>

    <div class="control-panel">
        <div class="control-row between">
            <div class="control-row">
                <span class="control-label">View</span>
                <div class="view-toggle" id="view-toggle">
                    <button class="view-btn active" data-view="domain">By Domain</button>
                    <button class="view-btn" data-view="capability">By Capability</button>

            </div>
            <div class="control-row" style="gap: 1rem;">
                <div class="stat-row" id="header-stats"></div>
                <button class="theme-toggle" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle light and dark theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>
        <div class="control-row" id="domain-filter-row">
            <span class="control-label">Operation</span>
            <div class="chip-row" id="ontology-filters"></div>
        </div>
        <div class="control-row" id="capability-filter-row" style="display:none;">
            <span class="control-label">Domain category</span>
            <div class="chip-row" id="capability-filters"></div>

    </div>

    <div id="domain-container"></div>
    <div id="capability-container" style="display:none;"></div>
</div>

    let capabilityFilter = 'all';

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function capBadge(label) { return `<span class="badge cap" data-jump-cap="${escapeHtml(label)}">${escapeHtml(label)}</span>`; }
    function domBadge(title, color) {
        return `<span class="badge dom" data-jump-dom="${escapeHtml(title)}" style="--dom-color:${color};--dom-color-bg:color-mix(in srgb, ${color} 14%, transparent)">${escapeHtml(title)}</span>`;
    }

    // ---------------- Domain view ----------------
    function renderDomainFilters() {
        const target = document.getElementById('ontology-filters');
        const keys = ['all', 'business', 'commercial', 'customer-support', 'supply-chain', 'manufacturing'];
        target.innerHTML = keys.map(k =>
            `<button class="filter-chip ${k === domainFilter ? 'active' : ''}" data-ontology="${k}">${ONTOLOGY_LABEL[k]}</button>`
        ).join('');
    }

    function renderService(service) {
        return `
            <div class="service-item">
                <div class="service-title">
                    <span>${escapeHtml(service.title)}</span>
                    <span class="chevron">&#9656;</span>
                </div>
                <div class="service-body">
                    ${service.capabilities.length ? `
                        <div class="service-body-label">Enables Capability</div>
                        <div class="service-cap-row">${service.capabilities.map(capBadge).join('')}</div>
                    ` : ''}
                    <div class="service-body-label">Underlying Processes</div>
                    <ul class="process-list">${service.processes.map(p => `<li class="process-item">${escapeHtml(p)}</li>`).join('')}</ul>
                </div>
            </div>`;
    }

    function renderDomains() {
        const target = document.getElementById('domain-container');
        if (!model.domains.length) { target.innerHTML = '<div class="empty-state">No domains in this model.</div>'; return; }
        target.innerHTML = model.domains.map(d => `
            <div class="domain-card" id="domain-${d.id}" data-ontologies="${d.ontologies.join(' ')}" style="--cat-color:${CATEGORY_COLOR[d.category]}">
                <div class="domain-header">
                    <div class="domain-eyebrow">${escapeHtml(d.category)} Domain</div>
                    <h3 class="domain-title">${escapeHtml(d.title)}</h3>
                    <p class="domain-description">${escapeHtml(d.description)}</p>
                    ${d.capabilities.length ? `<div class="domain-caps">${d.capabilities.map(capBadge).join('')}</div>` : ''}
                </div>
                <div class="services-list">${d.services.map(renderService).join('')}</div>
            </div>
        `).join('');
    }

    function applyDomainFilter() {
        document.querySelectorAll('#ontology-filters .filter-chip').forEach(b => b.classList.toggle('active', b.dataset.ontology === domainFilter));
        document.querySelectorAll('.domain-card').forEach(card => {
            const match = domainFilter === 'all' || card.getAttribute('data-ontologies').split(' ').includes(domainFilter);
            card.classList.toggle('filtered-out', !match);
        });
    }

    // ---------------- Capability view ----------------
    function renderCapabilityFilters() {
        const target = document.getElementById('capability-filters');
        const cats = ['all', 'Core', 'Commercial', 'Enabling'];
        target.innerHTML = cats.map(c =>
            `<button class="filter-chip ${c === capabilityFilter ? 'active' : ''}" data-category="${c}">${c === 'all' ? 'All Categories' : c}</button>`
        ).join('');
    }

    function renderCapabilities() {
        const target = document.getElementById('capability-container');
        if (!model.capabilities.length) { target.innerHTML = '<div class="empty-state">No capabilities in this model.</div>'; return; }
        target.innerHTML = model.capabilities.map(c => `
            <div class="capability-card" id="capability-${c.id}" data-categories="${c.supports.map(s => s.category).join(' ')}">
                <div class="capability-head">
                    <div class="capability-icon">&#9889;</div>
                    <div>
                        <h3 class="capability-title">${escapeHtml(c.title)}</h3>
                        <p class="capability-description">${escapeHtml(c.description)}</p>
                    </div>
                </div>
                <div class="capability-section">
                    <div class="capability-section-label">Enabled By (${c.enabledBy.length})</div>
                    <div class="chip-row">${c.enabledBy.map(e => `<span class="badge svc" title="${escapeHtml(e.domain)}">${escapeHtml(e.service)}</span>`).join('')}</div>
                </div>
                <div class="capability-section">
                    <div class="capability-section-label">Supports Domain (${c.supports.length})</div>
                    <div class="chip-row">${c.supports.map(s => domBadge(s.domain, s.color)).join('')}</div>
                </div>
            </div>
        `).join('');
    }

    function applyCapabilityFilter() {
        document.querySelectorAll('#capability-filters .filter-chip').forEach(b => b.classList.toggle('active', b.dataset.category === capabilityFilter));
        document.querySelectorAll('.capability-card').forEach(card => {
            const match = capabilityFilter === 'all' || card.getAttribute('data-categories').split(' ').includes(capabilityFilter);
            card.classList.toggle('filtered-out', !match);
        });
    }

    // ---------------- View switching ----------------
    function setView(view) {
        currentView = view;
        document.querySelectorAll('#view-toggle .view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
        document.getElementById('domain-container').style.display = view === 'domain' ? 'grid' : 'none';
        document.getElementById('capability-container').style.display = view === 'capability' ? 'grid' : 'none';
        document.getElementById('domain-filter-row').style.display = view === 'domain' ? 'flex' : 'none';
        document.getElementById('capability-filter-row').style.display = view === 'capability' ? 'flex' : 'none';
    }

    function jumpToCapability(label) {
        const cap = model.capabilities.find(c => c.title === label);
        if (!cap) return;
        setView('capability');
        capabilityFilter = 'all';
        applyCapabilityFilter();
        const el = document.getElementById('capability-' + cap.id);
        if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.animate([{ boxShadow: '0 0 0 3px var(--accent-cap)' }, { boxShadow: '0 0 0 0px transparent' }], { duration: 1100 }); }
    }
    function jumpToDomain(title) {
        const dom = model.domains.find(d => d.title === title);
        if (!dom) return;
        setView('domain');
        domainFilter = 'all';
        applyDomainFilter();
        const el = document.getElementById('domain-' + dom.id);
        if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.animate([{ boxShadow: '0 0 0 3px var(--accent-domain)' }, { boxShadow: '0 0 0 0px transparent' }], { duration: 1100 }); }
    }

    // ---------------- Event delegation ----------------
    document.getElementById('view-toggle').addEventListener('click', e => {
        const btn = e.target.closest('.view-btn');
        if (btn) setView(btn.dataset.view);
    });
    document.getElementById('ontology-filters').addEventListener('click', e => {
        const btn = e.target.closest('.filter-chip');
        if (btn) { domainFilter = btn.dataset.ontology; applyDomainFilter(); }
    });
    document.getElementById('capability-filters').addEventListener('click', e => {
        const btn = e.target.closest('.filter-chip');
        if (btn) { capabilityFilter = btn.dataset.category; applyCapabilityFilter(); }
    });
    document.getElementById('domain-container').addEventListener('click', e => {
        const capBtn = e.target.closest('[data-jump-cap]');
        if (capBtn) { jumpToCapability(capBtn.dataset.jumpCap); return; }
        const title = e.target.closest('.service-title');
        if (title) title.closest('.service-item').classList.toggle('expanded');
    });
    document.getElementById('capability-container').addEventListener('click', e => {
        const domBtn = e.target.closest('[data-jump-dom]');
        if (domBtn) jumpToDomain(domBtn.dataset.jumpDom);
    });

    // ---------------- Header stats ----------------
    function renderStats() {
        const totalServices = model.domains.reduce((n, d) => n + d.services.length, 0);
        const totalProcesses = model.domains.reduce((n, d) => n + d.services.reduce((m, s) => m + s.processes.length, 0), 0);
        const cards = [
            [model.domains.length, 'Domains'], [totalServices, 'Services'],
            [model.capabilities.length, 'Capabilities'], [totalProcesses, 'Processes']
        ];
        document.getElementById('header-stats').innerHTML = cards.map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
    }

    // ---------------- Theme toggle ----------------
    // localStorage is per-viewer/per-origin for a published artifact; treat it purely as
    // a convenience for remembering an explicit choice, and fail quiet if it's unavailable.
    function getStoredTheme() {
        try { return localStorage.getItem('gulfstream-cap-model-theme'); } catch (e) { return null; }
    }
    function setStoredTheme(v) {
        try { localStorage.setItem('gulfstream-cap-model-theme', v); } catch (e) {}
    }
    function applyTheme(theme) {
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
        else document.documentElement.removeAttribute('data-theme');
    }
    function effectiveTheme() {
        const stamped = document.documentElement.getAttribute('data-theme');
        if (stamped) return stamped;
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    applyTheme(getStoredTheme()); // null/missing -> follow system, same as an un-stamped page
    document.getElementById('theme-toggle').addEventListener('click', () => {
        const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        setStoredTheme(next);
    });

    renderDomainFilters();
    renderCapabilityFilters();
    renderDomains();
    renderCapabilities();
    renderStats();
    setView('domain');
})();
</script>

</body>
</html>
